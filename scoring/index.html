<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BodyPilot · 医生盲评打分</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2430;--muted:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#059669;--warn:#b45309;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:16px;margin:0 10px 0 0}
.rater input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:130px}
.progress{flex:1;min-width:160px;display:flex;align-items:center;gap:8px}
.pbar{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.pbar>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.ptext{font-size:12px;color:var(--muted);white-space:nowrap}
select#jump{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;max-width:170px}
button{padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:var(--ink)}
button:hover{background:#f3f4f6}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{opacity:.92}
main{max-width:1560px;margin:0 auto;padding:14px 20px 60px}
.case-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.case-head .cc{font-size:18px;font-weight:700}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#e0e7ff;color:#3730a3}
.ctx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;white-space:pre-wrap;font-size:13px;color:#374151;margin-bottom:14px;max-height:240px;overflow-y:auto}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cand{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cand h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px;background:#fafafa}
.advice{white-space:pre-wrap;font-size:13px;color:#374151;padding:12px 14px;max-height:340px;overflow-y:auto;flex:1}
.scorebox{border-top:1px solid var(--line);padding:10px 14px;background:#fcfcfd}
.dim{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.dim .dn{width:118px;font-size:12.5px;color:#374151;flex-shrink:0}
.dim .dw{font-size:10.5px;color:var(--muted)}
.likert{display:flex;gap:4px}
.likert button{width:30px;height:28px;padding:0;border-radius:6px;font-size:13px}
.likert button.sel{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.likert button.sel.low{background:var(--bad);border-color:var(--bad)}
.comp{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.comp b{font-size:16px}
.unsafe label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--bad);cursor:pointer}
.comment textarea{width:100%;margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:34px}
.navbar{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px}
.incomplete{color:var(--warn);font-size:12.5px}
.done-mark{color:var(--ok)}
.advice::-webkit-scrollbar,.ctx::-webkit-scrollbar{width:5px}
.advice::-webkit-scrollbar-thumb,.ctx::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;border-radius:10px;padding:8px 14px;font-size:12.5px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>BodyPilot · 盲评打分</h1>
  <span class="rater">评审ID <input id="rater" placeholder="如 R1" maxlength="20"></span>
  <div class="progress"><div class="pbar"><div id="pfill"></div></div><span class="ptext" id="ptext"></span></div>
  <select id="jump"></select>
  <button onclick="submitToServer()" class="primary" id="submitbtn" style="display:none">提交评分</button>
  <button onclick="exportCSV()" class="primary" id="exportbtn">导出 CSV</button>
  <button onclick="exportJSON()">备份 JSON</button>
</header>
<main>
  <div class="notice">每个维度 1–5 分，总分为五个维度之和（满分 25）。评分自动保存在本机浏览器中（按评审ID区分），可分多次完成，最后点「提交评分」上传。</div>
  <div id="app"></div>
  <div class="navbar">
    <button onclick="nav(-1)">← 上一例</button>
    <span id="navinfo" style="font-size:13px;color:var(--muted)"></span>
    <button onclick="nav(1)">下一例 →</button>
  </div>
</main>
<script>
const CASES = [{"case_code": "C3B1A5", "adherence": "low", "context": "【病例 C3B1A5】\n基本信息：性别=F，年龄=None，身高=172.0cm\n本期初始体成分（2025-06-24）：体重(kg)=76.0；BMI=25.7；体脂率(%)=32.9；体脂肪量(kg)=25.0；骨骼肌量(kg)=28.0；InBody评分=73.0；基础代谢(kcal)=1472.0\n本期记录的行为（2025-06-24 至 2025-07-12，共 17 天）：\n  饮食打卡 1 条，覆盖 1 个打卡日，打卡日记录热量均值约 None kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：—；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体重76.0kg、BMI25.7，处于轻度超重，体脂率32.9%偏高，骨骼肌量28.0kg尚可，整体仍有改善空间。\n- 您对饮食结构调整的反应通常较好，但在减重过程中容易伴随少量肌肉流失，需在控热量的同时注意保留肌肉。\n- 您本期记录较少，依从性偏低，建议先从一个最易坚持的小习惯入手，逐步建立记录与执行的节奏。\n\n②饮食建议\n- 本期只聚焦一件事：每天保证一份优质蛋白（如鸡蛋、牛奶、豆制品、鱼或瘦肉），三餐均匀分配，帮助减脂时守住肌肉。\n- 控制精制主食与含糖饮料，主食可换成一半粗杂粮，每日热量不低于1200kcal，避免过度节食。\n- 记录可极简：每天只拍照或简单记下一餐即可，目标是养成习惯而非追求完整。\n\n③运动建议\n- 优先安排每周2-3次、每次20分钟的快走或慢跑等有氧运动，从能轻松坚持的强度开始。\n- 每周加入1-2次简单力量练习（如靠墙静蹲、深蹲、弹力带训练），重点防止肌肉流失。\n- 把运动与日常绑定，如固定饭后散步，降低坚持难度。\n\n④下一周期目标\n- 体重下降约1-1.5kg，体脂率下降约0.8-1个百分点，骨骼肌量尽量维持不降。\n- 饮食打卡覆盖至少8天，运动累计完成6次以上。\n- 核心目标是先稳定记录与蛋白摄入两个习惯，为后续持续改善打好基础。"}, {"label": "乙", "advice": "① 总体评估\n- 您当前体重76.0kg，BMI 25.7，体脂率32.9%偏高，骨骼肌量28.0kg基础尚可，InBody评分73分，整体属于体脂偏高、肌肉量可保的状态。\n- 本期17天仅1条饮食打卡、无运动打卡，记录依从性较低，目前数据难以反映真实摄入与活动情况。\n- 改善关键在于先建立可坚持的小习惯，而非追求一步到位，建议本期只聚焦1-2个最容易做到的改变。\n\n② 饮食建议\n- 第一优先：每天固定记录一餐（如午餐），先把\"记录\"这件事变成习惯，无需追求完整，坚持比完美更重要。\n- 每餐先吃蔬菜和蛋白质（鱼、蛋、豆制品、瘦肉），主食控制在一拳大小，减少含糖饮料与油炸食品。\n- 不建议节食，全天摄入不低于基础代谢需求，保证规律三餐即可。\n\n③ 运动建议\n- 从最易坚持的开始：每天饭后快走15-20分钟，先建立每天动一动的节奏。\n- 适应后每周加入2次简单力量练习（如靠墙静蹲、深蹲），帮助维持骨骼肌量。\n- 把运动和已有日程绑定（如午餐后散步），降低执行门槛，并简单记录一句即可。\n\n④ 下一周期目标\n- 饮食打卡覆盖天数从1天提升到至少每周4天，养成记录习惯。\n- 每周累计快走不少于4次，建立基础活动量。\n- 下期复测体脂率，争取较本期略有下降，体重下降控制在温和范围（约1-2kg），保持骨骼肌量不减。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重76.0kg、BMI25.7，体脂率32.9%偏高，属于减脂的关键阶段，但骨骼肌量28.0kg基础不错，InBody评分73分，说明体成分有较好的改善空间。\n- 您对饮食结构的调整反应较好，但容易在减重时伴随肌肉流失，因此本期重点是稳住肌肉、温和减脂。\n- 您目前的记录依从性较低，建议先从一个最容易坚持的小改变入手，避免一次性给自己太多任务。\n\n②饮食建议\n- 本期只聚焦一件事：每餐先吃一掌心优质蛋白（鸡蛋、鱼虾、瘦肉、豆制品、无糖酸奶），帮助保留肌肉、增强饱腹感。\n- 把含糖饮料和奶茶换成水或无糖茶，这是最省力又见效快的一步，每日热量不低于1200kcal即可，无需刻意挨饿。\n\n③运动建议\n- 先建立习惯而非追求强度：每天快走20分钟，从家附近或通勤路上开始，能坚持比强度更重要。\n- 每周加入2次简单的力量动作，如深蹲、靠墙俯卧撑各2组，有助于维持骨骼肌量、防止减脂掉肌肉。\n\n④下一周期目标\n- 体重温和下降0.5–1kg，体脂率下降约1%，骨骼肌量保持不变即为成功。\n- 行为目标设得低而可达：每周至少完成3天饮食打卡、3次快走，养成记录习惯。\n- 重点关注肌肉留存与坚持度，只要您能稳定执行这两个小改变，后续即可逐步加码。"}]}, {"case_code": "C6DD5E", "adherence": "mid", "context": "【病例 C6DD5E】\n基本信息：性别=F，年龄=28，身高=172.0cm\n本期初始体成分（2025-05-13）：体重(kg)=93.7；BMI=31.7；体脂率(%)=45.7；体脂肪量(kg)=42.9；骨骼肌量(kg)=27.5；InBody评分=55.0；基础代谢(kcal)=1468.0\n本期记录的行为（2025-05-13 至 2025-06-02，共 19 天）：\n  饮食打卡 8 条，覆盖 1 个打卡日，打卡日记录热量均值约 287.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：玉米（鲜）、樱桃番茄（圣女果）、鸡蛋（均值）、蕹菜（空心菜）、红烧茄子、猪肉（瘦）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体重93.7kg、BMI31.7、体脂率45.7%，体脂偏高而骨骼肌量27.5kg处于尚可水平，减脂空间较大，是本期重点方向。\n- 您对饮食调整的反应较好，控制饮食时体重下降较明显，但在减重时容易伴随一定肌肉流失，需同步保护肌肉。\n- 您的饮食记录较零散，仅覆盖单日且无运动记录，提升记录的连续性将帮助更准确评估进度。\n\n②饮食建议\n- 建议每日热量控制在1400-1600 kcal，不低于1000 kcal，营造温和热量缺口，避免过快减重带来的肌肉流失。\n- 每日保证蛋白质约90-110g，可延续鸡蛋、瘦猪肉，并增加鱼虾、豆制品、低脂奶，分配到三餐有助护肌。\n- 保留玉米、空心菜、圣女果等蔬菜与优质主食，红烧茄子等含油较多的菜式减少用油，多用蒸、煮、凉拌。\n- 尽量每天记录饮食，至少覆盖一周5天，便于发现高热量环节。\n\n③运动建议\n- 每周安排3-4次快走、游泳或骑行等有氧运动，每次30-40分钟，从低强度起步逐步增加。\n- 每周加入2次抗阻训练，针对腿、背、核心等大肌群，以保护并提升骨骼肌量。\n- 建议开始记录运动，哪怕简单步数与时长，帮助形成习惯并评估效果。\n\n④下一周期目标\n- 在约3周内体重下降1.5-2.5kg，以减脂为主，骨骼肌量尽量维持不降。\n- 体脂率较初始下降约1-2个百分点，InBody评分稳步上升。\n- 饮食记录覆盖率提升至每周5天以上，并建立每周至少5次运动的规律。"}, {"label": "乙", "advice": "① 总体评估\n- 您当前体重93.7kg、BMI 31.7、体脂率45.7%，整体偏高，以减脂、改善体成分为本期主要方向。\n- 您骨骼肌量27.5kg，在减重时容易伴随肌肉流失，需在控制热量的同时重点保护肌肉。\n- 您的饮食记录仅覆盖1天，行为数据偏少，难以全面反映真实摄入，提升记录的完整度是改善的关键起点。\n\n② 饮食建议\n- 建议全天热量控制在1400-1600 kcal，不低于1000 kcal，在温和热量缺口下稳步减脂。\n- 提高蛋白质摄入，每日按每公斤体重1.2-1.5g安排，多选鸡蛋、瘦猪肉、鱼虾、豆制品，分散到三餐以减少肌肉流失。\n- 您食材选择较健康（玉米、圣女果、空心菜等），可继续保持；注意红烧茄子等菜肴用油偏多，建议改为少油烹调。\n- 每天坚持记录每一餐，争取打卡覆盖天数达到一周5天以上，便于发现摄入问题。\n\n③ 运动建议\n- 目前无运动记录，建议从每周3次、每次30分钟的快走或慢跑等有氧运动起步，逐步建立习惯。\n- 每周安排2次抗阻训练，如深蹲、弓步、弹力带划船等，重点维持下肢与背部肌肉，减少减重中的肌肉流失。\n- 运动循序渐进，避免过量，以微微出汗、能正常说话的强度为宜，并坚持运动打卡。\n\n④ 下一周期目标\n- 体重减少1.5-2.5kg，体脂率下降1%-1.5%，同时尽量保持骨骼肌量不下降。\n- 饮食打卡覆盖天数达到全周期的60%以上，运动打卡每周不少于3次。\n- 以“减脂同时保肌”为核心，优先稳定饮食结构与提升记录依从性，为后续改善打好基础。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为31.7、体脂率45.7%，属于体脂偏高范围，骨骼肌量27.5kg基础尚可，InBody评分55分仍有较大提升空间，核心方向是减 标\n- 饮食记录天数从1天提升到每周至少5天，逐步覆盖全天真实摄入。\n- 累计完成每周3次以上快走或运动打卡。\n- 体重小幅下降1-2kg，体脂率较本期略有降低，循序渐进、稳步推进。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为30.7，体脂率40.4%，属于体脂偏高类型，但骨骼肌量25.9kg基础较好，InBody评分68分，减脂潜力可观。\n- 您对饮食调整的反应较好，但减重时容易伴随肌肉流失，本期需在控热量的同时守住肌肉。\n- 您目前打卡条数较少、覆盖天数有限，记录习惯尚未稳定，是本期最需要改善的环节。\n\n②饮食建议\n- 本期只聚焦一件最易坚持的事：每天固定记录1餐（建议晚餐），帮助您建立真实摄入认知，逐步过渡到全天记录。\n- 保证每日蛋白质摄入，早餐继续保留牛奶+鸡蛋的组合，三餐各安排一份掌心大小的优质蛋白（蛋、奶、瘦肉、豆制品），以减少减重中的肌肉流失。\n- 芒果等高糖水果每日控制在一个拳头大小以内，避免空腹大量进食，优先放在正餐后。\n- 全天热量不低于1200kcal，以规律三餐替代节食，减少含糖饮料。\n\n③运动建议\n- 从最低门槛起步：每天饭后快走20分钟，先建立运动打卡习惯，比强度更重要。\n- 每周安排2次简单力量练习（深蹲、靠墙静蹲、弹力带），每次15分钟，保护骨骼肌。\n- 运动后在平台简单记录，哪怕一句话，帮助维持依从性。\n\n④下一周期目标\n- 体重下降1–1.5kg，体脂率下降约1.5%，骨骼肌量保持不下降。\n- 饮食打卡覆盖天数提升至每周至少4天，新增运动打卡每周3次。\n- 您本期核心任务：稳住记录习惯+守住肌肉，循序渐进即可。"}]}, {"case_code": "C81B20", "adherence": "high", "context": "【病例 C81B20】\n基本信息：性别=F，年龄=41，身高=158.0cm\n本期初始体成分（2025-04-15）：体重(kg)=61.0；BMI=24.4；体脂率(%)=41.7；体脂肪量(kg)=25.4；骨骼肌量(kg)=18.9；InBody评分=62.0；基础代谢(kcal)=1139.0\n本期记录的行为（2025-04-15 至 2025-05-06，共 21 天）：\n  饮食打卡 98 条，覆盖 18 个打卡日，打卡日记录热量均值约 306.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：牛奶、鸡蛋（均值）、鸡胸脯肉、马铃薯（土豆、洋芋）、葱油莴笋、生菜（叶用莴苣）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n-您当前体重61.0kg，BMI24.4处于正常偏高范围，体脂率41.7%偏高，骨骼肌量18.9kg，提示体成分以脂肪偏多、肌肉相对不足为特点，属于“隐性肥胖”倾向。\n-您的饮食记录依从性高（21天中18天打卡），说明自我管理意识强，这是您改善体成分的有利基础。\n-您对饮食调整的反应较好，但在减重时容易伴随肌肉流失，因此本期需在控脂的同时重点保护肌肉。\n\n②饮食建议\n-保证优质蛋白摄入，每日按每公斤体重1.2-1.5g计，约75-90g，分配到三餐，您常吃的鸡蛋、牛奶、鸡胸肉可继续保留并适当增量。\n-请尽量完整记录全天真实摄入，每日总热量建议控制在1300-1500kcal，避免过度低估导致实际进食不足。\n-多选低升糖、高纤维的蔬菜与适量主食，您喜欢的莴笋、生菜可保留，土豆作为主食替代时需相应减少米饭分量。\n-减少烹调用油，优先蒸煮炖，控制每日油脂在25g以内。\n\n③运动建议\n-本期建议补齐运动这一短板，每周进行3-4次抗阻训练（如深蹲、靠墙静蹲、弹力带划船），以增肌护肌、提升基础代谢。\n-每周累计快走或慢跑等有氧150分钟，分5次进行，每次约30分钟，强度以微喘可交谈为宜。\n-请同步做运动打卡，便于评估运动与体成分变化的关系。\n\n④下一周期目标\n-体重下降0.8-1.2kg，体脂率下降1%-1.5%，骨骼肌量保持或略增，避免肌肉流失。\n-饮食打卡覆盖率维持在85%以上，并新增运动打卡每周不少于3次。\n-InBody评分较当前稳步提升，以脂肪减少、肌肉守住为核心衡量标准。"}, {"label": "乙", "advice": "①总体评估\n- 您的BMI为24.4，处于正常偏高区间，但体脂率达41.7%、骨骼肌量18.9kg偏低，属于典型的\"隐性肥胖\"体型，重点在于降脂增肌而非单纯减重。\n- 您的饮食依从性较好，常选用牛奶、鸡蛋、鸡胸肉等优质蛋白，食物结构清晰，说明您对饮食调整的反应较好。\n- 您在减重过程中容易伴 9kg处于中等水平，InBody评分68分有较好的改善空间。\n- 您对饮食调整的反应较好，控制热量摄入时减脂效率明显，但在减重过程中容易伴随骨骼肌流失，需要同步加强蛋白质摄入与抗阻刺激。\n- 您当前饮食记录覆盖天数偏少（20天中仅8天），运动记录缺失，行为追踪的完整性是本期可优先提升的环节。\n\n②饮食建议\n- 建议每日热量控制在1500-1700 kcal区间，制造适度缺口，避免过低摄入导致肌肉流失。\n- 保证优质蛋白，每日按每公斤体重1.2-1.5g摄入（约110-130g），分配到三餐，如鸡蛋、鱼虾、瘦肉、豆制品、低脂奶。\n- 主食选择全谷物、薯类替代部分精米白面，多吃绿叶蔬菜，减少含糖饮料与油炸食物。\n- 提升饮食打卡完整度，争取每日记录三餐，便于精准调整。\n\n③运动建议\n- 本期重点引入抗阻训练，每周3次，覆盖大肌群（深蹲、卧推、划船等），以保住并增长骨骼肌。\n- 每周搭配3-4次中等强度有氧（快走、慢跑、骑行），每次30-40分钟，加速脂肪消耗。\n- 从可坚持的强度起步，并坚持运动打卡，养成稳定习惯。\n\n④下一周期目标\n- 体重下降2-3kg，体脂率降低1.5-2.5个百分点，骨骼肌量保持不变或略增。\n- 饮食打卡覆盖率达80%以上，运动打卡每周不少于4次。\n- InBody评分提升至71分左右，逐步向健康体成分迈进。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重89.7kg，BMI 27.7，属于偏胖范围，体脂率29.1%偏高，提示脂肪堆积是您体成分管理的核心问题。\n- 您的骨骼肌量35.9kg处于中等水平，基础代谢1744kcal尚可，减脂同时应注意保住肌肉，避免单纯减重导致肌肉流失。\n- 您本期饮食打卡覆盖8天、共17条，记录不够连续且缺少运动打卡，依从性中等，行为数据完整度有待提升，建议后续坚持每日记录以便精准调整。\n\n②饮食建议\n- 建议在基础代谢与日常活动基础上制造适度热量缺口，每日总摄入控制在约1800-2000kcal，不要低于1000kcal，循序渐进减脂。\n- 保证蛋白质摄入，每日约1.5g/kg体重（约110-130g），均匀分配到三餐，多选鱼、禽、蛋、豆制品及低脂奶。\n- 主食用全谷物、杂豆替换部分精米白面，增加蔬菜至每日500g，减少含糖饮料、油炸及高脂加工食品。\n- 每日饮食尽量按时记录，覆盖全天而非仅部分餐次，便于评估真实摄入。\n\n③运动建议\n- 您本期无运动打卡，建议从有氧入手，每周进行150分钟以上中等强度运动，如快走、骑行、慢跑，从隔日30分钟逐步增加。\n- 每周安排2-3次抗阻训练，针对大肌群（深蹲、推、拉），保护并提升骨骼肌量。\n- 增加日常活动量，多步行、少久坐，循序渐进避免运动损伤。\n\n④下一周期目标\n- 体重减少1-2kg，体脂率下降1-2个百分点，骨骼肌量尽量维持不降。\n- 饮食打卡覆盖率提升至每周5天以上，并新增运动打卡，逐步建立规律习惯。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重89.7kg，BMI27.7属超重范围，体脂率29.1%偏高，但骨骼肌量35.9kg处于较好水平，InBody评分68分基础尚可，整体属于“减脂为主、保肌为辅”的阶段。\n- 您对饮食调整反应较好，规律的饮食记录有助于控制总能量，是您本期最有价值的抓手。\n- 您在减重过程中容易伴随骨骼肌轻微流失，因此减脂同时需重点保护肌肉，避免单纯依赖控热量。\n\n②饮食建议\n- 建议每日热量控制在1500-1700 kcal区间，制造适度热量缺口，不低于1500 kcal，以避免肌肉流失和代谢下降。\n- 保证蛋白质摄入，按每公斤体重1.5-1.8g计算，约每日130-150g，优先选鸡胸肉、鱼虾、瘦牛肉、蛋类、低脂奶及豆制品，均匀分配到三餐。\n- 主食选全谷杂粮替代部分精白米面，多吃蔬菜增加饱腹感，减少油炸、含糖饮料及高脂加工食品。\n- 提高打卡覆盖率，争取每日记录，尤其完整记录晚餐与加餐，便于评估真实摄入。\n\n③运动建议\n- 本期重点是补齐运动空缺，建议每周3-4次抗阻训练，覆盖胸、背、腿等大肌群，以保护和增长骨骼肌。\n- 配合每周累计150分钟中等强度有氧（快走、慢跑、骑行），分次进行，助力减脂。\n- 每次运动后做好记录，养成运动打卡习惯，便于跟踪效果与调整强度。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，体脂率下降1%-1.5%，骨骼肌量保持稳定或不下降。\n- 饮食打卡覆盖至少15天，新增运动打卡10次以上。\n- 以“稳步减脂、保住肌肉”为核心，逐步提升InBody评分。"}]}, {"case_code": "C0CCFA", "adherence": "low", "context": "【病例 C0CCFA】\n基本信息：性别=F，年龄=32，身高=152.0cm\n本期初始体成分（2024-07-27）：体重(kg)=59.2；BMI=25.6；体脂率(%)=36.8；体脂肪量(kg)=21.8；骨骼肌量(kg)=19.9；InBody评分=69.0；基础代谢(kcal)=1178.0\n本期记录的行为（2024-07-27 至 2024-08-26，共 29 天）：\n  无饮食打卡；运动打卡 1 条，覆盖 1 天；常见运动：游泳（慢）", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为25.6、体脂率36.8%，属于体脂偏高的状态，骨骼肌量尚可，体成分管理重点在于减脂同时守住肌肉。\n- 您对饮食调整的反应较好，体重和体脂下降空间明确，但您在减脂时容易伴随轻度肌肉流失，需兼顾蛋白质摄入。\n- 您目前的记录依从性偏低，本期不追求面面俱到，聚焦1-2个最易坚持的小改变即可见效。\n\n②饮食建议\n- 本期只抓一件事：每天三餐都先吃一拳头蔬菜和一掌心蛋白质（鸡蛋、鱼、豆腐、瘦肉），其余照常，帮助您在不挨饿的情况下自然减少热量。\n- 主食保留但减量，用玉米、红薯等粗粮替换部分白米白面，每餐主食控制在一拳头内。\n- 全天饮食热量不低于1200 kcal，避免节食过度导致肌肉流失。\n\n③运动建议\n- 延续您喜欢的游泳，每周2-3次、每次30分钟左右，这是您容易坚持的方式。\n- 每周增加2次居家简单力量动作（如靠墙静蹲、深蹲、弹力带划船），每次10分钟，帮助保住骨骼肌。\n\n④下一周期目标\n- 体重下降1.5-2kg，体脂率下降1-1.5%，骨骼肌量尽量维持不下降。\n- 行为目标：饮食打卡每周至少3天，运动每周累计完成3次。\n- 优先把“每餐先吃菜和蛋白质”养成习惯，先做到再求多。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI为25.6，体脂率36.8%，属于体脂偏高型，减脂空间明确，骨骼肌量尚可，应在减脂同时守住肌肉。\n- 您对单纯运动的体重反应较慢，且减重时容易出现肌肉流失，本期更应靠规律饮食撬动改善。\n- 您的记录依从性偏低，建议先聚焦1个最易坚持的小习惯，把它做稳。\n\n②饮食建议\n- 本期只抓一个核心动作：每餐先吃一拳蔬菜、一掌瘦蛋白（鸡蛋、鱼虾、豆腐、鸡胸），主食减半，帮助控制总热量并保护肌肉。\n- 每日总热量不低于1200 kcal，避免节食过度导致掉肌肉；用白水或无糖茶替代含糖饮料。\n- 每天用手机随手拍1张正餐照片即可，先养成\"记录\"这一动作，不求完整。\n\n③运动建议\n- 保留您喜欢的慢游泳，每周2次、每次30分钟，作为容易坚持的有氧基础。\n- 每周增加2次居家自重训练（深蹲、靠墙俯卧撑、臀桥各2组），守住骨骼肌量，防止减重掉肌肉。\n- 把运动固定在同一时段，降低坚持难度，运动后及时补充蛋白质。\n\n④下一周期目标\n- 体重下降1.0–1.5kg，体脂率下降约1%，骨骼肌量保持不变。\n- 饮食拍照打卡累计达到15天，运动打卡覆盖8天以上。\n- 优先达成\"每餐蔬菜+蛋白质\"这一项，能稳定做到即为本期成功。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重59.2kg、BMI 25.6属于偏高范围，体脂率36.8%明显偏高，是本期需重点改善的方向。\n- 您的骨骼肌量尚可，基础代谢约1178 kcal，提示减脂时更要注意保留肌肉。\n- 本期您的打卡依从性较低（29天仅1条运动记录），建议先从一个最容易坚持的小习惯入手。\n\n②饮食建议\n- 本期最关键的一步：先做到每天记录一餐，哪怕只拍照，帮助您建立饮食觉察。\n- 每餐先吃蔬菜和蛋白质（鸡蛋、鱼、豆腐、瘦肉），主食减为原来的三分之二，优先粗杂粮。\n- 用白水或无糖茶替代含糖饮料，控制油炸、甜点等高热量食物，每日热量不低于1200 kcal。\n\n③运动建议\n- 延续您喜欢的游泳，把目标定为每周2次、每次30分钟，可持续才是关键。\n- 在不游泳的日子，增加快走20分钟，碎片化达成即可。\n- 每周做2次简单力量练习（深蹲、靠墙俯卧撑各2组），帮助保住肌肉、提升代谢。\n\n④下一周期目标\n- 体重下降1-2kg，体脂率较本期略降，目标循序渐进、不求快。\n- 把运动打卡提升到每周至少2次，饮食每日记录1餐并坚持到下次复测。"}]}, {"case_code": "C51157", "adherence": "high", "context": 量训练，针对腿、背、核心等大肌群，以保护和增长骨骼肌。\n- 运动循序渐进，从低强度起步，避免过量，运动后注意补充蛋白质。\n\n④下一周期目标\n- 4周内体重下降1-1.5kg，体脂率下降0.5-1个百分点，骨骼肌量保持不减。\n- 运动打卡每周不少于3次，饮食打卡覆盖率提升至每周5天以上。\n- 以稳健减脂、维持肌肉为核心，逐步提升InBody评分。"}, {"label": "丙", "advice": "①总体评估\n-您当前BMI为25.3，体脂率39.9%，属于偏高范围，体脂肪量25.2kg、骨骼肌量20.4kg，提示体成分以减脂、保肌为核心方向。\n-您的InBody评分64分，基础代谢约1190kcal，相对偏低，与肌肉量及年龄相关，提升肌肉有助于改善代谢。\n-您饮食记录依从性较好，但仅覆盖3个打卡日，且打卡日热量均值约816kcal，明显偏低，可能存在记录不全或进食不足，建议完整记录每日三餐。\n\n②饮食建议\n-建议全天热量控制在1200-1400kcal，保证均衡而非过度节食，避免基础代谢进一步下降。\n-蛋白质优先：每日摄入约70-80g优质蛋白，延续您已有的鸡蛋、牛奶、牛肉后腿，可增加鱼虾、豆制品。\n-保持芥蓝等蔬菜每日300-500g，主食选择玉米、燕麦等粗杂粮替代部分精米面，控制饺子等高油主食频次。\n-三餐定时定量，细嚼慢咽，减少含糖饮料与油炸食品。\n\n③运动建议\n-本期您无运动打卡，建议从有氧起步：快走、游泳或骑行，每周4-5次，每次30-40分钟，强度以微微出汗、能说话为宜。\n-加入抗阻训练，每周2-3次，针对大腿、臀、背等大肌群，如靠墙深蹲、弹力带训练，以提升肌肉量与基础代谢。\n-避免久坐，每日累计步数争取达到6000-8000步，循序渐进，注意关节保护。\n\n④下一周期目标\n-建议下个周期（约4周）体重减少1-2kg，以减脂为主，保持或增加骨骼肌量。\n-饮食打卡覆盖率提升至每周5天以上，并完整记录全天摄入。\n-建立规律运动习惯，每周累计有氧+抗阻不少于4次，期末复测InBody评估进展。"}]}, {"case_code": "C32143", "adherence": "low", "context": "【病例 C32143】\n基本信息：性别=F，年龄=29，身高=163.0cm\n本期初始体成分（2025-05-21）：体重(kg)=76.1；BMI=28.6；体脂率(%)=40.5；体脂肪量(kg)=30.8；骨骼肌量(kg)=24.7；InBody评分=65.0；基础代谢(kcal)=1347.0\n本期记录的行为（2025-05-21 至 2025-05-28，共 6 天）：\n  饮食打卡 4 条，覆盖 2 个打卡日，打卡日记录热量均值约 225.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：酸奶、鸡蛋（均值）、牛奶、牛俐生菜（油麦菜）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为28.6、体脂率40.5%，属于体脂偏高范围，骨骼肌量尚可，InBody评分65分，主要改善方向是减脂。\n- 本期6天中仅2天有饮食打卡、且记录热量很低（均值约225 kcal），这更可能是漏记，真实摄入难以评估，也无运动记录。\n- 提升记录的完整性，是本阶段最关键的第一步，先看清现状才能精准调整。\n\n②饮食建议\n- 这一周期请只做一件事：每天完整记录三餐（哪怕只拍照），目标连续记录满7天，帮我们掌握真实摄入。\n- 延续您已有的酸奶、鸡蛋、牛奶等优质蛋白习惯，每餐保证一份蛋白质，并搭配油麦菜等蔬菜增加饱腹感。\n- 全天热量不低于1347 kcal（基础代谢），不要跳餐或极端少吃，避免越饿越易暴食。\n\n③运动建议\n- 从最易坚持的方式起步：每天快走20分钟，或晚饭后散步，目标每周累计4天。\n- 不必追求强度，先建立“动起来并打卡”的习惯，把运动打卡纳入每日记录。\n\n④下一周期目标\n- 饮食记录天数从2天提升到至少6天，运动打卡从0次提升到每周4次。\n- 体重小幅下降0.3-0.5kg、体脂率下降0.5%即为良好进展，重在养成可持续习惯而非快速掉秤。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI为28.6、体脂率40.5%，属体脂偏高、骨骼肌量偏少的体型，是本期改善的重点方向。\n- 您在减重过程中容易伴随肌肉流失，因此本期需在控制体脂的同时注重保护肌肉，避免单纯节食。\n- 您的记录依从性偏低、打卡覆盖天数较少，建议先从一个最易坚持的小习惯入手，逐步建立规律。\n\n②饮食建议\n- 您所记录的酸奶 始，先做到“动起来”。\n- 待快走能坚持后，每周加入2次简单抗阻动作（如深蹲、俯卧撑），有助于减脂同时维持肌肉。\n\n④下一周期目标\n- 行为目标：饮食记录覆盖至少10天，运动每周至少打卡3天。\n- 体成分目标：体重下降1-1.5kg，体脂率下降约1%，骨骼肌量保持不低于当前水平。\n- 把重点放在“坚持记录”这一件事上，养成习惯后其余改变会更自然。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重92.2kg、体脂率31.6%、骨骼肌35.8kg，属于超重伴体脂偏高，仍有较大的减脂改善空间。\n- 您对饮食结构调整的反应较好，减重时容易伴随一定肌肉流失，因此本期需在控热量的同时注意保护肌肉。\n- 您本期记录较少（仅1天饮食、无运动打卡），坚持记录与执行是当前最关键的突破口。\n\n②饮食建议\n- 本期只聚焦一个习惯：每天完整记录3餐，哪怕只拍照或简单文字，先把“可见”做到，再谈优化。\n- 三餐保证蛋白质来源（鸡蛋、牛奶、瘦肉、豆制品），早餐已有的鸡蛋牛奶组合可延续，午晚餐各加一掌心瘦肉或鱼。\n- 全天热量建议控制在约1600-1800 kcal，主食用紫薯、米饭等定量替换，不必极端节食。\n\n③运动建议\n- 从最易坚持的开始：每周3次、每次20-30分钟快走或慢跑，先建立运动打卡习惯。\n- 每周安排2次简单抗阻训练（深蹲、俯卧撑、弹力带），帮助您在减重时保住肌肉。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，体脂率下降约1%，骨骼肌量尽量维持不下降。\n- 饮食记录覆盖天数达到一半以上，运动打卡累计达到8次。\n- 以“能坚持”为首要标准，先稳住记录与运动习惯，再逐步提高强度。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重92.2kg，BMI28.8，体脂率31.6%，属于偏高水平，骨骼肌量35.8kg基础尚可，InBody评分65分，改善空间明确。\n- 本期21天仅1天饮食打卡、无运动打卡，记录依从性偏低，目前我们对您真实饮食和活动情况了解有限。\n- 您的紫薯、鸡蛋、牛奶搭配本身是不错的优质蛋白与主食组合，方向值得肯定。\n\n②饮食建议\n- 本周期只需先做好一件事：每天完整记录三餐（哪怕简单拍照），帮我们和您共同看清真实摄入。\n- 在现有基础上保证早餐有蛋白质（鸡蛋或牛奶），避免空腹或随意凑合，有助于稳定一天食欲。\n- 减少含糖饮料和油炸、夜宵类食物，用紫薯、杂粮替代部分精米白面即可，无需刻意大幅节食。\n\n③运动建议\n- 先从最易坚持的开始：每天快走20-30分钟，可在通勤或饭后进行，目标先做到\"动起来\"。\n- 每周尝试2次简单力量练习（如深蹲、俯卧撑各2-3组），保护并提升您的骨骼肌量。\n- 把运动记录在打卡里，哪怕只写\"今天走了20分钟\"，形成可持续的小习惯。\n\n④下一周期目标\n- 饮食打卡天数提升到每周至少4天，逐步覆盖真实摄入。\n- 累计完成至少8次快走或运动记录，建立活动习惯。\n- 下期体重目标下降1-2kg，体脂率小幅下降，重在坚持而非速度。"}]}, {"case_code": "CF56F0", "adherence": "low", "context": "【病例 CF56F0】\n基本信息：性别=F，年龄=40，身高=158.0cm\n本期初始体成分（2025-06-24）：体重(kg)=66.8；BMI=26.8；体脂率(%)=40.6；体脂肪量(kg)=27.1；骨骼肌量(kg)=21.4；InBody评分=64.0；基础代谢(kcal)=1227.0\n本期记录的行为（2025-06-24 至 2025-07-28，共 33 天）：\n  饮食打卡 6 条，覆盖 2 个打卡日，打卡日记录热量均值约 439.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：牛奶、三明治（夹火腿、干酪）、鸡蛋（均值）、全麦面包；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体脂率偏高、骨骼肌量相对不足，属于体脂型超重，本期重点应放在减脂同时守住肌肉。\n- 您在减重过程中容易伴随肌肉流失，因此不宜单纯节食或追求快速掉秤。\n- 您的记录较零散、运动尚未起步，因此本期只聚焦1-2个最容易坚持的小改变，更有助于看到客观变化。\n\n②饮食建议\n- 优先把早餐固定下来：保留牛奶、鸡蛋、全麦面包这类组合，您对这类规律饮食的接受度较好，但火腿干酪三明治油盐偏高，可隔天替换为水煮蛋加蔬菜。\n- 每餐先吃一拳头蔬菜、再吃蛋白质、最后吃主食，帮助控制总量，全天热量不必低于1200 kcal。\n- 每天保证一份优质蛋白（蛋、奶、鱼虾、豆制品任选），减脂期护住肌肉。\n\n③运动建议\n- 本期只设一个核心习惯：每天饭后快走20分钟，先做到“天天有走”，比强度更重要。\n- 待快走稳定后，每周加2次靠墙静蹲或弹力带训练，每次10分钟，帮助保留骨骼肌。\n- 避免一开始就高强度长跑，循序渐进更易坚持。\n\n④下一周期目标\n- 体重下降1-1.5kg，体脂率下降1%左右，骨骼肌量保持不减。\n- 饮食打卡覆盖天数提升到每周4天以上，快走每周达到5天。\n- 下一次复测以守住肌肉、稳步降脂为成功标准。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体脂率偏高（40.6%），骨骼肌量相对偏少，属于体脂偏高、肌肉储备不足的体型，重点在于减脂同时守住肌肉。\n- 您在减重时容易伴随肌肉流失，因此本期不宜激进减重，温和稳健更适合您。\n- 您的记录依从性偏低（33天仅2个打卡日），先把“坚持记录”这件小事做扎实，是本期最关键的一步。\n\n②饮食建议\n- 本期只抓一个核心动作：每天固定记录一餐（如早餐），把记录变成习惯，先求连续、不求完美。\n- 您常吃牛奶、鸡蛋、全麦面包，蛋白质基础不错，建议每餐保证一掌心蛋白（蛋、奶、瘦肉、豆制品），有助于减脂时保住肌肉。\n- 三明治尽量选少干酪、少酱版本，用全麦面包打底，主食不必戒断但控制分量，全天热量不低于1200 kcal。\n\n③运动建议\n- 从零开始，先建立最易坚持的习惯：每天快走20分钟，可拆成饭后两次各10分钟。\n- 每周加2次简单力量动作（靠墙深蹲、坐站起立各10次×2组），帮助维持骨骼肌量。\n- 把每次运动也简单打卡一次，让运动和记录同步养成。\n\n④下一周期目标\n- 体重温和下降0.5–1kg，体脂率下降约0.5–1个百分点，骨骼肌量尽量持平不下降。\n- 饮食打卡覆盖天数从2天提升到至少10天，运动打卡出现5次以上。\n- 以“能坚持”为唯一成功标准，先稳住习惯，您的体成分自然会随之改善。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为26.8，体脂率40.6%，属于体脂偏高状态，骨骼肌量尚可，InBody评分64分，提升空间主要在于减少体脂。\n- 本期33天中仅2天有饮食打卡、且无运动记录，说明记录习惯尚未建立，这也限制了我们更精准地帮助您。\n- 您打卡食物（牛奶、鸡蛋、全麦面包、三明治）结构基本合理，已有不错的早餐基础，可在此之上稳步改善。\n\n②饮食建议\n- 本期只聚焦一件事：每天坚持记录三餐，哪怕只拍照或简单文字，先把\"记录\"这个习惯养成，后续才能优化。\n- 在您现有早餐基础上，午晚餐保证一掌心瘦肉/鱼/豆制品加两拳蔬菜，主食改为粗细搭配，避免油炸和含糖饮料。\n- 全天热量建议不低于1200 kcal，吃饱但吃对，避免因过度限制而难以坚持。\n\n③运动建议\n- 从最易坚持的开始：每天饭后快走20分钟，先建立\"动起来\"的习惯，无需追求强度。\n- 适应后每周加入2次简单力量动作（如靠墙静蹲、弹力带），帮助保住骨骼肌、提升代谢。\n\n④下一周期目标\n- 饮食打卡天数从2天提升到每周至少4天，运动打卡从0次提升到每周2-3次快走。\n- 体重温和下降1-2kg，体脂率下降1%左右，重点是养成可持续的记录与活动习惯，而非快速减重。"}]}, {"case_code": "C13F5A", "adherence": "high", "context": "【病例 C13F5A】\n基本信息：性别=F，年龄=None，身高=172.0cm\n本期初始体成分（2025-05-17）：体重(kg)=81.9；BMI=27.7；体脂率(%)=36.0；体脂肪量(kg)=29.5；骨骼肌量(kg)=28.9；InBody评分=71.0；基础代谢(kcal)=1502.0\n本期记录的行为（2025-05-17 至 2025-06-05，共 18 天）：\n  饮食打卡 63 条，覆盖 20 个打卡日，打卡日记录热量均值约 71.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：鸡蛋（均值）、蕹菜（空心菜）、牛奶、番茄（西红柿，番柿）、秋黄瓜（旱黄瓜）、豆腐干（卤干）；运动打卡 7 条，覆盖 7 天；常见运动：瘦身操", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为27.7，体脂率36.0%，属于超重伴体脂偏高，但骨骼肌量28.9kg与基础代谢1502kcal处于良好水平，是您减脂的有利基础。\n- 您饮食与运动打卡覆盖天数高、依从性好，这是顺利推进体成分管理的关键优势。\n- 您在减重过程中存在肌肉一同流失的倾向，因此本期重点是“减脂同时保住肌肉”，避免单纯依靠少吃来掉秤。\n\n②饮食建议\n- 建议每日总热量控制在1400-1600kcal区间，不低于1000kcal，制造温和的热量缺口以稳步减脂。\n- 优先保证蛋白质摄入，按每公斤体重1.2-1.5g计算，约90-110g/天，延续您常吃的鸡蛋、牛奶、豆腐干，并增加鱼虾、鸡胸肉等。\n- 您常吃的空心菜、番茄、黄瓜可继续保留，每餐占盘面一半；主食选全谷杂粮，控制精制米面与油炸食品。\n- 三餐规律、定时打卡，记录尽量覆盖全天真实摄入，便于评估实际热量。\n\n③运动建议\n- 您的瘦身操可保留作为有氧基础，每周4-5次、每次30-40分钟。\n- 重点增加抗阻训练，每周2-3次，针对腿、臀、背、核心等大肌群，以保护并提升骨骼肌量。\n- 有氧与力量交替安排，运动后及时补充蛋白质，强度循序渐进，避免过度疲劳。\n\n④下一周期目标\n- 体重下降1.0-1.5kg，体脂率下降1.0-1.5个百分点，骨骼肌量保持不降或略增。\n- 维持每周饮食打卡覆盖5天以上、运动打卡5次以上的良好节奏。\n- 以体脂和围度变化为主要参考，关注体型改善，而非单看体重数字。"}, {"label": "乙", "advice": "①总体评估\n- 您本期初始体重81.9kg，BMI27.7属于超重范围，体脂率36.0%偏高，提示减脂是您当前的核心目标。\n- 您的骨骼肌量28.9kg基础尚可，基础代谢约1502kcal，在减脂过程中应注意保护肌肉，避免随体重一起流失。\n- 您记录依从性较高，18天内饮食打卡63条、运动打卡7天，自我管理意识良好，这是后续坚持的良好基础。\n\n②饮食建议\n- 建议您全天总摄入控制在1400-1600kcal，制造适度热量缺口，切勿低于1000kcal，以保证安全减脂。\n- 您已常吃鸡蛋、牛奶、豆腐干等优质蛋白，建议每日蛋白摄入达80-100g，三餐均衡分配，有助保留肌肉。\n- 继续保持蕹菜、番茄、黄瓜等蔬菜，每日500g以上；主食可换为糙米、燕麦等粗杂粮，减少精制米面与油炸食品。\n- 建议您完整记录全天三餐而非单条食物，便于更准确评估真实摄入。\n\n③运动建议\n- 您当前以瘦身操为主，建议每周保持4-5次有氧运动，每次30-45分钟，如快走、慢跑或操课，提升脂肪消耗。\n- 增加每周2-3次抗阻训练，如深蹲、弹力带、哑铃等，重点锻炼下肢与核心，帮助维持骨骼肌量。\n- 运动循序渐进，注意热身与拉伸，避免过度疲劳与损伤。\n\n④下一周期目标\n- 建议您下个周期减重1.5-2.5kg，以体脂率下降为主要观察指标。\n- 力争每周运动打卡达4天以上，饮食实现每日完整记录。\n- 下次复测InBody，关注体脂率下降而骨骼肌量稳定或提升，逐步将BMI向健康区间靠拢。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重81.9kg，BMI27.7，体脂率36%，处于超重伴体脂偏高阶段，InBody评分71分较前有提升，整体方向良好。\n- 您的骨骼肌量28.9kg尚可，但在减重过程中容易出现肌肉同步流失，需在控脂的同时着重保护肌肉。\n- 您对饮食调整的反应较好，饮食记录依从性高（20天打卡63条），运动打卡也提升至7天，行为基础扎实，适合推进系统化方案。\n\n②饮食建议\n- 您的打卡食物以鸡蛋、牛奶、豆腐干、蔬菜为主，结构清晰；建议每日蛋白质摄入达到约1.2-1.5g/kg体重（约100-120g），分配到三餐，保护肌肉。\n- 全天热量建议控制在1400-1600 kcal，不低于1000 kcal，主食优选玉米、燕麦等粗杂粮替换部分精白米面。\n- 蔬菜（空心菜、番茄、黄瓜）每日保证500g以上，烹调少油少盐；牛奶选低脂、豆腐干注意控制钠摄入。\n- 请尽量记录全天三餐而非零散打卡，以便更真实评估实际摄入。\n\n③运动建议\n- 您已坚持瘦身操，可保留作为热身与有氧基础，每周5次、每次30分钟。\n- 重点增加抗阻训练以保护骨骼肌，每周2-3次，针对大肌群（深蹲、臀桥、弹力带划船），每次20-30分钟。\n- 有氧建议选快走或慢跑，每周累计150分钟，运动循序渐进，避免过量。\n\n④下一周期目标\n- 您本期（约3周）目标减重1.5-2kg，体脂率下降1-1.5%，骨骼肌量基本维持不下降。\n- 饮食打卡覆盖率提升至全天记录，运动维持每周6-7天活动。\n- 重点关注减脂同时保肌，定期复测体成分追踪进展。"}]}, {"case_code": "CC9456", "adherence": "high", "context": "【病例 CC9456】\n基本信息：性别= 每次30-40分钟，保护膝关节。\n- 每周安排2-3次抗阻训练，如弹力带、靠墙静蹲、坐姿划船，维护骨骼肌量。\n- 增加日常活动量，每日步数逐步提升至8000步，并开始运动打卡。\n\n④下一周期目标\n- 体重减少2-3kg，体脂率下降1-2个百分点，骨骼肌量尽量维持不降。\n- 饮食打卡覆盖率提升至每周5天以上，运动打卡每周至少4次。\n- 下期复测InBody，争取评分提升3-5分，再据结果调整方案。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为32.9，体脂率48.3%，属于体脂偏高状态，骨骼肌量22.9kg在同身高女性中尚可，是您减脂的有利基础。\n- 您对饮食调整的反应较好，控制热量时体重下降较明显，但在减重过程中容易伴随骨骼肌流失，需特别注重蛋白质与抗阻刺激来护肌。\n- 您的饮食打卡仅覆盖4天、运动尚无记录，行为数据偏少，建议本期提升记录的连贯性，以便更准确评估全天真实摄入。\n\n②饮食建议\n- 建议每日热量控制在1300-1500 kcal区间，避免长期低于此范围，以防代谢下降与肌肉流失。\n- 每日保证优质蛋白，按每公斤体重1.2-1.5g摄入，约90-110g，可来自鸡蛋、瘦牛肉、鱼虾、豆制品及无糖乳制品，分三餐均匀分配。\n- 继续保持樱桃番茄、黄瓜、草莓等低热量蔬果，主食选择杂粮饭、玉米替代部分精白米面，注意豆汁等含糖饮品的量。\n- 尽量做到每日饮食打卡，记录全天而非部分餐次，帮助发现隐性热量来源。\n\n③运动建议\n- 本期重点补齐运动短板，以抗阻训练为优先，每周2-3次，针对大腿、臀、背等大肌群做深蹲、靠墙静蹲、弹力带划船，护住肌肉。\n- 有氧每周累计150分钟以上，从快走、低冲击操起步，逐步过渡到适度HIIT，避免一次性过量。\n- 建议每次运动后简单记录，提升运动依从性。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，以减脂为主，骨骼肌量尽量维持不低于22.5kg。\n- 体脂率下降1-2个百分点。\n- 饮食打卡覆盖不少于20天，运动打卡不少于12天，建立稳定行为习惯。"}]}, {"case_code": "CA5D8A", "adherence": "low", "context": "【病例 CA5D8A】\n基本信息：性别=F，年龄=None，身高=162.0cm\n本期初始体成分（2026-02-12）：体重(kg)=65.4；BMI=24.9；体脂率(%)=35.7；体脂肪量(kg)=23.4；骨骼肌量(kg)=22.7；InBody评分=69.0；基础代谢(kcal)=1278.0；内脏脂肪面积(cm2)=118.8\n本期记录的行为（2026-02-12 至 2026-03-06，共 21 天）：\n  饮食打卡 2 条，覆盖 1 个打卡日，打卡日记录热量均值约 394.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：牛奶、鸡蛋（均值）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体脂率35.7%、内脏脂肪面积118.8cm²偏高，骨骼肌量22.7kg基础尚可，属于需优先减脂的体型。\n- 您对饮食结构的调整反应较好，减脂同时容易出现肌肉流失，需在控脂的同时保住肌肉。\n- 您的记录较零散，打卡仅覆盖个别天，建立稳定的记录习惯是本期突破口。\n\n②饮食建议\n- 本期只抓一个关键动作：每天固定记录三餐，哪怕简单拍照，目标是7天里完成至少5天完整记录。\n- 您选择的牛奶、鸡蛋是优质蛋白，可继续保留；建议每餐都有一个掌心大小的蛋白来源（蛋、奶、鱼、豆腐、瘦肉），帮助保住肌肉。\n- 全天摄入不低于1200kcal，主食换成杂粮米饭、燕麦等粗粮，每餐配一拳蔬菜，减少含糖饮料和油炸食品。\n\n③运动建议\n- 先从最易坚持的开始：每天饭后快走20分钟，先把\"动起来\"变成习惯，无需追求强度。\n- 每周加入2次简单力量动作（如靠墙静蹲、深蹲、弹力带划船），每次10分钟，帮助维持骨骼肌量。\n\n④下一周期目标\n- 体重下降0.5–1kg，体脂率下降约1个百分点，骨骼肌量保持不减。\n- 饮食记录达到每周5天以上，快走累计每周累计100分钟以上。\n- 内脏脂肪面积出现下降趋势，下个周期复测InBody评估进展。"}, {"label": "乙", "advice": "①总体评估\n- 您本期体重65.4kg、BMI 24.9属超重边缘，体脂率35.7%偏高，内脏脂肪面积118.8已超标，提示脂肪偏多、肌肉相对不足。\n- 您骨骼肌量22.7kg尚可，整体方向是减脂为主、保护肌肉。\n- 21天仅2条饮食打卡、0条运动打卡，记录较少，我们先从最容易坚持的一两件小事做起。\n\n②饮食建议\n- 本期最关键一步：每天固定记录正餐中的1顿（如午餐），先把\"记录\"这个习惯养起来，比追求完美更重要。\n- 您已有牛奶、鸡蛋的优质蛋白基础，请每餐保证一掌心蛋白（蛋、奶、鱼、豆、瘦肉），有助保肌减脂。\n- 减少含糖饮料和精制主食，主食换一半为糙米、燕麦、薯类，控制内脏脂肪。\n\n③运动建议\n- 先设一个低门槛目标：每天饭后快走20分钟，从\"能完成\"开始，逐步过渡到每周累计150分钟。\n- 每周加入2次简单力量动作（靠墙静蹲、深蹲、弹力带），每次10分钟即可，帮助维持肌肉量。\n- 把走路或运动和已有习惯绑定（如午饭后），更容易坚持。\n\n④下一周期目标\n- 行为目标：每周饮食打卡≥4天、运动打卡≥3次，重在养成记录习惯。\n- 体成分目标：8周内体重下降1-2kg，体脂率下降1-2个百分点，骨骼肌量不降。\n- 下期复测InBody，对照内脏脂肪与体脂率变化，再调整方案。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为24.9，体脂率35.7%，内脏脂肪面积118.8cm²偏高，属于体脂偏高、肌肉量相对不足的体成分类型，改善重点在于减脂同时保护肌肉。\n- 您在减重过程中容易伴随骨骼肌流失，需要保证蛋白质摄入与适度力量活动，避免单纯减少进食。\n- 您目前的记录依从性较低，本期不追求多项改变，先聚焦1个最易坚持的习惯。\n\n②饮食建议\n- 本期最关键的一件事：每天保证优质蛋白，您已习惯牛奶和鸡蛋，请把它们固定为每日早餐（1个鸡蛋+1杯牛奶），并在午晚餐各加一份瘦肉或豆制品。\n- 全天进食不低于1200kcal，三餐规律，减少含糖饮料和油炸食物，主食用部分粗杂粮替换精白米面，有助于改善内脏脂肪。\n\n③运动建议\n- 从最易坚持的开始：每天饭后快走20分钟，逐步增加到30分钟，每周累计5天即可。\n- 每周尝试2次简单力量练习，如靠墙静蹲、坐站起立各2-3组，帮助您保住骨骼肌。\n\n④下一周期目标\n- 体重下降0.8-1.2kg，体脂率下降约0.5-1%，骨骼肌量尽量维持不下降。\n- 行为目标更重要：饮食打卡覆盖每周至少3天，快走打卡每周至少3次，先把记录坚持下来，效果自然随之而来。"}]}, {"case_code": "C352D1", "adherence": "high", "context": "【病例 C352D1】\n基本信息：性别=F，年龄=28，身高=156.0cm\n本期初始体成分（2025-05-10）：体重(kg)=71.7；BMI=29.5；体脂率(%)=43.6；体脂肪量(kg)=31.3；骨骼肌量(kg)=22.2；InBody评分=62.0；基础代谢(kcal)=1244.0\n本期记录的行为（2025-05-10 至 2025-06-02，共 23 天）：\n  饮食打卡 40 条，覆盖 10 个打卡日，打卡日记录热量均值约 294.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：牛奶、鸡蛋（均值）、丝瓜、牛肉（瘦）、马铃薯（土豆、洋芋）、苦瓜（凉瓜，赖瓜）；运动打卡 3 条，覆盖 3 天；常见运动：步行（3km/h）", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体重71.7kg，BMI29.5，体脂率43.6%偏高，骨骼肌量22.2kg处于合理水平，体成分改善的重点在于减脂同时守住肌肉。\n- 您饮食记录积极、依从性较高，常选用牛奶、鸡蛋、瘦牛肉等优质蛋白和丝瓜、苦瓜等低热量蔬菜，膳食结构有良好基础。\n- 您对饮食调整反应较好，但在减重过程中容易伴随肌肉流失，本期需在控热量的同时加强蛋白摄入与抗阻训练。\n- 您目前运动量偏少，仅以低速步行为主，运动对体成分的贡献还有较大提升空间。\n\n②饮食建议\n- 建议全天热量控制在1300-1500 kcal，避免过度节食，保证基础代谢稳定。\n- 每日蛋白质摄入约1.2-1.5g/kg体重（约85-100g），均匀分配到三餐，多用瘦牛肉、鸡蛋、牛奶、豆制品。\n- 主食选择马铃薯、燕麦、糙米等粗杂粮，每餐约一拳量；蔬菜每日500g以上，延续丝瓜、苦瓜等低能量品种。\n- 尽量记录全天三餐而非单餐，便于真实评估摄入，减少高油高糖加工食品。\n\n③运动建议\n- 有氧方面，将步行提速至4-5km/h，每周5次、每次30-40分钟，循序渐进。\n- 抗阻训练每周2-3次，深蹲、靠墙静蹲、弹力带划船等，每个动作2-3组，重点保护肌肉。\n- 运动打卡频率建议提高到每周4天以上，保持规律性比单次强度更重要。\n\n④下一周期目标\n- 4周内体重下降1.5-2.5kg，以减脂为主，骨骼肌量尽量维持不下降。\n- 体脂率下降1-1.5个百分点，InBody评分稳步提升。\n- 饮食打卡覆盖达18天以上并尽量记录全天，运动打卡累计12次以上。"}, {"label": "乙", "advice": "①总体评估\n- 您本期BMI为29.5，体脂率43.6%，属于体脂偏高的状态，InBody评分62分仍有提升空间，但骨骼肌量22.2kg基础尚可，是后续减脂的有利条件。\n- 您的饮食记录依从性较好（10个打卡日40条），说明您有良好的自我管理意识；不过打卡日均值约294kcal仅为部分记录，建议补全全天三餐以反映真实摄入。\n- 您的运动记录偏少（23天仅3次），且以低强度步行为主，运动量与频次有待提升。\n\n②饮食建议\n- 建议您全天热量控制在约1300-1500kcal，保证适度热量缺口，切勿过度节食。\n- 继续保持鸡蛋、牛奶、瘦牛肉等优质蛋白，每日蛋白质摄入争取达到约70-85g，有助于保留肌肉。\n- 您已有丝瓜、苦瓜等蔬菜习惯，建议每餐蔬菜占盘子一半；主食以马铃薯、糙米等替代部分精制米面，注意土豆需计入主食量。\n- 减少含糖饮料、油炸及高油烹调，优先蒸煮炖。\n\n③运动建议\n- 建议您每周进行有氧运动5次，从步行逐步过渡到快走或快慢交替，每次30-40分钟。\n- 每周加入2-3次力量训练，针对大肌群（深蹲、臀桥、弹力带划船等），每次20分钟，以维持骨骼肌量。\n- 循序渐进增加运动频次，避免一次性过量，注意运动后拉伸。\n\n④下一周期目标\n- 体重减少约1.5-2.5kg，以减脂为主，体脂率下降1-2个百分点，同时保持骨骼肌量不下降。\n- 饮食打卡覆盖率提升至每周5天以上并记录全天三餐，运动打卡每周不少于4次。\n- 下期复测InBody评分争取提升3-5分，逐步建立可持续的健康生活习惯。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重71.7kg，BMI 29.5，体脂率43.6%，体脂偏高而骨骼肌量（22.2kg）尚可，InBody评分62分，减脂空间明确，是本期重点。\n- 您对饮食调整反应较好，规律控制饮食时体重与体脂下降较顺利，是值得优先投入的方向。\n- 您在减重时容易伴随骨骼肌流失，需在控脂同时兼顾蛋白质摄入与抗阻训练，守住肌肉量。\n- 您的饮食打卡较集中、运动记录偏少，全天摄入与活动量有待更完整呈现。\n\n②饮食建议\n- 建议每日热量控制在1300-1500 kcal，三餐均衡，避免过度节食，保证可持续。\n- 蛋白质每日按每公斤体重1.2-1.5g安排，约80-100g，均匀分配到三餐，多用牛奶、鸡蛋、瘦牛肉等优质来源。\n- 延续您爱吃丝瓜、苦瓜等蔬菜的习惯，每餐保证一拳蔬菜；主食中土豆可替代部分白米饭，注意计入主食总量。\n- 坚持每日记录全天三餐，而非仅部分餐次，便于评估真实摄入。\n\n③运动建议\n- 在步行基础上，每周累计快走或骑车等有氧150分钟，单次30分钟以上以促进脂肪消耗。\n- 每周安排2-3次抗阻训练，如深蹲、靠墙静蹲、弹力带划船，每次2-3组，重点保护并增长骨骼肌。\n- 运动循序渐进，结束后适度拉伸，避免过量，保持每周稳定出勤。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，体脂率下降1-2个百分点，骨骼肌量维持在22kg以上不下降。\n- 饮食打卡覆盖至少18天并尽量记录全天，运动打卡达到每周3-4次。\n- InBody评分稳步提升，以稳健减脂、守住肌肉为核心。"}]}, {"case_code": "C6F5FC", "adherence": "high", "context": "【病例 C6F5FC】\n基本信息：性别=F，年龄=28，身高=158.0cm\n本期初始体成分（2025-05-10）：体重(kg)=69.5；BMI=27.8；体脂率(%)=44.3；体脂肪量(kg)=30.8；骨骼肌量(kg)=20.8；InBody评分=60.0；基础代谢(kcal)=1206.0\n本期记录的行为（2025-05-10 至 2025-06-14，共 34 天）：\n  饮食打卡 52 条，覆盖 21 个打卡日，打卡日记录热量均值约 None kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：—；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为27.8，体脂率44.3%，属于体脂偏高的状态，骨骼肌量20.8kg，InBody评分60分，体成分仍有较大改善空间。\n- 您的饮食记录依从性较高（21天打卡、52条记录），自我管理意识强，这是您推进体成分改善的有利基础。\n- 您对饮食调整的反应较好，但在减重过程中容易伴随骨骼肌流失，本期需在控制热量的同时重点守住肌肉量。\n- 目前缺乏运动记录，是您后续提升减脂效率与保护肌肉的关键短板。\n\n②饮食建议\n- 建议每日热量控制在1200-1400kcal区间，循序渐进，避免过度节食导致肌肉流失。\n- 蛋白质摄入提高至每日70-80g，均衡分配于三餐，优先选择鸡胸肉、鱼虾、蛋、豆制品、低脂奶。\n- 主食以全谷杂粮替代精制米面，多吃绿叶蔬菜，减少含糖饮料、油炸及高油烹调食物。\n- 继续保持每餐打卡习惯，尽量记录全天进食，便于更准确评估实际摄入。\n\n③运动建议\n- 本期开始引入规律运动，建议每周3-4次有氧（快走、慢跑、椭圆机），每次30-40分钟。\n- 增加每周2次抗阻训练，针对下肢、背部、核心等大肌群，以保护并提升骨骼肌量。\n- 运动前后做好热身与拉伸，强度循序渐进，避免过量造成疲劳或损伤，并尝试做运动打卡。\n\n④下一周期目标\n- 体重下降2-3kg，以减脂为主，骨骼肌量尽量维持不下降。\n- 体脂率下降1.5-2个百分点，InBody评分稳步提升。\n- 运动打卡覆盖率达到每周3次以上，饮食打卡维持当前水平，形成稳定可持续的生活节奏。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI为27.8，体脂率44.3%，体脂肪量30.8kg偏高，而骨骼肌量20.8kg相对偏低，属于体脂偏高、肌肉储备不足的体成分类型，InBody评分60分有较大提升空间。\n- 您饮食打卡覆盖21天、共52条，记录依从性较好，这是后续行为调整的良好基础；目前缺少运动打卡，运动环节是您下一步的主要突破口。\n- 您在减重过程中容易伴随肌肉流失，因此本期重点是“控脂同时保肌”，避免单纯依靠饮食缩减造成肌肉下降。\n\n②饮食建议\n- 保证蛋白质摄入，每日按每公斤体重1.2-1.5g，约75-90g，均匀分配到三餐，优先选择鸡蛋、牛奶、鱼虾、豆制品。\n- 主食选用全谷物替代精米白面，每餐约一拳量，搭配足量蔬菜（每日300-500g），饱腹同时控制总热量。\n- 建议在记录热量的同时也记录食物种类与分量，全天摄入不低于1200kcal，制造约300-400kcal的温和热量缺口。\n\n③运动建议\n- 本期重点是把运动“从零启动”，每周安排3-4次、每次30-40分钟中等强度有氧（快走、椭圆机、游泳），帮助消耗脂肪。\n- 加入每周2-3次抗阻训练，针对大肌群（深蹲、臀桥、俯身划船、弹力带），以保留并提升骨骼肌量。\n- 坚持运动打卡，从每周累计120分钟逐步过渡，避免一次性过量，量力而行。\n\n④下一周期目标\n- 体重下降1-2kg，以体脂肪量减少为主，骨骼肌量维持或略增。\n- 体脂率下降1-2个百分点，InBody评分提升2-4分。\n- 运动打卡覆盖率达每周3次以上，饮食打卡继续保持当前良好水平并补充分量记录。"}, {"label": "丙", "advice": "①总体评估\n-您本期体重69.5kg，BMI 27.8，已达超重范围；体脂率44.3%、体脂肪量30.8kg，提示脂肪偏高是当前体成分的主要问题。\n-您骨骼肌量20.8kg，对女性身材属于尚可的基础，需要在减脂同时尽量保留肌肉，避免减重伴随肌肉流失。\n-您本期饮食打卡21天、共52条，记录依从性较好，但暂无运动打卡，且热量数据不完整，建议后续完善全天记录以便精准评估。\n\n②饮食建议\n-建议您采用温和热量缺口，全天摄入控制在约1300-1500kcal，避免低于1000kcal的极端节食，保证可持续。\n-蛋白质优先，每日按每公斤体重约1.2-1.5g摄入（约80-100g），分配到三餐，多选鸡胸肉、鱼虾、蛋、豆制品、低脂奶。\n-主食改为部分粗杂粮，控制精制糖与油炸、含糖饮料；每餐先吃蔬菜再吃蛋白质和主食，蔬菜每日400-500g。\n-建议您把每天每餐都打卡（含分量），便于核对真实摄入与缺口。\n\n③运动建议\n-从本期无运动起步，建议您先建立习惯：每周5天快走或慢跑等有氧，每次30-40分钟，心率中等强度。\n-每周安排2-3次抗阻训练，针对腿、臀、背、核心，如深蹲、臀桥、弹力带划船，每个动作2-3组，保护肌肉量。\n-增加日常活动量，每日步数目标8000-10000步，久坐每小时起身活动。\n\n④下一周期目标\n-建议您下一周期（约4-6周）减重1.5-3kg，以体脂率下降1-2个百分点、骨骼肌量基本维持为核心目标。\n-行为目标：饮食打卡覆盖率达90%以上，运动打卡每周至少4次。\n-下次复测InBody，重点关注体脂肪量与骨骼肌量变化，并据此调整方案。"}]}, {"case_code": "C11CE2", "adherence": "low", "context": "【病例 C11CE2】\n基本信息：性别=F，年龄=44，身高=156.0cm\n本期初始体成分（2025-05-27）：体重(kg)=69.0；BMI=28.4；体脂率(%)=41.6；体脂肪量(kg)=28.7；骨骼肌量(kg)=21.9；InBody评分=64.0；基础代谢(kcal)=1240.0\n本期记录的行为（2025-05-27 至 2025-06-18，共 22 天）：\n  饮食打卡 2 条，覆盖 1 个打卡日，打卡日记录热量均值约 78.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：丝瓜、米饭；无运动打卡", "candidates": [{"label": "甲", "advice": "① 总体评估\n- 您当前BMI28.4，体脂率41.6%，属于体脂偏高范围，骨骼肌量尚可，InBody评分64分，提示减脂是本阶段核心方向。\n- 本期22天仅有1天饮食打卡、无运动打卡，记录依从性较低，难以反映真实情况，建议先从\"养成记录习惯\"这一小目标入手。\n- 您基础代谢约1240kcal，减脂需在保证营养的前提下制造合理热量缺口，切忌过度节食。\n\n② 饮食建议\n- 本期只聚焦一件事：每天记录一餐（建议记录晚餐），坚持拍照或简单文字打卡，先把记录习惯建立起来。\n- 主食定量，每餐米饭控制在约一拳大小，搭配丝瓜等蔬菜可适当多吃，增加饱腹感。\n- 每餐保证一掌心优质蛋白（鸡蛋、鱼虾、豆腐、瘦肉），有助于减脂期间保住肌肉。\n\n③ 运动建议\n- 从最易坚持的方式开始：每天饭后快走20分钟，无需器械，下楼散步即可，重点是先动起来。\n- 适应后每周尝试3次，逐步延长至30分钟，养成规律即可，不必追求强度。\n\n④ 下一周期目标\n- 饮食打卡覆盖天数从1天提升至每周至少4天，先重数量不重完美。\n- 完成每周3次以上、每次20分钟以上的快走记录。\n- 体重下降1-2kg、体脂率下降1%左右为合理预期，稳步推进即可。\n\n祝您顺利开启这一阶段的健康管理，每一个小坚持都值得肯定。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重69.0kg，BMI28.4，体脂率41.6%偏高，骨骼肌量尚可，InBody评分64分，减脂仍是主要方向。\n- 您对饮食调整的反应较好，体重和体脂下降空间明确，但减脂时容易伴随肌肉流失，需兼顾蛋白质摄入。\n- 您的记录依从性偏低，本期重点先从“坚持记录”这一最小习惯入手，循序渐进。\n\n②饮食建议\n- 优先做到一件事：每天固定记录1餐（如午餐），先养成打卡习惯，再逐步覆盖全天。\n- 每餐保证一掌心优质蛋白（鸡蛋、牛奶、瘦肉、豆腐、鱼），帮助您在减脂时保住肌肉。\n- 主食定量，米饭每餐约一拳大小，多搭配丝瓜、绿叶菜等高纤维蔬菜增加饱腹感；每日热量不低于1200kcal，避免过度节食。\n\n③运动建议\n- 从最易坚持的步行开始，每天饭后快走20-30分钟，本期目标是“先动起来”。\n- 每周加入2次简单力量练习（如靠墙静蹲、坐姿起立各10-15次），保护并提升骨骼肌量。\n- 把运动绑定到固定时间，如晚餐后，降低中断的可能。\n\n④下一周期目标\n- 饮食打卡覆盖率提升至每周至少5天，至少每天1餐。\n- 步行达到每周累计4天以上。\n- 体重下降1-2kg，体脂率下降1%，同时骨骼肌量不下降。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI 28.4、体脂率41.6%，属于体脂偏高，骨骼肌量尚可，InBody评分64分有提升空间。\n- 您对饮食结构调整的反应较好，减脂潜力明显，但记录习惯尚未建立，全天真实摄入难以评估。\n- 您在减重过程中容易伴随肌肉流失，本期需在控脂同时保住肌肉。\n\n②饮食建议\n- 本期只聚焦一件事：每天完整记录三餐（哪怕只拍照），先把“看见自己吃什么”这个习惯建立起来。\n- 每餐保证一掌心优质蛋白（鸡蛋、鱼、瘦肉、豆腐），帮助保住肌肉、增加饱腹感。\n- 主食如米饭控制在每餐一拳大小，搭配丝瓜等蔬菜半盘以上，全天热量不低于1200 kcal，避免过度节食。\n\n③运动建议\n- 从最易坚持的开始：每天饭后快走20分钟，先做到“天天有”而非“一次很久”。\n- 每周加2次简单力量动作（如靠墙静蹲、坐姿起立各10次×2组），保护肌肉。\n- 把运动也记录下来，与饮食打卡一起，每天勾一笔即可。\n\n④下一周期目标\n- 饮食打卡覆盖率达到每周5天以上，运动每周累计120分钟。\n- 体重下降1–1.5kg，体脂率下降1%左右，骨骼肌量保持不下降。\n- 重点是把“记录+饭后快走”两件小事坚持满三周，养成稳定习惯。"}]}, {"case_code": "C79241", "adherence": "mid", "context": "【病例 C79241】\n基本信息：性别=M，年龄=52，身高=176.0cm\n本期初始体成分（2025-07-08）：体重(kg)=94.9；BMI=30.6；体脂率(%)=35.4；体脂肪量(kg)=33.6；骨骼肌量(kg)=34.5；InBody评分=61.0；基础代谢(kcal)=1694.0\n本期记录的行为（2025-07-08 至 2025-07-28，共 19 天）：\n  饮食打卡 12 条，覆盖 2 个打卡日，打卡日记录热量均值约 664.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：鸡蛋（均值）、对虾、玉米粥、玉米（鲜）、酱牛肉、小白菜（青菜，白菜）；运动打卡 3 条，覆盖 3 天；常见运动：快走（4km/h）、散步", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体重94.9kg，BMI 30.6，体脂率35.4%，属于偏高水平，骨骼肌量34.5kg略显不足，体成分改善空间较大。\n- 您在减重过程中容易出现肌肉流失，因此本期不宜单纯追求体重下降，需把保住肌肉作为关键。\n- 您对饮食调整反应较好，是本期的主要发力点；运动打卡覆盖天数有限，仍有提升空间。\n\n②饮食建议\n- 您打卡日记录热量偏低，可能存在漏记或进食不足。建议全天保证约1500-1700 kcal，避免过度节食导致肌肉流失。\n- 您的食物结构较好，鸡蛋、对虾、酱牛肉富含优质蛋白，建议每日蛋白质摄入达到约100-110g，分配到三餐。\n- 主食以玉米、玉米粥等粗杂粮搭配，控制精制米面；蔬菜如小白菜可每餐一份，增加饱腹感。\n- 请尽量每天完整记录三餐，提高记录覆盖率，便于评估真实摄入。\n\n③运动建议\n- 您已坚持快走与散步，建议把快走速度提升至5-6km/h，每周5次、每次30-40分钟，提升燃脂效率。\n- 增加抗阻训练以保护肌肉，每周2-3次，针对腿、背、胸等大肌群，可用弹力带或自重深蹲、靠墙俯卧撑。\n- 运动循序渐进，避免关节不适，运动后注意补充蛋白质。\n\n④下一周期目标\n- 您本期目标可设为减重1-1.5kg，以减脂为主，骨骼肌量尽量维持不下降。\n- 体脂率下降约0.5-1个百分点，InBody评分稳步提升。\n- 饮食打卡覆盖率提升至每周5天以上，运动达到每周累计4-5次。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重94.9kg，BMI30.6，体脂率35.4%，处于肥胖范围，但骨骼肌量34.5kg、InBody评分61分均属可塑性较好的基础，减脂潜力明确。\n- 您对饮食调整的反应较好，体重和体脂下降相对顺畅，但在减重过程中容易伴随肌肉流失，需重点保护骨骼肌。\n- 您的饮食打卡覆盖天数偏少（仅2天）、打卡日记录热量明显偏低，提示记录不完整，建议提高记录的完整性以便准确评估真实摄入。\n\n②饮食建议\n- 建议设定全天热量约1500-1700 kcal，避免过度节食，确保不低于1000 kcal底线，三餐规律。\n- 优先保证蛋白质，每日按每公斤体重1.2-1.5g摄入，您常吃的鸡蛋、对虾、酱牛肉是优质来源，可分配到三餐均匀摄入以保护肌肉。\n- 主食以玉米、杂粮替换部分精米面，搭配小白菜等蔬菜每日300-500g，减少烹调油与含糖饮料。\n- 请尽量每天完整记录每餐，包括加餐与饮品，提升记录覆盖度。\n\n③运动建议\n- 您已有快走、散步基础，建议保持每周5次有氧，每次30-45分钟，强度以微喘但能交谈为宜。\n- 每周加入2-3次抗阻训练，如深蹲、靠墙静蹲、弹力带划船、哑铃推举，重点维持骨骼肌量。\n- 运动循序渐进，避免过量，关节不适时改为游泳或固定单车。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，体脂率下降约1%，骨骼肌量尽量维持不减。\n- 饮食打卡覆盖天数提升至每周5天以上，运动打卡每周达到4-5次。\n- 以\"减脂保肌\"为核心，稳步推进，避免快速掉重导致肌肉流失。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为30.6，体脂率35.4%，属于肥胖范围，体脂肪量偏高（33.6kg），InBody评分61分提示体成分有较大改善空间。\n- 您的骨骼肌量34.5kg处于尚可水平，提示减脂应在保护肌肉的前提下进行，避免肌肉流失。\n- 您的饮食记录仅覆盖2天、运动覆盖3天，依从性中等，建议提高记录完整度，以便更准确评估全天摄入与消耗。\n\n②饮食建议\n- 建议您参考基础代谢约1694 kcal，全天摄入控制在1600-1800 kcal区间，制造适度热量缺口，切勿低于1000 kcal。\n- 保证优质蛋白摄入，延续鸡蛋、对虾、酱牛肉等选择，每日蛋白可按每公斤体重1.2-1.5g分配，午晚餐各有一掌心瘦肉/鱼虾。\n- 主食以玉米、粗杂粮替代部分精米白面，控制总量；多吃小白菜等绿叶蔬菜，每餐保证一拳蔬菜。\n- 建议您坚持每天记录三餐，减少含糖饮料与油炸食品，烹调以蒸煮炖为主。\n\n③运动建议\n- 在快走、散步基础上，建议您每周进行150分钟以上中等强度有氧（快走4-5km/h或骑车），可分5次完成。\n- 每周增加2-3次抗阻训练，如弹力带、深蹲、靠墙俯卧撑，以保护并增长骨骼肌量。\n- 运动循序渐进，关注关节与心率反应，如有不适及时休息，避免过量。\n\n④下一周期目标\n- 建议您下个周期（约4周）减重1.5-2.5kg，以减脂为主，体脂率下降1-2个百分点。\n- 将饮食记录覆盖率提升至每周5天以上，运动达到每周4-5次。\n- 维持或小幅提升骨骼肌量，下次复测InBody评分争取提高3-5分。"}]}, {"case_code": "CD5B51", "adherence": "mid", "context": "【病例 CD5B51】\n基本信息：性别=F，年龄=35，身高=156.0cm\n本期初始体成分（2025-03-29）：体重(kg)=60.4；BMI=24.8；体脂率(%)=36.7；体脂肪量(kg)=22.2；骨骼肌量(kg)=20.9；InBody评分=68.0；基础代谢(kcal)=1196.0\n本期记录的行为（2025-03-29 至 2025-04-19，共 20 天）：\n  饮食打卡 24 条，覆盖 11 个打卡日，打卡日记录热量均值约 206.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：鸡蛋（均值）、牛奶、苹果（红富士苹果）、卤牛肉；运动打卡 14 条，覆盖 12 天；常见运动：瑜伽、体感游戏、keep 睡前舒缓、步行（3km/h）", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为24.8，处于偏高范围，体脂率36.7%明显偏高，提示体脂偏多而骨骼肌量20.9kg尚可，体成分改善空间主要在减脂。\n- 您本期饮食打卡覆盖11天、运动覆盖12天，依从性中等，已建立初步记录习惯，值得肯定。\n- 饮食打卡热量均值仅约206kcal，明显不能反映全天真实摄入，建议您此后完整记录三餐及加餐，便于评估。\n\n②饮食建议\n- 建议您按减脂目标设定全天热量约1300-1400kcal，三大营养素均衡，避免过度节食。\n- 保证蛋白质摄入，参考每日每公斤体重1.2-1.5g（约70-90g），可延续鸡蛋、牛奶、卤牛肉，并增加鱼虾、豆制品。\n- 主食选择糙米、燕麦等粗杂粮替代部分精米白面，每餐搭配足量蔬菜，水果如苹果每日1份即可，控制总糖。\n- 请尽量每餐都打卡，记录份量，帮助您发现高热量盲点。\n\n③运动建议\n- 您目前以瑜伽、舒缓、步行为主，强度偏低，建议增加有氧时长，如快走或慢跑每周4-5次、每次30-40分钟。\n- 增加抗阻训练每周2-3次，针对大肌群（深蹲、靠墙静蹲、弹力带），以维持并提升骨骼肌量。\n- 保留瑜伽与睡前舒缓作为放松与柔韧训练，注意循序渐进，避免运动过量。\n\n④下一周期目标\n- 建议您下一周期（约4周）减重1.5-2kg，以减脂为主，避免肌肉流失。\n- 将饮食打卡覆盖率提升至每天记录，运动保持每周至少5天。\n- 下期复测InBody，重点关注体脂率与骨骼肌量变化，期待评分稳步提升。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI为24.8、体脂率36.7%，属于体重接近正常但体脂偏高、肌肉量偏少的“隐性肥胖”体型，InBody评分68分仍有提升空间。\n- 您的运动依从性较好，20天中有12天有运动记录，这是您当前最有利的基础；饮食打卡虽较规律，但单日记录热量偏低，提示打卡多为零食或部分餐次，全天摄入情况需更完整呈现。\n- 您减脂的核心在于在不流失肌肉的前提下降低体脂，因此本期重点是“控脂保肌”，而非单纯追求体重下降。\n\n②饮食建议\n- 请保证每日总热量不低于1200kcal，三餐规律，避免因摄入过低导致基础代谢下降和肌肉流失。\n- 优先增加优质蛋白，您可延续鸡蛋、牛奶、卤牛肉的选择，建议每日蛋白质摄入约70-80g，分散到三餐，每餐有一掌心量蛋白。\n- 主食改为糙米、燕麦等粗细搭配，控制精制碳水与 }, {"label": "乙", "advice": "①总体评估\n- 您目前体重75.1kg，BMI28.3，体脂率40.6%，整体属于体脂偏高范畴，骨骼肌量尚可，提示减脂是当前核心方向。\n- 本期您仅有1天饮食打卡、且无运动记录，记录依从性偏低，难以反映真实摄入，建议先从“坚持记录”这件小事入手。\n- 您所记录的食物（番茄、鸡蛋、土豆、牛奶）本身质量不错，方向是对的，关键在于稳定下来形成习惯。\n\n②饮食建议\n- 本周期只设一个核心目标：每天完整记录三餐，哪怕简单拍照也可以，先把真实摄入摸清楚再谈调整。\n- 在现有食物基础上，保证每餐有一份蛋白质（鸡蛋、牛奶、瘦肉或豆制品），有助于减脂期保留肌肉、增强饱腹感。\n- 全天热量建议维持在约1300-1500 kcal，避免过度节食，主食可用土豆等替代部分精米面，增加饱腹。\n\n③运动建议\n- 先从最易坚持的开始：每天饭后快走20-30分钟，无需器械，重点是养成每天都动的习惯。\n- 每周尝试2次简单家庭力量练习（深蹲、靠墙静蹲等），每次15分钟左右，帮助维持骨骼肌量。\n- 把运动记录也打卡，方便我们下期看到真实进展。\n\n④下一周期目标\n- 饮食记录覆盖率从本期约4%提升到每周至少5天完整打卡。\n- 实现每周累计快走3-4次以上，建立运动习惯。\n- 下期复测体脂率可争取下降1-2个百分点，体重小幅下降1-2kg，循序渐进、稳为先。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI 28.3、体脂率40.6%，属于体脂偏高、肌肉量相对偏低的体型，体成分管理重点在于减脂同时守住肌肉。\n- 您在减重时容易出现肌肉同步流失，因此本期不追求快速掉秤，而是稳步降低体脂、保护骨骼肌。\n- 您目前记录依从性较低（28天仅1个打卡日），完整摄入情况不明，本期先把“坚持记录”作为最关键的突破口。\n\n②饮食建议\n- 优先做一件事：每天固定记录1次正餐，先把打卡习惯稳定下来，不追求记全，重在持续。\n- 您选择的鸡蛋、牛奶、圣女果是不错的基础，建议每餐保证一个掌心大小的蛋白质（蛋、奶、鱼、瘦肉、豆制品），帮助保住肌肉。\n- 土豆可作为主食替代部分白米白面，注意少油烹饪，避免油炸或大量调味；全天进食不低于1200 kcal，不节食。\n\n③运动建议\n- 从最易坚持的开始：每周3次、每次20–30分钟快走或快慢交替走，先建立运动打卡这一行为。\n- 每周加入2次简单徒手力量动作（深蹲、靠墙静蹲、提踵），每次10分钟左右，重点在于减少减重中的肌肉流失。\n\n④下一周期目标\n- 行为目标：饮食打卡覆盖天数从1天提升到每周至少3天，运动打卡每周至少2次。\n- 体成分目标：体重下降0.5–1.0kg，体脂率下降0.3–0.5个百分点，骨骼肌量尽量维持不下降。"}]}, {"case_code": "CA9133", "adherence": "low", "context": "【病例 CA9133】\n基本信息：性别=F，年龄=36，身高=156.0cm\n本期初始体成分（2025-03-13）：体重(kg)=67.1；BMI=27.6；体脂率(%)=43.2；体脂肪量(kg)=29.0；骨骼肌量(kg)=20.9；InBody评分=62.0；基础代谢(kcal)=1193.0\n本期记录的行为（2025-03-13 至 2025-04-03，共 20 天）：\n  饮食打卡 1 条，覆盖 1 个打卡日，打卡日记录热量均值约 None kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：—；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为27.6，体脂率43.2%，属于体脂偏高范围，骨骼肌量尚可，InBody评分62分，体成分有较明确的改善空间。\n- 本期20天内仅1条饮食打卡、无运动打卡，记录依从性偏低，导致难以评估真实摄入与活动情况，这是本期最需要突破的环节。\n- 建议先不追求大幅减重，而是把\"记录\"和\"一个小习惯\"做扎实，为后续调整打好基础。\n\n②饮食建议\n- 最关键的一步：先做到每天简单记录一餐（哪怕只拍照或一句话），坚持记录比记得多完整更重要。\n- 三餐中先固定改善一餐，如把含糖饮料换成白水或无糖茶，主食中加入一份蔬菜，增加饱腹感。\n- 进食顺序先吃蔬菜和蛋白质（鸡蛋、鱼、豆制品、瘦肉），再吃主食，有助于控制总量。\n\n③运动建议\n- 从最易坚持的开始：每天饭后快走10-15分钟，先建立\"动起来\"的习惯，不必追求强度。\n- 适应一周后，可增加2-3次简单的居家力量练习（如靠墙静蹲、坐站练习），帮助保住骨骼肌。\n\n④下一周期目标\n- 把饮食记录天数从1天提升到至少每周5天，养成记录习惯。\n- 每周累计快走3-4次以上，体重维持稳定或小幅下降0.5-1kg即可，重在坚持而非求快。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体脂率偏高（43.2%），体重与BMI均处于偏高范围，体成分管理的核心是减脂同时守住骨骼肌量。\n- 您对运动和饮食的打卡依从性较低，规律记录的习惯尚未建立，这会限制后续调整的精准度。\n- 您的基础代谢约1193 kcal，减重时若摄入控制过猛容易伴随肌肉流失，需要温和而稳定地推进。\n\n②饮食建议\n- 本期只抓一个最关键的改变：每天保证一掌心优质蛋白（鸡蛋、鱼虾、瘦肉、豆制品、无糖奶），分散到三餐，帮助在减脂时保住肌肉。\n- 减少一类高热量饮品或零食（如含糖奶茶、油炸点心），用水果或原味坚果少量替代即可，不必全盘改变。\n- 每日热量不建议低于1200 kcal，避免极端节食，以可长期坚持为标准。\n\n③运动建议\n- 先从最易坚持的开始：每天饭后快走20-30分钟，每周累计4-5天，给自己设定可达成的低门槛目标。\n- 每周加入2次简单力量练习（靠墙深蹲、坐站起立各10-15次），保护并提升骨骼肌量。\n- 运动后在平台简单打卡一句，帮助养成记录习惯。\n\n④下一周期目标\n- 体重下降1-1.5kg，体脂率下降1-1.5个百分点，骨骼肌量保持不减。\n- 饮食打卡覆盖至少10天，运动打卡覆盖至少10天。\n- 把蛋白摄入与饭后快走两件事固定为日常习惯，这是您本期最值得坚持的两个改变。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重67.1kg，BMI 27.6，体脂率43.2%，属于体脂偏高、肌肉量尚可的状态，减脂空间明确。\n- 您对饮食结构调整的反应较好，体重和体脂往往能同步下降，是可发挥的优势。\n- 您在减重时骨骼肌相对稳定，但需持续注意蛋白质摄入以守住肌肉。\n- 您目前记录依从性偏低，仅1条饮食打卡，先从“坚持记录”这一最小改变入手最关键。\n\n②饮食建议\n- 本期只聚焦一件事：每天固定记录一餐（建议选晚餐），坚持比完美更重要，降低执行难度。\n- 每餐保证一掌心优质蛋白（鸡蛋、牛奶、鱼虾、瘦肉、豆制品），帮助减脂同时保住肌肉。\n- 全天热量不低于1200kcal，主食可用红薯、杂粮替换部分白米白面，蔬菜尽量占餐盘一半。\n\n③运动建议\n- 暂不追求强度，先建立习惯：每天饭后快走15-20分钟，每周累计5天即可。\n- 若能适应，再加入每周2次简单力量动作（深蹲、靠墙俯卧撑各2组），保护肌肉量。\n\n④下一周期目标\n- 饮食记录覆盖天数从1天提升到每周至少4天，养成可持续的记录习惯。\n- 体重下降1.5-2.5kg，体脂率下降1-2个百分点，骨骼肌量基本维持不流失。"}]}, {"case_code": "C27ECA", "adherence": "mid", "context": "【病例 C27ECA】\n基本信息：性别=F，年龄=39，身高=160.0cm\n本期初始体成分（2024-05-13）：体重(kg)=59.5；BMI=23.3；体脂率(%)=29.5；体脂肪量(kg)=17.5；骨骼肌量(kg)=22.8；InBody评分=76.0；基础代谢(kcal)=1277.0\n本期记录的行为（2024-05-13 至 2024-09-02，共 111 天）：\n  饮食打卡 20 条，覆盖 3 个打卡日，打卡日记录热量均值约 616.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：猪肉（瘦）、鸡蛋（均值）、牛奶、白萝卜（莱菔）、胡萝卜炒青笋、大白菜（青白口）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI23.3、体脂率29.5%，InBody评分76分，处于正常偏上水平，骨骼肌量22.8kg基础较好，体成分改善空间集中在降低体脂。\n- 您的基础代谢约1277kcal，对饮食结构调整反应较好，适度控制热量即可见效。\n- 您在减重过程中较易伴随肌肉流失，需把保护肌肉作为本期重点。\n- 您的饮食记录仅覆盖3天，运动尚未打卡，行为数据不足以全面反映习惯，提升记录与运动依从性是关键。\n\n②饮食建议\n- 全天热量建议控制在1300-1500kcal，不低于1000kcal，营造温和热量缺口，避免肌肉流失。\n- 保证优质蛋白，每日按每公斤体重1.2-1.5g摄入，瘦猪肉、鸡蛋、牛奶、鱼虾、豆制品分配到三餐。\n- 您常吃白萝卜、大白菜等蔬菜值得保持，建议每餐占盘一半，主食可部分换成杂粮、玉米。\n- 坚持每日记录饮食，争取每周至少打卡5天，便于及时发现高油高糖盲区。\n\n③运动建议\n- 优先建立规律运动习惯，每周3-4次有氧（快走、骑车、慢跑），每次30-40分钟。\n- 加入抗阻训练每周2-3次，深蹲、靠墙静蹲、弹力带划船等，重点保护并提升骨骼肌量。\n- 从低强度起步、循序渐进，每次运动后做记录，提升运动依从性。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，体脂率下降2-3个百分点，骨骼肌量维持或略增。\n- 饮食打卡覆盖率提升至每周5天以上，运动每周达到3次以上。\n- InBody评分提升2-4分，以减脂保肌为核心稳步推进。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重59.5kg，BMI23.3处于正常范围，体脂率29.5%略偏高，骨骼肌量22.8kg基础尚可，InBody评分76分有进一步提升空间。\n- 您对饮食调整的反应较好，体重和体脂下降较易实现，但减重时容易伴随骨骼肌流失，需特别注意保护肌肉。\n- 您的记录依从性偏中等，饮食打卡仅覆盖3天且记录热量偏低，运动暂无记录，行为数据不足以全面反映真实状态，建议提高记录的连续性。\n\n②饮食建议\n- 请保证每日摄入不低于1200-1400 kcal，避免长期低热量进食导致代谢下降与肌肉流失。\n- 优先保证优质蛋白，每日每公斤体重摄入约1.2-1.5g蛋白（约75-90g），均匀分配到三餐，可继续选用瘦猪肉、鸡蛋、牛奶，并增加鱼虾、豆制品。\n- 保持您喜欢的萝卜、大白菜等蔬菜，主食以杂粮、薯类替代部分精米面，控制油盐，三餐规律不漏餐。\n\n③运动建议\n- 建议每周进行2-3次抗阻训练，如深蹲、靠墙静蹲、弹力带划船，重点保护和增长骨骼肌。\n- 每周累计150分钟中等强度有氧，如快走、健身操，可由每次20分钟逐步增加，循序渐进不过量。\n- 请将运动同步打卡，便于评估投入与效果的对应关系。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，以减脂为主，体脂率下降1-2个百分点。\n- 骨骼肌量维持不低于当前水平，避免随减重流失。\n- 饮食打卡覆盖率提升至每周4天以上，运动每周至少记录3次。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为23.3，处于正常偏上范围，体脂率29.5%略高于健康区间（女性建议约28%以下），属于体重正常但体脂偏高的情况，InBody评分76分有提升空间。\n- 您的骨骼肌量22.8kg尚可，基础代谢1277kcal，提示后续重点在于降低体脂、维持或增加肌肉量。\n- 您在111天中仅有3个打卡日、20条饮食记录，且无运动打卡，记录依从性中等，建议加强日常记录以便更准确评估真实摄入与活动量。\n\n②饮食建议\n- 您打卡日记录的热量偏低（均值约616kcal），这通常是记录不全所致，请尽量记录全天三餐，建议全天摄入控制在1300-1500kcal区间，避免过度节食。\n- 您常吃猪肉瘦肉、鸡蛋、牛奶蛋白质来源较好，建议每餐保证一掌心优质蛋白，全天蛋白约70-80g以保护肌肉。\n- 您的蔬菜种类不错，建议每日蔬菜达300-500g，主食优选杂粮、糙米等粗细搭配，减少精米白面与油炒。\n\n③运动建议\n- 您目前无运动记录，建议先从每周3-5次快走、慢跑等有氧开始，每次30-40分钟，帮助降低体脂。\n- 建议每周加入2次力量训练，针对腿、臀、背等大肌群，如深蹲、弹力带划船，以维持骨骼肌量。\n- 您可将活动融入日常，如多走楼梯、餐后散步，逐步增加每日步数至8000步以上。\n\n④下一周期目标\n- 您可将体脂率从29.5%降至约28%以下，体重小幅下降1-2kg，重点减脂而非单纯减重。\n- 建议下周期饮食打卡覆盖率提升至每周至少5天，并开始记录运动。\n- 维持骨骼肌量不下降，下次复测InBody评分争取提升至80分左右。"}]}, {"case_code": "CC88C0", "adherence": "mid", "context": "【病例 CC88C0】\n基本信息：性别=F，年龄=45，身高=158.0cm\n本期初始体成分（2024-04-27）：体重(kg)=62.3；BMI=24.9；体脂率(%)=39.0；体脂肪量(kg)=24.3；骨骼肌量(kg)=20.2；InBody评分=65.0；基础代谢(kcal)=1191.0\n本期记录的行为（2024-04-27 至 2024-05-18，共 20 天）：\n  饮食打卡 15 条，覆盖 1 个打卡日，打卡日记录热量均值约 1140.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：玉米 率38.9%，属于体脂偏高类型，骨骼肌量尚可，体成分仍有较大优化空间。\n- 您对饮食结构的调整反应较好，所记录的鸡蛋、牛奶、红薯都是优质选择，说明您具备健康饮食的基础认知。\n- 您目前记录较为零散，全天真实摄入难以评估，提升记录的连续性是本期最关键的突破口。\n\n② 饮食建议\n- 本期只聚焦一件事：每天完整记录三餐，哪怕简单拍照，目的是看清真实摄入而非立刻控制。\n- 延续您喜欢的鸡蛋、牛奶搭配，每餐补充一个拳头大小的蔬菜，主食用红薯替换部分精米白面即可。\n- 全天热量不低于1300kcal，避免极端节食，保证蛋白质摄入以保护肌肉。\n\n③ 运动建议\n- 从最易坚持的方式起步：每天饭后快走20分钟，先建立运动习惯而非追求强度。\n- 每周加入2次简单的居家力量动作（如靠墙静蹲、平板支撑），帮助您在减脂时守住肌肉。\n\n④ 下一周期目标\n- 饮食记录覆盖天数从1天提升到15天以上，把“坚持记录”作为本期首要成果。\n- 体重下降1.5-2kg、体脂率下降1%左右，目标温和可达，骨骼肌量保持不下降。\n- 完成步行习惯的固定化，您只要稳定迈出第一步，后续调整就会顺畅许多。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重72.3kg、体脂率38.9%偏高，骨骼肌量尚可，InBody评分66分，减脂空间明确。\n- 您对饮食调整的反应较好，体重和体脂可随之下降，但减重时容易伴随骨骼肌轻度流失，需注意保肌。\n- 您的记录依从性偏低，打卡覆盖天数有限，建立稳定的记录与行为习惯是本期突破关键。\n\n②饮食建议\n- 本期最核心的一件事：保证每日三餐规律，全天热量不低于1300kcal，避免因漏餐导致后续过量进食。\n- 在您已常吃的鸡蛋、牛奶基础上，每餐增加一个掌心大小的优质蛋白（鱼、鸡胸、豆腐），帮助保住肌肉。\n- 把甘薯、红薯作为主食替换部分白米白面，搭配足量蔬菜，增加饱腹感、控制总量。\n\n③运动建议\n- 优先培养运动习惯，从每周3次、每次20分钟快走或慢跑开始，先做到“能坚持”。\n- 每周加入2次简单力量练习（深蹲、靠墙静蹲、弹力带），帮助减重时保留骨骼肌。\n- 把活动嵌入日常，如饭后散步10分钟，降低坚持难度。\n\n④下一周期目标\n- 用一个周期减重1-1.5kg，以减脂为主，保持骨骼肌量不下降。\n- 饮食打卡覆盖天数提升至每周至少4天，记录全天进食。\n- 运动打卡从零起步，做到每周至少3次有记录。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为27.2，体脂率38.9%，属于体重和体脂偏高的状态，骨骼肌量23.9kg尚可，体成分改善空间较大。\n- 您本期23天仅有1天饮食打卡、且无运动记录，记录依从性偏低，难以反映真实摄入，这是本阶段最需要突破的环节。\n- 您选择的鸡蛋、牛奶、红薯都是不错的食材，说明您具备良好的食物选择基础。\n\n②饮食建议\n- 本期请先聚焦一个最易坚持的小目标：每天如实记录晚餐这一顿，哪怕只拍照或简单文字，培养记录习惯比追求完美更重要。\n- 在已有的鸡蛋、牛奶基础上，每餐保证一个掌心大小的优质蛋白（蛋、奶、鱼、鸡胸、豆制品），有助于保留肌肉、增强饱腹感。\n- 每日总热量不低于1300kcal，避免极端节食；用红薯等粗粮替代部分精米白面即可。\n\n③运动建议\n- 先从\"零运动\"过渡到可坚持的量：每天饭后快走10-15分钟，每周累计3-4次即可，重在养成习惯。\n- 待快走稳定后，可加入每周2次简单的自重力量练习（深蹲、靠墙静蹲），帮助维持骨骼肌量。\n\n④下一周期目标\n- 行为目标：饮食打卡覆盖天数从1天提升到至少10天，完成快走累计8次以上。\n- 体成分目标：下期体重下降1-2kg、体脂率小幅下降，以记录习惯的建立为本阶段核心成果。"}]}, {"case_code": "C592C7", "adherence": "low", "context": "【病例 C592C7】\n基本信息：性别=F，年龄=36，身高=170.0cm\n本期初始体成分（2025-03-04）：体重(kg)=68.2；BMI=23.6；体脂率(%)=35.9；体脂肪量(kg)=24.5；骨骼肌量(kg)=24.1；InBody评分=66.0；基础代谢(kcal)=1314.0\n本期记录的行为（2025-03-04 至 2025-04-29，共 56 天）：\n  饮食打卡 1 条，覆盖 1 个打卡日，打卡日记录热量均值约 None kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：—；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体重68.2kg、BMI23.6属于正常范围偏上，但体脂率35.9%偏高，骨骼肌量相对不足，属于体脂偏多、肌肉量偏少的体型。\n- 您在减重过程中容易伴随肌肉流失，因此本期重点是减脂同时保住肌肉，而非单纯追求体重下降。\n- 您的记录依从性偏低，本期不追求面面俱到，先从1-2个最容易坚持的小习惯入手。\n\n②饮食建议\n- 优先抓一件事：每餐保证一个手掌大小的优质蛋白（鸡蛋、牛奶、鱼虾、豆制品、瘦肉），帮助维持肌肉。\n- 全天热量不低于1300kcal，正常吃三餐，减少含糖饮料和油炸食品即可，无需刻意挨饿。\n- 每天只需简单记录一餐打卡，养成记录习惯，逐步增加，不必强求完整。\n\n③运动建议\n- 本期核心是先动起来：每周3次、每次20-30分钟快走或您喜欢的舞蹈，难度低、易坚持。\n- 每周加2次简单力量练习（如靠墙静蹲、深蹲、弹力带），保护肌肉、提升基础代谢。\n- 选择固定时间段运动并简单打卡，把目标定得越小越好，重在不间断。\n\n④下一周期目标\n- 体重下降1-1.5kg，体脂率下降约1%，骨骼肌量保持不减。\n- 饮食打卡覆盖至少20天，运动打卡至少15天，建立稳定记录习惯。\n- 本期成功的关键是坚持蛋白质摄入与规律活动两件小事，您只要稳住这两点即可见效。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI 23.6属正常偏上，但体脂率35.9%偏高、骨骼肌量相对偏少，呈现“体重正常、体脂超标”的隐性肥胖倾向，InBody评分66分有较大提升空间。\n- 本期56天内仅1条饮食打卡、无运动记录，数据无法反映真实情况，建议先从“坚持记录”这一最小改变入手。\n- 您的核心方向是降体脂、增肌肉，而非单纯减体重。\n\n②饮食建议\n- 本期只聚焦一件事：每天记录三餐（拍照即可），帮助您和我们看清真实饮食结构，这是后续调整的基础。\n- 在不刻意节食的前提下，每餐保证一掌心优质蛋白（鸡蛋、鱼虾、瘦肉、豆制品），有助于增肌护肌。\n- 用全谷杂粮替换部分精白米面，减少含糖饮料，这两个改动简单且易坚持。\n\n③运动建议\n- 从最易执行的开始：每天快走20-30分钟，可利用通勤或饭后时间，先建立运动习惯。\n- 每周加入2次简单力量练习（如靠墙深蹲、弹力带），每次10-15分钟，帮助提升骨骼肌量。\n- 不必追求强度，重点是规律打卡、能长期坚持。\n\n④下一周期目标\n- 饮食打卡天数达到每周至少5天，运动打卡每周至少3次。\n- 体脂率下降1-2个百分点，骨骼肌量保持或略增，体重维持在66-68kg区间。\n- 期待您下次复测时InBody评分能有所提升，我们再据实细化方案。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为23.6，处于正常范围偏高，但体脂率35.9%偏高、骨骼肌量相对偏低，属于体脂偏多、肌肉略显不足的体型。\n- 您在56天内仅有1条饮食打卡、无运动打卡，记录习惯尚未建立，这是当前最需要突破的环节。\n- 您对饮食调整的反应通常较好，只要稳定执行就能看到体脂下降，但减重时容易伴随肌肉流失，需注意保护肌肉。\n\n②饮食建议\n- 本期只需聚焦一个最易坚持的改变：每天保证一掌心优质蛋白（鸡蛋、牛奶、鱼虾、豆制品任选），帮助保住肌肉。\n- 三餐中把一半主食换成蔬菜，主食选择杂粮、薯类，既增加饱腹感又控制总热量。\n- 每日热量不低于1314 kcal，避免过度节食导致肌肉进一步流失。\n\n③运动建议\n- 起步只设一个小目标：每天快走20分钟，可拆成两次完成，重在每天都做、不间断。\n- 每周加入2次简单的力量动作（如靠墙静蹲、坐姿起立各2组），帮助维持骨骼肌量。\n\n④下一周期目标\n- 行为目标：饮食打卡每周至少3天，运动打卡每周至少3次，先把记录习惯建立起来。\n- 体成分目标：8周内体重下降1-1.5kg，体脂率下降约1%，骨骼肌量保持不变或略增，避免掉肌肉。"}]}, {"case_code": "CF431A", "adherence": "high", "context": "【病例 CF431A】\n基本信息：性别=F，年龄=None，身高=172.0cm\n本期初始体成分（2025-06-05）：体重(kg)=78.2；BMI=26.4；体脂率(%)=34.3；体脂肪量(kg)=26.8；骨骼肌量(kg)=28.4；InBody评分=72.0；基础代谢(kcal)=1481.0\n本期记录的行为（2025-06-05 至 2025-06-24，共 19 天）：\n  饮食打卡 43 条，覆盖 17 个打卡日，打卡日记录热量均值约 33.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：牛奶、面包、鸡蛋（均值）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为26.4、体脂率34.3%，处于超重伴体脂偏高状态，但骨骼肌量28.4kg基础较好，InBody评分72分，减脂潜力可观。\n- 您的饮食记录依从性较高，17天打卡、共43条，说明您具备良好的自我管理意识，这是本期推进的有力基础。\n- 您在减重过程中容易伴随骨骼肌流失，因此本期重点是“减脂同时保肌”，避免单纯靠减少进食导致肌肉下降。\n- 您目前以牛奶、面包、鸡蛋为常见食物，蛋白质来源尚可但偏单一，且缺乏运动记录，是本期可优化的两个方向。\n\n②饮食建议\n- 建议全天摄入维持在1400-1600 kcal，循序减脂，不要低于1481 kcal基础代谢太多，避免代谢下降。\n- 提高蛋白质摄入至每日约90-110g，在牛奶、鸡蛋基础上增加鱼虾、鸡胸、豆制品，分配到三餐保肌。\n- 主食选择全谷杂粮替代部分白面包，搭配每餐一拳蔬菜，增加饱腹感与膳食纤维。\n- 请尽量记录全天而非部分餐次的饮食，便于更准确评估真实摄入。\n\n③运动建议\n- 本期重点是补足运动这一短板，建议每周3次抗阻训练，针对腿、背、臀大肌群，以保护和增长骨骼肌。\n- 搭配每周3-4次快走或慢跑等有氧，每次30-40分钟，提升脂肪消耗。\n- 运动循序渐进，从轻强度起步，并开始进行运动打卡以便跟踪。\n\n④下一周期目标\n- 体重减少1.0-1.5kg，以体脂下降为主，骨骼肌量保持在28kg以上不流失。\n- 体脂率下降1个百分点左右，逐步向33%靠近。\n- 饮食打卡覆盖率提升至每日记录，新增运动打卡每周不少于4次。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重78.2kg，BMI 26.4，体脂率34.3%，属超重范围且脂肪占比偏高，骨骼肌量28.4kg尚可，InBody评分72分，仍有较大优化空间。\n- 您饮食记录依从性较高（17天打卡），但运动尚未开展，是本期最明显的短板。\n- 您对饮食调整的反应较好，体重和脂肪较易下降，但在减重时容易伴随骨骼肌流失，本期需重点保肌减脂、增加运动。\n\n②饮食建议\n- 建议全天能量控制在约1400-1500kcal，三餐规律分配，避免单纯减少进食而忽略营养均衡。\n- 您的常见食物以牛奶、面包、鸡蛋为主，碳水偏精制、蛋白略不足；可将白面包替换为全麦或杂粮，早餐补充鸡蛋与无糖牛奶。\n- 每日优质蛋白争取达到约90-100g，分散到三餐，来源包括鸡蛋、奶制品、豆制品、鱼虾、瘦肉，以减少减重期肌肉流失。\n- 多摄入绿叶蔬菜与番茄、黄瓜等低热量蔬菜，每餐占盘约一半，增强饱腹感并补充膳食纤维。\n\n③运动建议\n- 本期优先把运动从零建立起来，先以每周3-4次、每次30分钟快走或慢跑等有氧运动起步。\n- 同步安排每周2-3次抗阻训练，针对腿、背、核心做深蹲、臀桥、弹力带划船等，保护并提升骨骼肌量。\n- 运动循序渐进，避免过量，运动后注意补充蛋白质与拉伸放松。\n\n④下一周期目标\n- 建议本期减重约1.5-2.5kg，以减脂为主，体脂率下降1-2个百分点，同时维持骨骼肌量不低于当前水平。\n- 保持饮食打卡覆盖率，并实现每周累计运动不少于4次。\n- 下期复测InBody，重点关注体脂肪量下降与骨骼肌量保持情况。"}, {"label": "丙", "advice": "①总体评估\n-您本期初始体重78.2kg，BMI 26.4属超重范围，体脂率34.3%偏高，提示减脂是当前核心目标。\n-您骨骼肌量28.4kg处于尚可水平，基础代谢约1481kcal，保留肌肉、减少脂肪应同步进行。\n-您饮食打卡覆盖17天、依从性较好，但记录以牛奶、面包、鸡蛋为主，蛋白与膳食多样性可能不足，且本期无运动打卡，活动量是明显短板。\n\n②饮食建议\n-建议每日总热量控制在1400-1600kcal区间，形成温和热量缺口，切勿低于1000kcal。\n-保证蛋白质摄入，每日约90-100g，分散到三餐：早餐保留鸡蛋、牛奶，午晚餐增加鱼、瘦肉、豆制品。\n-主食优选全谷杂粮替换部分白面包，每餐搭配300-500g蔬菜，增加饱腹感与膳食纤维。\n-坚持每餐打卡并尽量记录全天饮食，便于更准确评估真实摄入。\n\n③运动建议\n-本期可从有氧起步，每周3-5次快走、慢跑或游泳，每次30-40分钟，逐步建立运动习惯。\n-加入抗阻训练每周2-3次，针对腿、背、核心等大肌群，帮助保留骨骼肌、提升代谢。\n-增加日常活动量，如多走楼梯、每日步行8000步以上，并坚持运动打卡。\n\n④下一周期目标\n-体重下降1.5-2.5kg，体脂率下降1-2个百分点，骨骼肌量尽量维持不下降。\n-饮食打卡覆盖率达90%以上，运动打卡每周不少于4次。\n-下期复测InBody，依据体脂与肌肉变化动态调整方案。"}]}, {"case_code": "CF1831", "adherence": "mid", "context": "【病例 CF1831】\n基本信息：性别=F，年龄=37，身高=156.0cm\n本期初始体成分（2025-05-08）：体重(kg)=62.5；BMI=25.7；体脂率(%)=32.4；体脂肪量(kg)=20.3；骨骼肌量(kg)=23.4；InBody评分=75.0；基础代谢(kcal)=1282.0\n本期记录的行为（2025-05-08 至 2025-06-09，共 32 天）：\n  饮食打卡 7 条，覆盖 3 个打卡日，打卡日记录热量均值约 144.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：鸡蛋（均值）、豆浆、包子（猪肉馅）、拌黄瓜片；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n-您当前BMI为25.7，体脂率32.4%，属于体脂偏高、肌肉量略显不足的体型，InBody评分75分，仍有提升空间。\n-您在减重过程中容易伴随骨骼肌流失，因此本期重点是控脂的同时保住并提升肌肉，避免单纯追求体重下降。\n-您的饮食打卡仅覆盖3天，且暂无运动记录，行为依从性中等，记录完整度提升后干预效果会更可观。\n\n②饮食建议\n-建议每日热量控制在1300-1500 kcal区间，不低于基础代谢，保证可持续减脂。\n-保证蛋白质摄入，按每公斤体重1.2-1.5g计算，约75-90g/天，分配到三餐：早餐鸡蛋加豆浆是良好开端，午晚餐增加鱼、瘦肉、豆腐。\n-包子（猪肉馅）等精制主食与高脂馅料适量减少，主食可部分换成杂粮、燕麦；多保留拌黄瓜片这类低热量蔬菜，每餐蔬菜半盘。\n-请坚持每天记录至少一餐，覆盖更多天数，便于客观调整。\n\n③运动建议\n-建议每周进行3-4次力量训练，重点练大肌群（深蹲、臀桥、靠墙俯卧撑、弹力带划船），每次20-30分钟，以维持和增长肌肉。\n-每周累计快走或慢跑等有氧150分钟，可拆分为每次30分钟，帮助消耗脂肪。\n-从运动打卡开始养成习惯，每次训练后简单记录内容和时长。\n\n④下一周期目标\n-体重下降0.5-1kg，体脂率下降0.5-1个百分点，骨骼肌量保持不变或略增。\n-饮食打卡覆盖天数提升至每周4天以上，新增运动打卡每周3次。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI为25.7，体脂率32.4%，属于体重与体脂偏高、肌肉量尚可的状态，InBody评分75分，仍有提升空间。\n- 您对饮食调整的反应较好，控制热量摄入时体脂下降较明显，但在减重时容易伴随骨骼肌轻度流失，需在减脂同时注意护肌。\n- 您本期饮食打卡仅7条、覆盖3天，记录依从性偏低，且记录热量明显低于真实需求，难以反映全天摄入，建议提升记录完整度以便精准评估。\n\n②饮食建议\n- 建议每日总热量控制在1300-1500 kcal，避免过度节食，保证基础代谢所需，三餐规律不漏餐。\n- 保证蛋白质摄入，每日约70-80g，分配到三餐，您常吃的鸡蛋、豆浆可保留，再增加鱼虾、瘦肉、低脂奶及豆制品以护肌。\n- 主食优选全谷杂粮替换部分精白米面，包子等高油馅类适当减少；多搭配蔬菜，烹调少油少盐。\n- 坚持完整记录，争取每周至少打卡5天、覆盖正餐与加餐，便于调整。\n\n③运动建议\n- 您本期无运动记录，建议从有氧起步，每周快走、慢跑或游泳4-5次，每次30-40分钟，循序渐进。\n- 加入抗阻训练每周2-3次，针对腿、背、核心等大肌群，以减少减重中的肌肉流失。\n- 日常增加活动量，如多步行、爬楼，减少久坐。\n\n④下一周期目标\n- 体重下降1.0-1.5kg，体脂率下降1.0-1.5%，骨骼肌量维持或略增。\n- 饮食打卡覆盖天数提升至每周5天以上，新增运动打卡每周不少于4次。\n- 以稳健减脂、保住肌肉为重点，避免快速掉重。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为25.7，处于超重范围，体脂率32.4%偏高，体脂肪量20.3kg提示脂肪储备较多，是本阶段管理的重点。\n- 您的骨骼肌量23.4kg处于尚可水平，InBody评分75分，整体基础不错，目标是减脂的同时保住肌肉。\n- 您的记录依从性中等，本期仅3个打卡日且热量记录偏低，可能未反映全天真实摄入，建议后续更完整记录以便精准调整。\n\n②饮食建议\n- 建议您 真实摄入。\n\n③运动建议\n- 您喜爱的舞蹈可作为有氧主项，每周进行3-4次，每次30-40分钟，以微喘可交谈的强度为宜。\n- 每周安排2次抗阻训练，针对腿、背、核心等大肌群，以保护并提升骨骼肌量。\n- 将运动打卡常态化，每次记录项目与时长，逐步把每周运动天数提升至4天以上。\n\n④下一周期目标\n- 体重下降0.8-1.2kg，体脂率下降0.5%-1%，骨骼肌量维持不减。\n- 饮食打卡覆盖达15天以上并完整记录全天，运动打卡覆盖8天以上。\n- 重点防止减重中的肌肉流失，以稳步减脂、保肌为本期核心方向。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为25.0，处于超重临界，体脂率37.9%偏高，骨骼肌量24.8kg尚可，整体呈现“脂肪偏多、肌肉待巩固”的状态，InBody评分65分有提升空间。\n- 您本期饮食打卡覆盖11天、运动仅1天，记录依从性中等；建议提高记录的完整性和连续性，以便更准确评估真实摄入与消耗。\n- 减脂的核心方向是适度控制热量、增加蛋白质并提升活动量，目标是降低体脂、保住或增加肌肉。\n\n②饮食建议\n- 建议您全天热量控制在约1400-1600 kcal，避免过度节食，保证基础代谢（约1341 kcal）需求。\n- 蛋白质摄入建议每日约90-110g，您已常吃牛奶、鸡蛋很好，可再加入鱼虾、瘦肉、豆制品，均匀分配到三餐。\n- 主食优选全谷物、杂豆替代部分精米白面，每餐搭配足量蔬菜（约300-500g），减少含糖饮料与油炸食品。\n- 请尽量记录每一餐而非零散打卡，便于您和我们掌握真实摄入。\n\n③运动建议\n- 建议您每周进行有氧运动3-5次，每次30-40分钟，您喜爱的舞蹈可作为主力项目，配合快走、慢跑或游泳。\n- 增加抗阻训练每周2-3次，针对腿、背、核心等大肌群，有助于保留肌肉、提升基础代谢。\n- 循序渐进、量力而行，运动前后做好热身与拉伸，避免过量。\n\n④下一周期目标\n- 体重下降约1-2kg，体脂率下降1-2个百分点，同时尽量维持骨骼肌量。\n- 饮食打卡覆盖率提升至每周5天以上，运动打卡每周不少于3次。\n- 下期复测InBody，期待您的评分稳步提升。"}]}, {"case_code": "C20FE5", "adherence": "mid", "context": "【病例 C20FE5】\n基本信息：性别=M，年龄=30，身高=183.0cm\n本期初始体成分（2025-04-16）：体重(kg)=100.8；BMI=30.1；体脂率(%)=33.4；体脂肪量(kg)=33.6；骨骼肌量(kg)=38.0；InBody评分=63.0；基础代谢(kcal)=1821.0\n本期记录的行为（2025-04-16 至 2025-05-14，共 27 天）：\n  饮食打卡 22 条，覆盖 2 个打卡日，打卡日记录热量均值约 992.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：包子（猪肉馅）、米饭、汤菜、马铃薯（土豆、洋芋）、樱桃番茄（圣女果）、酸奶；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体重100.8kg，BMI 30.1，体脂率33.4%，属于肥胖范围，体脂偏高是首要改善方向；骨骼肌量38.0kg尚可，基础代谢约1821 kcal，是控制体重的有利基础。\n- 您本期饮食打卡22条但仅覆盖2天，运动无打卡，记录依从性中等，整体行为数据不足以反映真实摄入，建议后续坚持每日完整记录。\n- 打卡日记录均值约992 kcal明显偏低，提示存在漏记，难以据此判断真实饮食结构。\n\n②饮食建议\n- 建议设定每日摄入约1800-2000 kcal（不低于1000 kcal），在基础代谢之上适度制造缺口，循序减脂。\n- 增加优质蛋白，每日按每公斤体重1.2-1.6g（约120-150g），如鸡胸、鱼虾、蛋、酸奶、豆制品，保护肌肉。\n- 主食选择上，您常吃米饭、土豆、肉包，建议部分替换为全谷杂粮，控制精制碳水与油脂；多保留樱桃番茄、汤菜等蔬菜。\n- 请坚持每日如实记录三餐，减少漏记，以便准确评估。\n\n③运动建议\n- 您本期无运动记录，建议从每周3-4次快走、慢跑或骑行开始，每次30-40分钟中等强度。\n- 加入每周2次抗阻训练，如深蹲、卧推、划船，维持并提升骨骼肌量。\n- 循序渐进，避免一次性过量，运动后注意拉伸与休息。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，体脂率下降约1-2个百分点，骨骼肌量尽量维持。\n- 饮食打卡覆盖率提升至每周5天以上，新增运动打卡每周3次。\n- 下期复测InBody，对照评分与体脂变化调整方案。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重100.8kg，BMI30.1，体脂率33.4%，属于体脂偏高、肌肉量相对不足的状态，InBody评分63分仍有提升空间。\n- 您对饮食调整反应较好，但在减重过程中容易伴随骨骼肌流失，因此本期需把\"保肌\"作为核心，避免单纯掉秤。\n- 您的饮食打卡仅覆盖2天、运动打卡为零，记录连续性不足，难以全面反映真实摄入，建议先提升记录习惯。\n\n②饮食建议\n- 全天热量建议控制在1500-1700 kcal，不低于1000 kcal，在保证供能的同时形成温和热量缺口。\n- 优先保证蛋白质，按每日110-140g摄入，多选鸡蛋、酸奶、鱼虾、瘦肉、豆制品，分配到三餐，护住肌肉。\n- 主食适量保留全谷与薯类，但土豆、米饭、包子皮等精细碳水适当减量，多搭配蔬菜增加饱腹感。\n- 把打卡覆盖天数提升到每周至少5天，记录全天三餐而非个别餐次，便于客观调整。\n\n③运动建议\n- 本期重点补齐运动短板，每周安排2-3次抗阻训练，针对腿、背、胸大肌群，以维持和增长骨骼肌。\n- 配合每周3-4次有氧，如快走、骑行或椭圆机，每次30-40分钟，心率维持在中等强度。\n- 训练后及时补充蛋白质，避免空腹长时间运动，减少肌肉分解。\n\n④下一周期目标\n- 体重下降2-3kg，以减脂为主，骨骼肌量尽量维持不下降。\n- 体脂率下降1-2个百分点，InBody评分较当前有所提升。\n- 饮食打卡每周不少于5天，运动打卡累计达到12次以上，逐步建立稳定习惯。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重100.8kg，BMI30.1，体脂率33.4%，属于肥胖范围，但骨骼肌量38.0kg、基础代谢1821kcal均较好，InBody评分63，整体基础条件不错。\n- 您对饮食调整反应较好，控制饮食后体重与体脂下降明显，是减脂的有利方向。\n- 您在减重时容易伴随骨骼肌轻度流失，需在控热量的同时重视蛋白质与抗阻刺激，避免减掉肌肉。\n- 您饮食打卡覆盖天数偏少，记录中含主食与蔬果但蛋白来源不足，记录均值偏低，提示打卡不完整，真实摄入需更全面记录。\n\n②饮食建议\n- 全天热量建议控制在1600-1800kcal，不要长期低于1000kcal，以保证肌肉与代谢稳定。\n- 每餐安排一掌心优质蛋白（鸡蛋、酸奶、瘦肉、鱼虾、豆制品），全天蛋白约120-140g，支撑肌肉。\n- 主食定量，米饭、包子用部分土豆替换并搭配蔬菜，每餐先吃菜和蛋白再吃主食，控制精白主食与馅料油脂。\n- 坚持每天完整记录三餐，覆盖更多日数，便于评估真实摄入。\n\n③运动建议\n- 每周3次抗阻训练，覆盖腿、背、胸等大肌群，每次8-10个动作，重点保护和增长肌肉。\n- 每周累计150分钟中等强度有氧（快走、骑车、椭圆机），可在抗阻后进行。\n- 日常每天累计8000步，久坐每小时起身活动，增加日常能量消耗。\n- 至少进行运动打卡，以便跟踪强度与频率。\n\n④下一周期目标\n- 4周内体重下降1.5-2.5kg，以减脂为主，骨骼肌量尽量维持不下降。\n- 体脂率下降约1个百分点，腰围有所减小。\n- 饮食打卡覆盖达每周5天以上，运动打卡每周至少3次。"}]}, {"case_code": "CE68FD", "adherence": "high", "context": "【病例 CE68FD】\n基本信息：性别=F，年龄=40，身高=163.0cm\n本期初始体成分（2025-04-21）：体重(kg)=68.8；BMI=25.9；体脂率(%)=32.2；体脂肪量(kg)=22.1；骨骼肌量(kg)=25.9；InBody评分=76.0；基础代谢(kcal)=1379.0\n本期记录的行为（2025-04-21 至 2025-05-15，共 23 天）：\n  饮食打卡 146 条，覆盖 19 个打卡日，打卡日记录热量均值约 581.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：鸡蛋（均值）、全麦面包、甘薯（红心，山芋红薯）、牛奶、苹果（红富士苹果）、甜玉米；运动打卡 4 条，覆盖 4 天；常见运动：塑形训练、慢跑、散步", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI 25.9，体脂率32.2%，骨骼肌量25.9kg属于较好水平，InBody评分76分基础不错，主要问题是体脂偏高、体重略超标。\n- 您饮食打卡依从性高（19天有记录），食物选择如鸡蛋、全麦面包、甘薯、牛奶搭配合理，蛋白与优质碳水意识较好。\n- 您运动打卡较少（仅4天），运动量与频率不足是当前提升空间最大的环节。\n- 您在减重时容易伴随肌肉流失，本期需在控脂的同时重点守住骨骼肌量。\n\n②饮食建议\n- 建议您全天热量控制在1300-1500 kcal，不低于1000 kcal，保证基础代谢供给。\n- 保证蛋白质摄入，按每公斤体重约1.2-1.5g计算，每日约80-95g，分散在三餐，每餐含鸡蛋、牛奶、鱼虾或鸡胸肉等。\n- 主食以甘薯、全麦面包、甜玉米等粗杂粮替代精白米面，每餐拳头大小，蔬菜每日400-500g。\n- 建议您坚持完整记录全天饮食（含油、坚果、饮品），以便更准确评估真实摄入。\n\n③运动建议\n- 把运动频率提升至每周4-5次，这是本期重点突破方向。\n- 每周保留2-3次塑形/抗阻训练（深蹲、弹力带、器械），每次20-30分钟，以保护并增长肌肉，防止减重掉肌。\n- 每周3-4次有氧（慢跑、快走），每次30-40分钟，心率控制在中等强度。\n- 运动后适量补充蛋白质，避免空腹长时间运动。\n\n④下一周期目标\n- 体重下降1.5-2.0kg，体脂率下降1.0-1.5个百分点，骨骼肌量尽量维持不低于25.5kg。\n- 运动打卡覆盖天数提升至每周4天以上，抗阻训练至少占其中2次。\n- 保持饮食打卡依从性，并实现全天完整记录，逐步建立稳定可持续的习惯。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI为25.9，体脂率32.2%，属于超重伴体脂偏高，骨骼肌量25.9kg处于正常范围，InBody评分76分，主要改善方向是在保住肌肉的前提下减少体脂肪。\n- 您饮食打卡依从性很好，覆盖19天、共146条，食物选择如鸡蛋、全麦面包、甘薯、牛奶、苹果整体较健康，结构良好。\n- 您运动打卡仅4天，频次明显偏低，是本期可重点提升的环节；打卡热量均值仅供参考，可能存在记录不全。\n\n②饮食建议\n- 建议您保持现有优质食物，全天热量控制在约1300-1500 kcal，避免过低，确保营养与代谢。\n- 蛋白质每日争取摄入约80-100g，将鸡蛋、牛奶分配到三餐，并增加鱼、鸡胸、豆制品，帮助保肌减脂。\n- 主食以甘薯、全麦面包、玉米等粗杂粮替代部分精米白面，每餐主食约一拳大小，搭配500g以上蔬菜。\n- 建议您尽量记录全天每一餐，包括烹调油与加餐，便于更准确评估实际摄入。\n\n③运动建议\n- 建议您每周进行3-4次有氧运动，如快走或慢跑，每次30-40分钟，心率维持在中等强度。\n- 每周安排2-3次塑形/抗阻训练，覆盖腿、背、核心等大肌群，每次20-30分钟，以维持骨骼肌量。\n- 日常增加散步与活动量，目标每日6000-8000步，循序渐进，避免运动过量或受伤。\n\n④下一周期目标\n- 建议您下一周期（约4周）体重减少1-2kg，以体脂下降为主，避免肌肉流失。\n- 将运动打卡提升至每周4-5天，饮食打卡尽量覆盖全天三餐。\n- 下期复测体脂率与骨骼肌量，目标体脂率下降1-2个百分点，肌肉量保持稳定。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重68.8kg，BMI 25.9，体脂率32.2%，处于超重伴体脂偏高状态，骨骼肌量25.9kg尚可，整体仍有改善空间。\n- 您饮食依从性较高，食物结构以优质蛋白和粗杂粮为主，方向正确；但打卡日记录热量均值仅581kcal，明显偏低，提示实际摄入可能未完整记录或存在能量缺口过大风险。\n- 您在减重过程中容易伴随骨骼肌流失，本期需把保肌作为重点；运动打卡仅4天，强度与频率不足，是当前明显的薄弱环节。\n\n②饮食建议\n- 请保证全天实际摄入不低于1200-1400kcal，避免过度限制；三餐规律，把鸡蛋、牛奶、瘦肉鱼虾、豆制品分配到每一餐，每日蛋白质争取达到75-85g以护肌。\n- 主食优先选全麦面包、甘薯、玉米等粗杂粮，每餐约一拳大小，搭配每日300-500g蔬菜增加饱腹感。\n- 请完整记录每一餐（含烹调油与加餐），便于真实评估摄入，减少隐性高油高糖。\n\n③运动建议\n- 请将运动提升到每周4-5天，以抗阻训练为核心：塑形训练、深蹲、弹力带、俯卧撑等，每周2-3次、每次20-30分钟，护住骨骼肌。\n- 有氧以慢跑或快走为主，每周3次、每次30-40分钟，循序渐进、心率适中即可，不必过量。\n- 运动后及时补充蛋白质，提高肌肉合成效率。\n\n④下一周期目标\n- 用约3-4周，争取体重下降1.5-2kg，体脂率下降约1%，骨骼肌量尽量维持不降。\n- 饮食打卡覆盖率达到80%以上并如实记录，运动达到每周4次以上。\n- 下个周期复测InBody，重点关注体脂下降与肌肉保持情况，据此再做微调。"}]}, {"case_code": "CF3D14", "adherence": "high", "context": "【病例 CF3D14】\n基本信息：性别=F，年龄=28，身高=172.0cm\n本期初始体成分（2025-03-29）：体重(kg)=102.2；BMI=34.5；体脂率(%)=47.6；体脂肪量(kg)=48.7；骨骼肌量(kg)=29.3；InBody评分=53.0；基础代谢(kcal)=1527.0\n本期记录的行为（2025-03-29 至 2025-04-19，共 21 天）：\n  饮食打卡 210 条，覆盖 22 个打卡日，打卡日记录热量均值约 387.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：草莓、米饭、蕹菜（空心菜）、牛肉（瘦）、鸡蛋（均值）、小白菜（青菜，白菜）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您本期记录依从性很高，22天累计210条饮食打卡，说明您具备良好的自我管理意识，这是体成分改善的重要基础。\n- 您当前BMI34.5、体脂率47.6%，属于体脂偏高状态，但骨骼肌量29.3kg在女性中较为可观，基础代谢1527kcal较高，意味着您减脂过程中肌肉储备良好，预后积极。\n- 您饮食打卡日热量均值仅约387kcal，明显偏低，提示存在漏记或记录不全，建议完整记录全天三餐及加餐，以便准确评估真实摄入。\n\n②饮食建议\n- 建议您全天摄入控制在1400-1600kcal，切勿低于1000kcal，在制造热量缺口的同时保证营养充足。\n- 蛋白质优先：每日按每公斤理想体重1.2-1.5g安排，您常吃的瘦牛肉、鸡蛋、鱼虾、豆制品可分配到三餐，有助于减脂期保留肌肉。\n- 主食选择上，建议您将部分米饭替换为糙米、燕麦、薯类等粗杂粮；继续多吃蕹菜、小白菜等蔬菜，草莓等水果每日控制在200-300g。\n- 减少含糖饮料、油炸及高油烹调，采用蒸、煮、炖、少油快炒。\n\n③运动建议\n- 您本期无运动打卡，建议从低冲击有氧起步，如快走、椭圆机、游泳，每周3-5次、每次30-40分钟，保护膝关节。\n- 每周安排2-3次抗阻训练，针对大肌群（腿、背、胸），帮助您维持并提升骨骼肌量。\n- 循序渐进，运动前后充分热身拉伸，如有不适及时调整，避免一次性过量。\n\n④下一周期目标\n- 建议您下期体重下降1.5-2.5kg，以体脂减少为主，避免过快掉秤。\n- 实现全天饮食完整记录，运动打卡每周至少3次。\n- 下一体成分复测时关注体脂率与骨骼肌量变化，以肌肉不降、体脂下降为理想方向。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重102.2kg，BMI34.5，体脂率47.6%，骨骼肌量29.3kg，体脂偏高而肌肉量尚可，减脂空间较大，InBody评分较前略有提升，趋势向好。\n- 您对饮食调整的反应较好，依从性高、记录连续，是您的明显优势，可作为本期推进的核心抓手。\n- 您打卡日记录热量均值偏低（约387kcal），提示记录可能不完整或全天摄入不足，需补齐全天真实摄入以便准确评估。\n- 您在减重时容易伴随肌肉流失，本期需特别关注蛋白质与抗阻训练，保护骨骼肌。\n\n②饮食建议\n- 建议全天能量控制在1300-1500kcal，避免过度节流，三餐均衡，请如实记录每一餐而非仅记低热量食物。\n- 蛋白质优先：每日摄入约90-100g，分配到三餐，延续您常吃的瘦牛肉、鸡蛋，并增加鱼虾、豆制品、低脂奶。\n- 主食定量：米饭等精制主食每餐约一拳大小，部分替换为薯类、糙米等粗杂粮，搭配空心菜、小白菜等蔬菜每日500g。\n- 减少含糖饮料与油炸食品，草莓等水果每日控制在200-300g。\n\n③运动建议\n- 本期重点是从无运动起步，先建立习惯：每周5天、每次30分钟快走或慢骑，循序增加。\n- 加入抗阻训练每周2-3次，以深蹲、靠墙静蹲、弹力带划船等为主，保护并增长肌肉。\n- 增加日常活动量，多走楼梯、餐后散步10-15分钟，运动后及时补充蛋白质。\n\n④下一周期目标\n- 21天减重1.5-2.5kg，以减脂为主，体脂率下降约1-1.5%，骨骼肌量保持不变或略增。\n- 运动打卡覆盖至少12天，其中抗阻训练不少于6次。\n- 饮食记录覆盖全天三餐，蛋白质每日达标，逐步建立可持续的健康节律。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重102.2kg，BMI34.5，体脂率47.6%，骨骼肌量29.3kg，提示脂肪偏高而肌肉量尚有基础，减脂空间充足。\n- 您饮食记录依从性很高，21天覆盖22个打卡日，常选草莓、瘦牛肉 。\n- 每次运动后做简单记录，养成运动打卡习惯。\n\n④下一周期目标\n- 建议本期（约3-4周）体重下降1.5-2.5kg，以体脂下降为主，骨骼肌量尽量维持不下降。\n- 饮食打卡覆盖率提升至每周5天以上，运动打卡每周不少于3次。"}, {"label": "乙", "advice": "①总体评估\n- 您目前BMI为28.6，体脂率42.5%，属于体脂偏高状态，骨骼肌量23.1kg尚可，提示减脂同时需重点保护肌肉。\n- 本期20天内饮食打卡覆盖6天、共12条，记录依从性中等且不连续，建议提升记录的规律性，以便更准确评估摄入。\n- 您本期无运动打卡，活动量是当前可重点改善的环节。\n\n②饮食建议\n- 建议三餐定时定量，每日热量控制在约1400-1600 kcal区间，避免过度节食，保证基础代谢所需营养。\n- 优先保证蛋白质摄入，每日约70-90g，分配到三餐，如鸡蛋、瘦肉、鱼虾、豆制品、低脂奶。\n- 主食用全谷杂豆替代部分精白米面，每餐配一拳蔬菜，减少含糖饮料、油炸及高油烹调。\n- 尽量做到每天都记录饮食，哪怕简单拍照，连续记录有助于发现高热量来源。\n\n③运动建议\n- 从规律有氧起步，每周5次、每次30-40分钟快走或快慢交替走，循序渐进逐步增加时长。\n- 每周安排2-3次抗阻训练，如弹力带、深蹲、靠墙俯卧撑，保护并增加骨骼肌量。\n- 增加日常活动，如多走楼梯、餐后散步，避免久坐，每周可建立运动打卡习惯。\n\n④下一周期目标\n- 体重减少约1-2kg，体脂率下降1个百分点左右，骨骼肌量维持不下降。\n- 饮食打卡覆盖率提升至每周5天以上，新增运动打卡每周至少4次。\n- 下期复测InBody，对照评分与体脂变化动态调整方案。"}, {"label": "丙", "advice": "①总体评估\n- 您当前体重74.0kg，BMI28.6，体脂率42.5%，属于体脂偏高的状态，骨骼肌量23.1kg相对偏低，体成分改善空间较大。\n- 您的饮食记录依从性中等，已能坚持记录，这是良好的开始；但目前缺乏运动打卡，活动量明显不足。\n- 您对饮食调整的反应较好，体脂下降潜力可观；同时您在减重时容易伴随肌肉流失，本期需特别关注保肌。\n\n②饮食建议\n- 建议每日热量摄入控制在1300-1500kcal，不低于1000kcal，在适度热量缺口下稳步减脂。\n- 保证蛋白质摄入，每日每公斤体重约1.2-1.5g，可选用鸡蛋、牛奶、鱼虾、豆制品，分配到三餐以利保肌。\n- 增加蔬菜和优质主食，主食优选全谷杂粮替代部分精制米面，减少油炸、含糖饮料和高脂零食。\n- 提升饮食打卡完整度，尽量记录全天三餐及分量，便于更精准评估真实摄入。\n\n③运动建议\n- 本期重点是从零建立运动习惯，建议每周进行3-4次快走、慢跑或游泳等有氧运动，每次30分钟。\n- 每周安排2次抗阻训练，如深蹲、弹力带、哑铃练习，以维持并增长骨骼肌，防止减重伴随肌肉流失。\n- 循序渐进，从低强度开始，每次运动后记录打卡，逐步提高依从性。\n\n④下一周期目标\n- 体重下降1-2kg，体脂率下降1.5-2.5%，骨骼肌量保持稳定或略增。\n- 饮食打卡覆盖率提升至每周5天以上，建立至少6次运动打卡记录。\n- 以“减脂保肌”为核心，避免快速减重，确保变化健康可持续。"}]}, {"case_code": "C4AB93", "adherence": "low", "context": "【病例 C4AB93】\n基本信息：性别=F，年龄=41，身高=158.0cm\n本期初始体成分（2025-05-28）：体重(kg)=58.6；BMI=23.5；体脂率(%)=40.6；体脂肪量(kg)=23.8；骨骼肌量(kg)=18.5；InBody评分=63.0；基础代谢(kcal)=1122.0\n本期记录的行为（2025-05-28 至 2025-06-26，共 29 天）：\n  饮食打卡 2 条，覆盖 1 个打卡日，打卡日记录热量均值约 161.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：白粥（粳米）、饺子（猪肉香菇馅）；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您目前体重58.6kg、BMI23.5属正常范围偏上，但体脂率40.6%偏高，骨骼肌量相对不足，提示体成分以减脂增肌为主要方向。\n- 本期29天仅1天有饮食打卡、且无运动记录，依从性较低，建议先从最容易坚持的1-2个习惯入手，逐步建立记录意识。\n\n②饮食建议\n- 本期最关键的一步：每天固定记录三餐中的1餐（先做到坚持，不求完美），帮助您逐渐看清真实摄入。\n- 注意白粥、饺子等 -1500 kcal区间，制造温和热量缺口，循序渐进减脂，避免极端节食。\n\n②饮食建议\n- 三餐定时定量，主食优先全谷杂粮（燕麦、糙米、玉米），约占每餐1/4，减少精制米面与含糖饮料。\n- 每日保证优质蛋白，如鸡胸肉、鱼虾、鸡蛋、豆制品、低脂奶，每餐一掌心大小，有助于保护肌肉。\n- 蔬菜每日300-500g，餐盘一半为蔬菜，先菜后饭；烹调多用蒸煮拌，减少油炸与勾芡。\n- 继续坚持打卡，并尽量记录全天每一餐及分量，便于更准确评估实际摄入。\n\n③运动建议\n- 建议从有氧运动起步，如快走、椭圆机或游泳，每周5次、每次30分钟，从低强度逐步增加。\n- 每周安排2-3次抗阻训练，如弹力带、深蹲、靠墙静蹲，维护并提升骨骼肌量。\n- 增加日常活动量，多步行、少久坐，目标每日6000步以上，并开始记录运动打卡。\n\n④下一周期目标\n- 体重下降1-2kg，体脂率下降1-2个百分点，骨骼肌量尽量维持不下降。\n- 饮食打卡覆盖率提升至全天记录，新增运动打卡每周不少于4次。\n- 下一期复测InBody，对照评分与体脂变化调整方案。"}, {"label": "乙", "advice": "①总体评估\n- 您当前体重64.0kg，BMI27.3，体脂率39.7%，属于体脂偏高范畴，但骨骼肌量21.0kg基础尚可，InBody评分67分，整体体成分有良好改善空间。\n- 您饮食记录依从性较高（16天47条），说明自我管理意识强，这是减脂成功的重要优势。\n- 您在减重过程中容易伴随肌肉流失，本期需在减脂同时重点保护肌肉，避免基础代谢下降。\n- 您目前缺乏运动记录，活动量不足可能是体脂偏高的重要原因。\n\n②饮食建议\n- 建议每日热量控制在1300-1500kcal，不低于1000kcal，保证适度热量缺口又不过度。\n- 蛋白质优先：每日摄入约75-90g优质蛋白，分配到三餐，如鸡蛋、牛奶、鱼虾、瘦肉、豆制品，有助保护肌肉。\n- 主食选择全谷物、杂豆替代部分精米白面，每餐搭配足量蔬菜（每日500g以上），减少含糖饮料与油炸食品。\n- 继续保持打卡习惯，并尽量记录全天进食，便于更精准评估摄入。\n\n③运动建议\n- 本期重点是建立运动习惯，建议每周3-5次有氧（快走、健走、椭圆机），每次30-40分钟，从低强度起步。\n- 增加抗阻训练每周2-3次，针对腿、背、核心等大肌群，以维持和增长肌肉、稳住代谢。\n- 日常多增加步行与站立活动，目标每日6000-8000步，并坚持运动打卡。\n\n④下一周期目标\n- 体重下降1.5-2.5kg，体脂率下降2-3个百分点，骨骼肌量保持不减。\n- 饮食打卡覆盖率达80%以上，新增运动打卡每周至少3次。\n- InBody评分稳步提升，逐步向更健康的体成分迈进。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为27.3，体脂率39.7%，属于体脂偏高型，脂肪减少是本期核心任务，骨骼肌量21.0kg偏低，需在减脂同时注意保护肌肉。\n- 您饮食记录依从性高，16天内坚持47条打卡，自我管理意识强，这是推进体成分改善的重要基础。\n- 您对饮食调整的反应较好，但减重时容易伴随肌肉流失，且目前缺乏运动投入，单纯控制饮食的效果会逐渐放缓。\n\n②饮食建议\n- 建议每日热量控制在1300-1450 kcal区间，不低于基础代谢，避免过度节食导致肌肉流失。\n- 保证蛋白质摄入，按每公斤体重1.2-1.5g安排，每餐摄入掌心大小的优质蛋白，如鸡蛋、牛奶、鱼虾、豆制品、瘦肉。\n- 主食改为一半全谷杂粮，减少精制米面与含糖饮料，每餐配半盘以上蔬菜增加饱腹感。\n- 在打卡时尽量记录食物分量与全天三餐，便于更准确地评估真实摄入。\n\n③运动建议\n- 本期重点是补足运动这一短板，建议每周进行有氧运动5次，每次30-40分钟，如快走、椭圆机、游泳，以保护膝关节。\n- 每周安排2-3次抗阻训练，针对大腿、臀部、背部等大肌群，从自重深蹲、弹力带练习起步，以减少肌肉流失。\n- 运动可拆分为早晚两段，循序渐进，并在平台记录运动打卡以便追踪。\n\n④下一周期目标\n- 体重下降1.5-2.0kg，体脂率下降1.0-1.5%，并保持骨骼肌量基本稳定。\n- 运动打卡覆盖率达到每周5天以上，饮食打卡补充分量信息。\n- InBody评分较当前稳步提升，逐步向健康体脂区间靠近。"}]}, {"case_code": "C3CC65", "adherence": "low", "context": "【病例 C3CC65】\n基本信息：性别=F，年龄=45，身高=162.0cm\n本期初始体成分（2025-04-19）：体重(kg)=62.6；BMI=2 物接受度好，可继续以牛奶、鸡蛋为基础，每日蛋白质摄入约80-95g，分散到三餐，餐餐有掌心大小的优质蛋白。\n- 主食选玉米、燕麦等粗杂粮替代部分精米面，搭配足量蔬菜，控制油炸与含糖饮料。\n- 请把每天每一餐都拍照打卡，包括加餐，力求真实记录，便于精准调整。\n\n③运动建议\n- 您目前无运动记录，本期重点是把运动习惯建立起来，从快走、慢跑开始，每周3-5次，每次30分钟。\n- 增加抗阻训练，每周2-3次，针对大肌群做深蹲、靠墙静蹲、弹力带等，帮助您减重时守住肌肉量。\n- 循序渐进，先以\"动起来\"和坚持打卡为目标，避免一次性高强度运动。\n\n④下一周期目标\n- 体重下降1-2kg，体脂率下降1-1.5%，同时骨骼肌量保持不下降。\n- 饮食打卡覆盖率提升至每周5天以上，运动打卡每周不少于3次。\n- 逐步建立规律的饮食与运动节奏，为持续改善体成分打好基础。"}]}, {"case_code": "C5393A", "adherence": "high", "context": "【病例 C5393A】\n基本信息：性别=F，年龄=35，身高=156.0cm\n本期初始体成分（2025-03-07）：体重(kg)=63.5；BMI=26.1；体脂率(%)=37.8；体脂肪量(kg)=24.0；骨骼肌量(kg)=21.6；InBody评分=68.0；基础代谢(kcal)=1222.0\n本期记录的行为（2025-03-07 至 2025-03-29，共 21 天）：\n  饮食打卡 60 条，覆盖 16 个打卡日，打卡日记录热量均值约 522.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：鸡蛋（均值）、牛奶、鲢鱼（白鲢，胖子，连子鱼）、苹果（红富士苹果）、油饼、牛肉（肥瘦）；运动打卡 10 条，覆盖 7 天；常见运动：瑜伽、网球（一般）、keep 睡前舒缓、走跑结合（跑步少于10分钟）", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前体重63.5kg，BMI26.1，体脂率37.8%，处于超重伴体脂偏高的状态，但骨骼肌量21.6kg基础尚可，InBody评分68分，整体可塑性较好。\n- 您对饮食结构调整与有氧加抗阻结合的反应较好，减脂时脂肪下降较明显，但同时容易伴随肌肉流失，需在减脂过程中重点保护肌肉。\n- 您记录依从性较高，但打卡日热量均值偏低（约522 kcal），提示记录可能不完整或存在阶段性进食过少，建议完整真实记录全天摄入。\n\n②饮食建议\n- 全天热量建议设定在1300-1500 kcal，不要过度限制，避免肌肉流失和代谢下降。\n- 每日蛋白质摄入争取达到75-90g，均匀分配到三餐，多选鸡蛋、牛奶、鲢鱼、瘦牛肉等优质蛋白，护肌减脂。\n- 减少油饼等油炸高油主食，主食可换为米饭、杂粮、燕麦，搭配足量蔬菜（每日300-500g）与一份水果如苹果。\n- 完整记录每一餐，包括烹调油和加餐，以便准确评估真实摄入。\n\n③运动建议\n- 每周保留3-4次有氧，如走跑结合、网球，每次30-40分钟，逐步延长慢跑时间提升燃脂。\n- 每周增加2-3次抗阻训练（深蹲、臀桥、弹力带划船等），每次20-30分钟，重点保护并增长骨骼肌。\n- 保留瑜伽和睡前舒缓作为放松与拉伸，助于恢复和睡眠。\n\n④下一周期目标\n- 体重下降1-1.5kg，体脂率下降1.5-2个百分点，骨骼肌量保持不减或略增。\n- 饮食打卡覆盖率提升至每周5天以上并记录全天摄入。\n- 抗阻训练每周不少于2次，维持有氧规律，避免肌肉流失。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI为26.1，体脂率37.8%偏高，骨骼肌量21.6kg相对不足，体成分呈现“脂肪偏多、肌肉偏少”的特点，是本期改善的核心方向。\n- 您记录依从性较好，饮食和运动打卡都较规律，这为稳步推进减脂提供了良好基础。\n- 您对饮食调整反应较敏感，但减重时容易伴随肌肉流失，因此本期需在控脂的同时重点保护和增长肌肉。\n\n②饮食建议\n- 您的打卡热量偏低（均值522kcal），提示存在漏记或全天摄入不足。建议规范记录全天三餐，全天总热量不低于1200kcal，避免过度节食引发肌肉流失与代谢下降。\n- 保证优质蛋白足量，每日每公斤体重约1.2-1.5g，可继续选用鸡蛋、牛奶、鲢鱼、瘦牛肉，每餐都安排一份蛋白。\n- 主食选择以全谷杂粮替代精制米面，减少油饼等高油主食；多用蒸煮，少用油煎。\n- 苹果等水果每日约一份，蔬菜每餐一拳量以增加饱腹与膳食纤维。\n\n③运动建议\n- 您的瑜伽、网球、走跑结合都可保留，建议每周有氧运动累计150分钟，可由走跑结合逐步过渡到稳定慢跑。\n- 增加抗阻训练每周2-3次，针对腿、背、核心做深蹲、靠墙静蹲、弹力带划船等，以提升骨骼肌量。\n- 运动遵循循序渐进，运动后注意拉伸与睡眠恢复，保留keep睡前舒缓助眠。\n\n④下一周期目标\n- 体重下降约1.5-2.5kg，以减脂为主，骨骼肌量尽量维持不下降。\n- 体脂率下降约1-2个百分点，InBody评分稳步提升。\n- 全天饮食记录覆盖率达80%以上，抗阻训练每周达2次以上。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为26.1，处于超重范围，体脂率37.8%偏高，体脂肪量24.0kg，提示以减脂为核心目标。\n- 您骨骼肌量21.6kg尚可，但相对体脂偏低，InBody评分68分，体成分有较大改善空间。\n- 您记录依从性高，21天饮食打卡60条、运动覆盖7天，习惯基础良好，值得肯定并继续保持。\n\n②饮食建议\n- 您饮食打卡多为单餐零散记录，建议完整记录三餐，便于评估全天真实摄入；全天热量目标约1300-1500 kcal，不低于1000 kcal。\n- 您可保留鸡蛋、牛奶、鲢鱼、牛肉等优质蛋白，每日蛋白质目标约70-80g，分配到三餐，有助保留肌肉。\n- 油饼等油炸主食建议减少至每周1次以内，替换为杂粮饭、燕麦、全麦；每日蔬菜达500g，水果1份（如苹果）即可。\n- 注意进食顺序：先蔬菜、再蛋白、后主食，三餐定时，减少含糖饮料与夜间加餐。\n\n③运动建议\n- 您已有瑜伽、网球、走跑结合基础，建议每周有氧运动累计150分钟以上，如快走、慢跑、网球，每次30-40分钟。\n- 增加抗阻训练每周2-3次，针对大腿、臀、背部，如深蹲、臀桥、弹力带划船，帮助提升骨骼肌量。\n- 您可保留睡前keep舒缓与瑜伽作为放松与柔韧训练，循序渐进，避免过量。\n\n④下一周期目标\n- 您下一周期（约4周）目标为减重1.5-2.5kg，以减脂为主，体脂率下降1-2个百分点。\n- 维持或小幅提升骨骼肌量，避免单纯节食掉肌肉。\n- 坚持完整记录三餐与每周3-4次运动打卡，下期复测InBody评估进展。"}]}, {"case_code": "C25CA8", "adherence": "high", "context": "【病例 C25CA8】\n基本信息：性别=F，年龄=51，身高=158.0cm\n本期初始体成分（2025-05-07）：体重(kg)=59.4；BMI=23.8；体脂率(%)=36.0；体脂肪量(kg)=21.4；骨骼肌量(kg)=20.5；InBody评分=68.0；基础代谢(kcal)=1191.0\n本期记录的行为（2025-05-07 至 2025-06-11，共 34 天）：\n  饮食打卡 27 条，覆盖 4 个打卡日，打卡日记录热量均值约 457.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：鸡蛋（均值）、豆浆、大白菜（青白口）、鲅鱼（马鲛鱼，燕鲅鱼，巴鱼）、冬瓜、鸡胸脯肉；无运动打卡", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI 23.8、体脂率36.0%偏高，骨骼肌量20.5kg处于中等偏下水平，提示体成分以脂肪偏多、肌肉储备不足为主要特点。\n- 您在减重过程中容易伴随肌肉流失，因此本期重点是“减脂同时守住并提升肌肉”，而非单纯追求体重数字下降。\n- 您的饮食食材选择优质（鸡蛋、豆浆、鲅鱼、鸡胸肉等优质蛋白与低能量蔬菜），饮食意识良好，但运动记录为零是当前最大短板。\n\n②饮食建议\n- 全天热量建议控制在约1300-1450 kcal，避免过低；三餐规律，保证每餐有一掌心优质蛋白（鸡蛋、鱼、鸡胸、豆制品），全天蛋白质争取达到60-70g以保护肌肉。\n- 延续大白菜、冬瓜等低能量蔬菜，每日蔬菜达到500g；主食换成杂粮、玉米、薯类等粗细搭配，减少精制米面与含糖饮品。\n- 提高打卡完整度，争取每天记录三餐而非个别餐次，便于真实评估全天摄入。\n\n③运动建议\n- 本期务必启动运动：从每周3-4次快走开始，每次30-40分钟，逐步过渡到微微出汗的中等强度。\n- 增加抗阻训练以增肌：每周2-3次，针对腿、臀、背等大肌群做深蹲、靠墙静蹲、弹力带划船等，每次15-20分钟。\n- 运动同样坚持打卡，帮助养成习惯并便于调整。\n\n④下一周期目标\n- 体重下降约1-2kg，体脂率下降1-1.5个百分点，骨骼肌量保持不减或略增。\n- 运动打卡覆盖每周至少4天，饮食打卡覆盖率提升至70%以上。\n- 以“稳步减脂、守住肌肉、规律运动”为本期核心，循序渐进、安全可持续。"}, {"label": "乙", "advice": "①总体评估\n- 您当前BMI 23.8，体脂率36.0%偏高，骨骼肌量20.5kg处于尚可水平，InBody评分68分，整体属于体脂偏高、肌肉量需巩固的体型。\n- 您对饮食调整的反应较好，控制饮食时体重和体脂下降明显，但减重时容易伴随骨骼肌轻度流失，需特别关注保肌。\n- 您的饮食打卡覆盖天数偏少（4天），运动几乎空白，建议提升记录的连续性与全天真实性，以便更准确评估摄入。\n\n②饮食建议\n- 全天热量建议控制在1300-1500 kcal，避免过低导致肌肉流失；三餐规律，不跳餐。\n- 每日保证优质蛋白，按体重计约70-85g：延续您常吃的鸡蛋、豆浆、鲅鱼、鸡胸肉，每餐都安排一掌心蛋白。\n- 主食以杂粮、薯类替代部分精米面，每餐约一拳；蔬菜每日500g，延续大白菜、冬瓜等低热量品类。\n- 减少烹调油与高糖饮品，鱼肉优先清蒸水煮，控制盐分。\n\n③运动建议\n- 本期重点是从零起步建立运动习惯，每周至少安排3-4次快走，每次30分钟，循序渐进。\n- 每周加入2次抗阻训练，以保护骨骼肌：可做弹力带、深蹲、靠墙静蹲、哑铃练习，每次15-20分钟。\n- 运动后及时补充蛋白，并坚持打卡，帮助巩固肌肉量。\n\n④下一周期目标\n- 体重下降1-1.5kg，体脂率下降约1%，骨骼肌量尽量维持不低于当前水平。\n- 饮食打卡覆盖每周不少于5天并记录全天，运动打卡每周不少于3次。\n- 下一周期复测InBody，争取评分稳步提升。"}, {"label": "丙", "advice": "①总体评估\n- 您当前BMI为23.8，处于正常偏高区间，体脂率36.0%偏高，骨骼肌量20.5kg尚可，主要问题在于体脂比例偏高、肌肉占比相对不足，InBody评分68分有提升空间。\n- 您饮食记录依从性较好，常选鸡蛋、豆浆、鲅鱼、鸡胸肉等优质蛋白，蔬菜以大白菜、冬瓜为主，食材结构健康，方向值得肯定。\n- 需提醒您，本期打卡仅覆盖4天且日均457kcal仅为部分记录，无法反映全天真实摄入，建议后续完整记录三餐；本期无运动打卡，活动量不足可能是体脂偏高的重要因素。\n\n②饮食建议\n- 建议您全天热量控制在1300-1500kcal，三餐规律记录，避免漏记导致评估偏差。\n- 保证每日蛋白质摄入约70-80g，延续鸡蛋、豆浆、鲅鱼、鸡胸肉的好习惯，每餐一掌心蛋白。\n- 主食改为部分全谷杂粮（燕麦、糙米、薯类），每餐约一拳；蔬菜每日500g以上，延续大白菜、冬瓜并增加深色蔬菜。\n- 减少烹调用油至每日25g内，少糖少加工食品。\n\n③运动建议\n- 建议您每周进行5次快走或慢跑等有氧运动，每次30-40分钟，从快走起步循序渐进。\n- 每周安排2-3次抗阻训练，如弹力带、深蹲、靠墙静蹲，针对腿臀大肌群，帮助提升骨骼肌量。\n- 增加日常活动，每日步数争取6000-8000步，避免久坐。\n\n④下一周期目标\n- 体重下降1-2kg，体脂率下降1-2个百分点，同时保持骨骼肌量不流失。\n- 饮食打卡覆盖率提升至每日记录，运动打卡每周不少于4次。\n- 下期复测InBody，评分争取提升至72分以上。"}]}, {"case_code": "C81F03", "adherence": "mid", "context": "【病例 C81F03】\n基本信息：性别=F，年龄=46，身高=161.0cm\n本期初始体成分（2024-09-25）：体重(kg)=66.2；BMI=25.5；体脂率(%)=34.4；体脂肪量(kg)=22.8；骨骼肌量(kg)=23.3；InBody评分=72.0；基础代谢(kcal)=1308.0\n本期记录的行为（2024-09-25 至 2024-11-16，共 51 天）：\n  饮食打卡 19 条，覆盖 3 个打卡日，打卡日记录热量均值约 686.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：牛奶、基围虾、米饭、凉拌木耳（水发，黑木耳，云耳）、西兰花炒虾仁、辣子鸡丁；运动打卡 1 条，覆盖 1 天；常见运动：网球（一般）", "candidates": [{"label": "甲", "advice": "①总体评估\n- 您当前BMI为25.5，体脂率34.4%，属于超重伴体脂偏高，但骨骼肌量23.3kg处于较好水平，InBody评分72分基础不错，重点在于减脂同时守住肌肉。\n- 您对饮食调整的反应较好，控制热量即可推动体脂下降，但您在减重时容易伴随肌肉流失，需保证蛋白质与抗阻刺激。\n- 您的饮食打卡仅覆盖3天、运动打卡仅1天，记录依从性偏低，难以全面反映真实摄入，建议先提升记录的连续性。\n\n②饮食建议\n- 打卡日均值686kcal明显偏低，可 const DIMS = [
  ['personalization','个性化',0.25],
  ['appropriateness','临床适宜性',0.30],
  ['actionability','可执行性',0.20],
  ['safety','安全性',0.15],
  ['clarity','清晰度',0.10],
];
let idx = 0;
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function rid(){ return document.getElementById('rater').value.trim(); }
function skey(){ return 'setA_scores_' + (rid()||'_anon'); }
function load(){ try{ return JSON.parse(localStorage.getItem(skey())||'{}'); }catch(e){ return {}; } }
function save(d){ localStorage.setItem(skey(), JSON.stringify(d)); }

function getEntry(d, cc, label){
  d[cc] = d[cc] || {};
  d[cc][label] = d[cc][label] || {scores:{}, unsafe:false, comment:''};
  return d[cc][label];
}
function candDone(e){ return DIMS.every(d=>e && e.scores[d[0]]>=1); }
function caseDone(d, c){ return c.candidates.every(x=>candDone((d[c.case_code]||{})[x.label])); }
function composite(e){
  if(!candDone(e)) return null;
  return DIMS.reduce((s,d)=>s+e.scores[d[0]],0);
}

function render(){
  const c = CASES[idx], d = load();
  let html = `<div class="case-head"><span class="cc">病例 ${esc(c.case_code)}</span>
    <span class="badge">第 ${idx+1} / ${CASES.length} 例</span>
    ${caseDone(d,c)?'<span class="badge" style="background:#dcfce7;color:#166534">✓ 已完成</span>':'<span class="incomplete">未完成</span>'}</div>
    <div class="ctx">${esc(c.context)}</div><div class="cols">`;
  for(const cand of c.candidates){
    const e = getEntry(d, c.case_code, cand.label);
    const comp = composite(e);
    let dims = '';
    for(const [k,name,w] of DIMS){
      let btns = '';
      for(let v=1; v<=5; v++){
        const sel = e.scores[k]===v ? 'sel' : '';
        btns += `<button class="${sel}" onclick="setScore('${cand.label}','${k}',${v})">${v}</button>`;
      }
      dims += `<div class="dim"><span class="dn">${name}</span><span class="likert">${btns}</span></div>`;
    }
    html += `<div class="cand"><h3>建议 ${esc(cand.label)}</h3>
      <div class="advice">${esc(cand.advice)}</div>
      <div class="scorebox">${dims}
        <div class="comp"><span>总分 <b>${comp!=null?comp+' / 25':'—'}</b></span></div>
        <div class="comment"><textarea placeholder="备注（可选）" onchange="setComment('${cand.label}',this.value)">${esc(e.comment)}</textarea></div>
      </div></div>`;
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  document.getElementById('navinfo').textContent = `${c.case_code}（${idx+1}/${CASES.length}）`;
  updateHeader();
  window.scrollTo(0,0);
}
function updateHeader(){
  const d = load();
  const done = CASES.filter(c=>caseDone(d,c)).length;
  document.getElementById('pfill').style.width = (100*done/CASES.length)+'%';
  document.getElementById('ptext').textContent = `${done}/${CASES.length} 例完成`;
  const j = document.getElementById('jump');
  j.innerHTML = CASES.map((c,i)=>`<option value="${i}" ${i===idx?'selected':''}>${caseDone(d,c)?'✓':'○'} ${c.case_code}</option>`).join('');
}
function setScore(label,k,v){
  const d = load(); const c = CASES[idx];
  const e = getEntry(d, c.case_code, label);
  e.scores[k] = v;
  save(d); render();
}
function setUnsafe(label,val){
  const d = load(); const e = getEntry(d, CASES[idx].case_code, label);
  e.unsafe = val; save(d);
}
function setComment(label,val){
  const d = load(); const e = getEntry(d, CASES[idx].case_code, label);
  e.comment = val; save(d);
}
function nav(step){
  idx = Math.min(CASES.length-1, Math.max(0, idx+step));
  render();
}
document.getElementById('jump').addEventListener('change', e=>{ idx=+e.target.value; render(); });
let curKey = skey();
document.getElementById('rater').addEventListener('input', ()=>{
  const nk = skey();
  if(nk!==curKey){
    const old = localStorage.getItem(curKey);
    if(old && old!=='{}' && !localStorage.getItem(nk)) localStorage.setItem(nk, old);
    curKey = nk;
  }
  render();
});

function exportCSV(){
  const r = rid();
  if(!r){ alert('请先填写评审ID'); return; }
  const d = load();
  const incomplete = CASES.filter(c=>!caseDone(d,c)).map(c=>c.case_code);
  if(incomplete.length && !confirm(`还有 ${incomplete.length} 例未完成（${incomplete.slice(0,5).join(', ')}…）。仍要导出吗？`)) return;
  const cols = ['case_code','rater_id','candidate_label','dim_personalization','dim_appropriateness','dim_actionability','dim_safety','dim_clarity','unsafe_flag','comment'];
  const lines = [cols.join(',')];
  for(const c of CASES){
    for(const cand of c.candidates){
      const e = (d[c.case_code]||{})[cand.label];
      if(!e || !candDone(e)) continue;
      const cm = '"'+(e.comment||'').replace(/"/g,'""').replace(/\n/g,' ')+'"';
      lines.push([c.case_code, r, cand.label,
        e.scores.personalization, e.scores.appropriateness, e.scores.actionability,
        e.scores.safety, e.scores.clarity, 0, cm].join(','));
    }
  }
  download(`physician_scores_${r}.csv`, '\ufeff'+lines.join('\n'), 'text/csv');
}
function exportJSON(){
  const r = rid()||'anon';
  download(`setA_scores_backup_${r}.json`, JSON.stringify({rater:r, ts:new Date().toISOString(), data:load()}, null, 1), 'application/json');
}
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click();
}

  if(!r){ alert('请先填写评审ID'); return; }
  const d = load();
  const incomplete = CASES.filter(c=>!caseDone(d,c)).length;
  if(incomplete>0 && !confirm(`还有 ${incomplete} 例未完成，确定只提交已完成的部分吗？（之后可以继续填写并再次提交）`)) return;
  const rows = [];
  for(const c of CASES){
    for(const cand of c.candidates){
      const e = (d[c.case_code]||{})[cand.label];
      if(!e || !candDone(e)) continue;
      rows.push({rater_id:r, case_code:c.case_code, candidate_label:cand.label,
        dim_personalization:e.scores.personalization, dim_appropriateness:e.scores.appropriateness,
        dim_actionability:e.scores.actionability, dim_safety:e.scores.safety, dim_clarity:e.scores.clarity,
        unsafe_flag:false, comment:e.comment||''});
    }
  }
  if(!rows.length){ alert('还没有完成任何病例的评分'); return; }
  const btn=document.getElementById('submitbtn'); btn.disabled=true; btn.textContent='提交中…';
  try{
    const res = await fetch(SUPA.url+'/rest/v1/physician_scores', {
      method:'POST',
      headers:{apikey:SUPA.key, Authorization:'Bearer '+SUPA.key,
               'Content-Type':'application/json', Prefer:'return=minimal'},
      body: JSON.stringify(rows)
    });
    if(!res.ok) throw new Error(await res.text());
    alert(`提交成功：${rows.length} 条评分已上传。感谢！`);
  }catch(e){
    alert('提交失败（'+e.message+'）。请点「导出 CSV」保存文件并发回给研究组。');
  }finally{ btn.disabled=false; btn.textContent='提交评分'; }
}
render();
</script>
</body>
</html>
