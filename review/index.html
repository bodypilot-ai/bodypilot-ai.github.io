<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BodyPilot · 基础指令（Prompt）临床审查</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2430;--muted:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#059669;--warn:#b45309;--bad:#dc2626;--accbg:#eff6ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0}
header .tv{font-size:12px;color:var(--muted)}
.rater input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:140px}
button{padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:var(--ink)}
button:hover{background:#f3f4f6}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.lang{border-color:var(--acc);color:var(--acc);font-weight:700}
main{max-width:1280px;margin:0 auto;padding:18px 22px 70px}
h2{font-size:17px;margin:30px 0 10px;padding-left:10px;border-left:4px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.task{background:#eff6ff;border:1px solid #bfdbfe}
.task b{color:#1d4ed8}
.illus{margin:0;text-align:center}
.illus img{width:100%;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.illus figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
.promptbox{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--accbg);border:2px solid var(--acc);border-radius:10px;padding:14px 16px;color:#1e3a8a;line-height:1.75;box-shadow:0 2px 8px rgba(37,99,235,.12)}
.sfxsep{white-space:normal;text-align:center;color:#3b82f6;font-size:11px;margin:8px 0 4px;border-top:1px dashed #93c5fd;padding-top:6px}
.sfxbox{white-space:normal}
.sfxbox div{margin:0;line-height:1.7}
.sfxbox .sfxk{color:#0369a1;font-weight:700}
.screenbox{margin-top:14px;background:#fff7ed;border:1.5px solid #fdba74;border-radius:10px;padding:10px 14px}
.screenbox .sbt{font-weight:700;font-size:13.5px;color:#9a3412}
.qitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.qitem .qn{font-weight:700;margin-bottom:2px}
.qitem .qr{font-size:12.5px;color:#1e40af;background:var(--accbg);border-left:3px solid var(--acc);padding:5px 10px;border-radius:6px;margin:4px 0 6px}
.qitem .qa{font-size:13px;margin-bottom:8px}
.okng{display:flex;gap:8px;margin-bottom:6px}
.okng button{font-size:12.5px;padding:5px 14px}
.okng button.sel-ok{background:#dcfce7;border-color:#86efac;color:#166534;font-weight:700}
.okng button.sel-ng{background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:700}
textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:36px}
.case{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:14px;overflow:hidden}
.case-h{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#fafafa;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.case-h .cc{font-weight:700}
.badge{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.adh-high{background:#dcfce7;color:#166534}.adh-mid{background:#fef9c3;color:#854d0e}.adh-low{background:#fee2e2;color:#991b1b}
.chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.case.open .chev{transform:rotate(90deg)}
.case-b{display:none;grid-template-columns:1fr 1fr;gap:0}
.case.open .case-b{display:grid}
.half{padding:12px 16px;min-width:0}
.half:first-child{border-right:1px solid var(--line)}
.half h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.io{white-space:pre-wrap;font-size:12.5px;color:#374151;max-height:330px;overflow-y:auto}
.case-fb{padding:10px 16px;border-top:1px solid var(--line);background:#fcfcfd;display:none}
.case.open .case-fb{display:block}
.flag label{font-size:12.5px;color:var(--bad);display:flex;align-items:center;gap:5px;cursor:pointer;margin-bottom:6px}
.freeze{margin:10px 0}
.freeze-btns{display:flex;gap:10px;margin-top:8px}
.freeze-btns button{padding:8px 22px;font-size:13.5px}
.freeze button.sel-yes{background:#dcfce7;border-color:#86efac;color:#166534;font-weight:700}
.freeze button.sel-no{background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:700}
.io::-webkit-scrollbar{width:5px}.io::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
@media(max-width:860px){.case-b{grid-template-columns:1fr}.half:first-child{border-right:none;border-bottom:1px solid var(--line)}}
.note{font-size:12.5px;color:var(--muted)}
.req{color:var(--bad);font-weight:800}
</style>
</head>
<body>
<header>
  <h1 data-k="h1">BodyPilot · 基础指令（Prompt）临床审查</h1><span class="tv" data-k="tv">指令版本 v3-2026-06-12 · 定稿前审查</span>
  <span style="flex:1"></span>
  <button onclick="setLang()" class="lang" id="langbtn">EN</button>
  <span class="rater"><span data-k="raterlbl">审查人</span> <input id="rater" data-kph="raterph" placeholder="姓名"></span>
  <button onclick="submitToServer()" class="primary" id="submitbtn" data-k="submit" style="display:none">提交（完成后请点击）</button>
  <button onclick="exportMD()" class="primary" id="exportbtn" data-k="export">导出反馈</button>
  <button onclick="exportJSON()" id="jsonbtn" data-k="json">备份 JSON</button>
<div id="scrollbar" style="position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0;transition:width .1s"></div></header>
<main>

<div class="card task" data-k="intro"></div>

<h2 data-k="h2project">这个项目在做什么</h2>
<div class="card">
  <p style="margin:4px 0 12px" data-k="pproject1"></p>
  <div style="max-width:880px;margin:0 auto">
    <figure class="illus"><img id="illus-img" alt="framework illustration"><figcaption data-k="figcap">研究框架示意图</figcaption></figure>
  </div>
  <p class="note" style="margin:10px 0 0" data-k="notellm"></p>
</div>

<h2 data-k="h2prompt">基础指令（Prompt）原文（逐字）</h2>
<div class="card">
  <p style="margin:4px 0 10px" data-k="promptwhat"></p>
  <p style="margin:0 0 6px;color:var(--acc);font-size:15px" data-k="promptbelow"></p>
  <div class="promptbox"><div id="bp"></div><div class="sfxsep" data-k="sfxsep"></div><div class="sfxbox"><div><span class="sfxk" data-k="sfxklow"></span><span id="sfx-low"></span></div><div><span class="sfxk" data-k="sfxkmid"></span><span id="sfx-mid"></span></div><div><span class="sfxk" data-k="sfxkhigh"></span><span id="sfx-high"></span></div></div></div>
</div>

<h2 data-k="h2review">请逐项审查这段指令</h2>
<p class="note" data-k="notereview"></p>
<div id="pquestions"></div>

<div class="card" style="margin-top:14px">
  <b style="font-size:13.5px" data-k="potherttl"></b>
  <p class="note" style="margin:2px 0 6px" data-k="pothernote"></p>
  <textarea id="promptsuggest" data-kph="optionalph" placeholder="选填" style="min-height:60px" oninput="saveField('prompt_suggestion',this.value)"></textarea>
</div>

<h2 data-k="h2boundary">请重点判断的 5 个边界问题</h2>
<div class="screenbox" style="margin:0 0 12px">
  <div class="sbt" data-k="sbt"></div>
  <p style="margin:4px 0 6px;font-size:13px" data-k="sbp"></p>
  <ul style="margin:0;padding-left:20px;font-size:13px">
    <li data-k="sbli1"></li>
    <li data-k="sbli2"></li>
    <li data-k="sbli3"></li>
  </ul>
  <p class="note" style="margin:6px 0 0" data-k="sbnote"></p>
</div>
<div id="questions"></div>

<div class="card" style="margin-top:14px">
  <b style="font-size:13.5px" data-k="botherttl"></b>
  <p class="note" style="margin:2px 0 6px" data-k="bothernote"></p>
  <textarea id="boundarysuggest" data-kph="optionalph" placeholder="选填" style="min-height:60px" oninput="saveField('boundary_suggestion',this.value)"></textarea>
</div>

<h2 data-k="h2sample">试用样例（依从性中等用户）</h2>
<p class="note" data-k="notesample"></p>
<div id="cases"></div>

<h2 data-k="h2conclusion">总体结论</h2>
<div class="card">
  <div class="freeze">
    <b data-k="freezelbl"></b>
    <div class="freeze-btns">
      <button id="fz-yes" data-k="fzyes" onclick="setFreeze(true)">可以定稿</button>
      <button id="fz-no" data-k="fzno" onclick="setFreeze(false)">需修改后再审</button>
    </div>
  </div>
  <textarea id="overall" data-kph="overallph" placeholder="必须修改的内容 / 其他意见（自由填写）" style="min-height:70px" oninput="saveField('overall',this.value)"></textarea>
</div>
<div id="bottomsubmit" style="display:none;text-align:center;margin-top:18px">
  <button class="primary" style="padding:12px 48px;font-size:15px" onclick="submitToServer()" data-k="submit"></button>
  <p class="note" style="margin-top:6px" data-k="submitnote"></p>
  <p style="margin-top:14px;font-size:14px" data-k="thanks"></p>
</div>

</main>
<script>
const D = {"base_prompt": "你是一名服务于医院体重/体成分健康管理平台的营养与运动指导专家。请基于用户的客观体成分（InBody）数据与其自我记录的饮食/运动行为，给出个性化、循证、可执行的体成分管理建议。只输出建议本身，使用中文，结构化为四个部分：①总体评估 ②饮食建议 ③运动建议 ④下一周期目标。每部分以2-4条要点呈现，简明、具体、可执行，四部分务必全部写完，全文约300-450字。请使用纯文本，不要使用Markdown标题(#)、加粗(**)、二级标题等任何排版符号，仅用①②③④与短横线“-”。请统一以“您”称呼用户（每个部分均自然使用“您”），保持称呼风格一致。不得编造未提供的检查结果；不得给出医疗诊断或处方药建议；不得推荐极端节食（每日热量不得建议低于1000 kcal）或过量运动。", "base_prompt_en": "You are a nutrition and exercise guidance specialist serving a hospital weight / body-composition health-management platform. Based on the user's objective body-composition (InBody) data and their self-recorded diet/exercise behaviors, provide personalized, evidence-based, actionable body-composition management advice. Output only the advice itself, in Chinese, structured into four parts: ① Overall assessment ② Dietary advice ③ Exercise advice ④ Goals for the next cycle. Present each part as 2-4 bullet points — concise, specific, and actionable; all four parts must be fully written, with the whole text about 300-450 characters. Use plain text only; do not use Markdown headings (#), bold (**), sub-headings, or any other formatting symbols — use only ①②③④ and the hyphen \"-\". Address the user consistently with the polite form “您” (“you”) in every part, keeping the style consistent. Do not fabricate examination results that were not provided; do not give a medical diagnosis or prescription-drug advice; do not recommend extreme dieting (never advise a daily intake below 1000 kcal) or excessive exercise.", "suffixes": {"low": "该用户记录依从性较低，建议简洁聚焦于1-2个最关键、最易坚持的改变。", "mid": "该用户记录依从性中等，可给出适度细化的分项建议。", "high": "该用户记录依从性较高，可给出较完整、分项细化的方案。"}, "suffixes_en": {"low": "This user's records show low adherence; keep the advice brief and focused on 1-2 of the most critical, easiest-to-sustain changes.", "mid": "This user's records show moderate adherence; you may give moderately detailed, itemized advice.", "high": "This user's records show high adherence; you may give a more complete, itemized, detailed plan."}, "template_version": "v3-2026-06-12", "cases": [{"cycle_id": "1480#0", "adherence": "mid", "context": "【用户当前情况】\n基本信息：性别=F，年龄=48，身高=150.0cm\n本期初始体成分（2024-10-23）：体重(kg)=59.9；BMI=26.6；体脂率(%)=40.5；体脂肪量(kg)=24.3；骨骼肌量(kg)=19.1；InBody评分=66.0；基础代谢(kcal)=1140.0\n本期记录的行为（2024-10-23 至 2024-11-29，共 36 天）：\n  饮食打卡 26 条，覆盖 3 个打卡日，打卡日记录热量均值约 1065.0 kcal（仅基于有打卡的天数，非全天真实摄入）；常见食物：酸奶、饺子（猪肉香菇馅）、鸡蛋（均值）、酸菜牛肉、米饭、牛奶；运动打卡 4 条，覆盖 3 天；常见运动：步行（3km/h）、骑自行车（<16km/h）、乒乓球\n\n请给出本期的体成分管理建议。", "advice": "①总体评估\n- 您当前BMI为26.6，属于偏高范围，体脂率40.5%明显超过同龄女性适宜水平，骨骼肌量19.1kg相对偏少，体成分管理重点在于减脂同时保住肌肉。\n- 您基础代谢约1140kcal偏低，与肌肉量不足有关，提升肌肉对长期控重很重要。\n- 您记录依从性中等，饮食仅覆盖3天、运动覆盖3天，数据有限，建议提高打卡频率以便更准确评估。\n\n②饮食建议\n- 建议您全天热量控制在1200-1400kcal区间，不要过低，以免肌肉流失和代谢进一步下降。\n- 您可保证每餐有优质蛋白，如鸡蛋、牛奶、酸奶、瘦牛肉、鱼虾、豆制品，全天蛋白质争取约60-70g，帮助维持肌肉。\n- 您的饺子、米饭等主食建议定量，约每餐一小碗，可部分替换为杂粮；多加绿叶蔬菜增加饱腹感。\n- 注意您的烹调少油少盐，酸菜类高盐食物适量，每日饮水1500ml以上。\n\n③运动建议\n- 建议您每周进行有氧运动5次，每次30-40分钟，可将步行加快至4-5km/h或延长骑行时间。\n- 您需增加抗阻训练，每周2-3次，如弹力带、靠墙静蹲、坐姿起立、哑铃练习，针对大肌群提升肌肉量。\n- 乒乓球可作为兴趣运动保留，注意运动前后热身拉伸，循序渐进避免受伤。\n\n④下一周期目标\n- 建议您下一周期（约4-6周）减重1.5-2.5kg，以减脂为主，体脂率下降1-2个百分点，骨骼肌量尽量不降。\n- 您可将饮食打卡提升至每日记录，运动每周至少4天，以便更好追踪效果与调整方案。", "context_en": "[User's current situation]\nBasic info: sex = F, age = 48, height = 150.0 cm\nBaseline body composition this cycle (2024-10-23): weight (kg) = 59.9; BMI = 26.6; body fat (%) = 40.5; fat mass (kg) = 24.3; skeletal muscle mass (kg) = 19.1; InBody score = 66.0; basal metabolic rate (kcal) = 1140.0\nBehaviors recorded this cycle (2024-10-23 to 2024-11-29, 36 days total):\n  26 diet check-ins covering 3 logged days; mean logged-day intake ≈ 1065.0 kcal (based only on days with check-ins, not true full-day intake); common foods: yogurt, dumplings (pork & shiitake), eggs (avg), pickled-cabbage beef, rice, milk; 4 exercise check-ins covering 3 days; common activities: walking (3 km/h), cycling (<16 km/h), table tennis\n\nPlease provide body-composition management advice for this cycle.", "advice_en": "① Overall assessment\n- Your current BMI is 26.6, in the higher range; your body fat of 40.5% is clearly above the suitable level for women of your age, and your skeletal muscle mass of 19.1 kg is relatively low — the focus is to lose fat while preserving muscle.\n- Your basal metabolic rate of about 1140 kcal is on the low side, related to insufficient muscle; building muscle matters for long-term weight control.\n- Your record adherence is moderate, with diet covering only 3 days and exercise 3 days, so the data are limited; logging more often is advised for a more accurate assessment.\n\n② Dietary advice\n- Keep total daily calories in the 1200-1400 kcal range — not too low, to avoid muscle loss and a further drop in metabolism.\n- Ensure quality protein at each meal, such as eggs, milk, yogurt, lean beef, fish and shrimp, and soy products, aiming for about 60-70 g of protein per day to help maintain muscle.\n- Portion staples like dumplings and rice — about a small bowl per meal — and partly replace them with whole grains; add more leafy greens for satiety.\n- Cook with less oil and salt, eat high-salt foods like pickled vegetables in moderation, and drink at least 1500 ml of water daily.\n\n③ Exercise advice\n- Do aerobic exercise 5 times a week, 30-40 minutes each; you can speed walking up to 4-5 km/h or lengthen your cycling time.\n- Add resistance training 2-3 times a week — e.g., resistance bands, wall sits, sit-to-stands, dumbbell exercises — targeting large muscle groups to build muscle.\n- Keep table tennis as a recreational activity; warm up and stretch before and after, and progress gradually to avoid injury.\n\n④ Goals for the next cycle\n- Aim to lose 1.5-2.5 kg in the next cycle (about 4-6 weeks), mainly fat, with body fat down 1-2 percentage points and skeletal muscle mass kept as stable as possible.\n- Increase diet logging to daily and exercise to at least 4 days a week, to better track results and adjust the plan."}], "pquestions": [{"id": "p_role", "name": "身份设定", "rule": "指令原文：\"你是一名服务于医院体重/体成分健康管理平台的营养与运动指导专家\"", "ask": "这个身份设定是否合理？是否应更具体（如临床营养师、运动医学专业背景）？", "name_en": "Role definition", "rule_en": "Instruction text: \"You are a nutrition and exercise guidance specialist serving a hospital weight / body-composition health-management platform\"", "ask_en": "Is this role definition appropriate? Should it be more specific (e.g., clinical dietitian, sports-medicine background)?"}, {"id": "p_context", "name": "专业背景", "rule": "现况：除身份一句外，没有给 AI 更多专业背景设定", "ask": "是否需要补充\"精通××\"之类的描述（如肥胖症诊疗指南、中国居民膳食指南、运动处方原则），让 AI 的知识基调更明确？", "name_en": "Professional background", "rule_en": "Current state: apart from the one role sentence, no further professional background is given to the AI", "ask_en": "Should we add a description like \"well-versed in xx\" (e.g., obesity-treatment guidelines, the Chinese dietary guidelines, exercise-prescription principles) to make the AI’s knowledge base clearer?"}, {"id": "p_goals", "name": "建议要求", "rule": "指令原文：给出\"个性化、循证、可执行\"的体成分管理建议", "ask": "这三个要求是否全面？是否还应加入其他要求（如安全优先、温和渐进、兼顾心理与依从性）？", "name_en": "Requirements for the advice", "rule_en": "Instruction text: give \"personalized, evidence-based, actionable\" body-composition advice", "ask_en": "Are these three requirements comprehensive? Should others be added (e.g., safety first, gentle/gradual progress, attention to psychology and adherence)?"}, {"id": "p_structure", "name": "输出结构", "rule": "指令原文：①总体评估 ②饮食建议 ③运动建议 ④下一周期目标", "ask": "四个部分是否全面？是否缺少应有的版块（如睡眠/压力管理、复测提醒），或有应去掉的？", "name_en": "Output structure", "rule_en": "Instruction text: ① Overall assessment ② Dietary advice ③ Exercise advice ④ Goals for the next cycle", "ask_en": "Are these four parts comprehensive? Is any section missing (e.g., sleep/stress management, re-measurement reminders), or any that should be removed?"}, {"id": "p_length", "name": "篇幅", "rule": "指令原文：每部分 2-4 条要点，全文约 300-450 字", "ask": "结合下方样例的实际长度，这个篇幅对用户是否合适？偏长还是偏短？", "name_en": "Length", "rule_en": "Instruction text: 2-4 bullet points per part, about 300-450 characters total", "ask_en": "Considering the actual length of the sample below, is this length appropriate for users? Too long or too short?"}, {"id": "p_prohibit", "name": "禁止项", "rule": "指令原文：不得编造未提供的检查结果；不得给出医疗诊断或处方药建议；不得推荐极端节食（<1000 kcal/天）或过量运动", "ask": "这些\"不得\"是否全面？从临床角度还应明确禁止什么？", "name_en": "Prohibitions", "rule_en": "Instruction text: must not fabricate examination results that were not provided; must not give a medical diagnosis or prescription-drug advice; must not recommend extreme dieting (<1000 kcal/day) or excessive exercise", "ask_en": "Are these \"must-nots\" comprehensive? From a clinical standpoint, what else should be explicitly prohibited?"}, {"id": "p_adherence", "name": "按打卡情况调整建议详略", "rule": "指令结尾按用户打卡密度三选一追加：打卡少→\"建议简洁聚焦于1-2个最关键、最易坚持的改变\"；打卡中等→\"可给出适度细化的分项建议\"；打卡多→\"可给出较完整、分项细化的方案\"", "ask": "按打卡密度调整建议详略，这个做法是否合理？三档的划分和对应策略（少→聚焦、多→细化）从依从性管理角度是否恰当？", "name_en": "Adjusting detail by check-in frequency", "rule_en": "A sentence is appended at the end depending on the user’s check-in density (one of three): few → \"keep the advice brief and focused on 1-2 of the most critical, easiest-to-sustain changes\"; moderate → \"you may give moderately detailed, itemized advice\"; many → \"you may give a more complete, itemized, detailed plan\"", "ask_en": "Is it reasonable to adjust the level of detail by check-in density? From an adherence-management view, are the three tiers and their strategies (few → focus, many → detail) appropriate?"}], "questions": [{"id": "q_calorie", "name": "热量下限", "rule": "当前规则：建议热量不得低于 1000 kcal/天", "ask": "对本队列（以超重中国女性为主）1000 是否合适？是否应按性别/基础代谢设定（如女性 ≥1200）？", "name_en": "Calorie floor", "rule_en": "Current rule: advised calories must not be below 1000 kcal/day", "ask_en": "For this cohort (mostly overweight Chinese women), is 1000 appropriate? Should it be set by sex / basal metabolism (e.g., ≥1200 for women)?"}, {"id": "q_protein", "name": "蛋白质", "rule": "当前规则：无显式上下限；模型自发给出如 70-80g/天 的目标", "ask": "是否需要设蛋白质上/下限（g/kg）？是否需要肾功能相关的提醒措辞？", "name_en": "Protein", "rule_en": "Current rule: no explicit upper/lower limit; the model spontaneously suggests targets like 70-80 g/day", "ask_en": "Should protein upper/lower limits be set (g/kg)? Is wording about kidney function needed?"}, {"id": "q_exercise", "name": "运动边界", "rule": "当前规则：≤180 分钟/天、≤3 小时/天、跑步 ≤10 km/天", "ask": "对体能差/高BMI/年长用户是否合适？是否需要单次时长上限或循序渐进要求？", "name_en": "Exercise limits", "rule_en": "Current rule: ≤180 min/day, ≤3 hours/day, running ≤10 km/day", "ask_en": "Are these appropriate for low-fitness / high-BMI / older users? Is a per-session time cap or a gradual-progression requirement needed?"}, {"id": "q_highbmi", "name": "高BMI/共病", "rule": "当前规则：无特殊处理", "ask": "对 BMI ≥35-40 的用户，是否应要求加入\"运动前咨询医生\"等提示？", "name_en": "High BMI / comorbidity", "rule_en": "Current rule: no special handling", "ask_en": "For users with BMI ≥35-40, should a prompt like \"consult a doctor before exercising\" be required?"}, {"id": "q_scope", "name": "范围边界", "rule": "当前规则：禁止诊断、处方药建议", "ask": "还有什么应明确禁止的？（保健品、特定药物、断食方案等）", "name_en": "Scope limits", "rule_en": "Current rule: diagnosis and prescription-drug advice are prohibited", "ask_en": "What else should be explicitly prohibited? (supplements, specific drugs, fasting regimens, etc.)"}]};
const L = {"zh": {"title": "BodyPilot · 基础指令（Prompt）临床审查", "h1": "BodyPilot · 基础指令（Prompt）临床审查", "tv": "指令版本 v3-2026-06-12 · 定稿前审查", "raterlbl": "审查人", "raterph": "姓名", "submit": "提交（完成后请点击）", "export": "导出反馈", "json": "备份 JSON", "figcap": "研究框架示意图", "intro": "<b>感谢您拨冗参与本次审查！</b><br>审查通常需要 8–10 分钟。在此我们会为您介绍 AI 如何工作以及本次问卷中需要您的支持。在本项目中，AI 的定位是健康管理助手，根据用户情况生成个性化的饮食和运动建议，帮助用户更好地进行体重管理。<br><br>在本次问卷中，我们邀请您评估我们给 AI 模型的<b style=\"color:#2563eb\">基础指令（Prompt）</b>，基础指令的作用是让 AI 明确自己的定位、工作内容和安全边界。您需要评估<b style=\"color:#2563eb\">基础指令（Prompt）</b>内容是否达到了实验标准。", "h2project": "这个项目在做什么", "pproject1": "医院体重管理平台积累了用户的 InBody 体成分测量与饮食/运动打卡记录。我们让 AI 大语言模型基于这些数据起草每周期的体成分管理建议，流程如下：", "notellm": "大语言模型（LLM）是一种能读懂文字、自动生成文字的 AI。它本身并不知道该怎么做，需要我们预先写好一段固定说明——也就是\"基础指令（Prompt）\"，告诉它扮演什么角色、参考哪些信息、按什么格式回答、哪些话不能说。生成建议时，系统把这段固定指令连同该用户的体成分与打卡数据一起交给模型，模型据此自动写出一份饮食/运动建议。本次请您审查的，就是这段对所有用户通用的基础指令（Prompt）。", "h2prompt": "基础指令（Prompt）原文（逐字）", "promptwhat": "<b>这是什么：</b>下面这段文字是我们每次让 AI 写建议前发给它的「工作指令」。AI 每写一份建议，都会先读这段话，再读该用户的数据，然后严格按这里规定的角色、输出格式和安全红线来写——相当于给一位新上岗营养师的岗位说明书。<b>它决定了所有建议的行为边界：这段指令写得好不好、边界划得对不对，直接影响每一份输出。</b>您后面看到的样例，就是 AI 在这段指令下写出的真实建议。", "promptbelow": "<b>下面是这段指令的原文：</b>", "sfxsep": "↓ 结尾再追加一句，按该用户打卡密度三选一，连在上文一起发给 AI ↓", "sfxklow": "打卡少：", "sfxkmid": "打卡中等：", "sfxkhigh": "打卡多：", "h2review": "请逐项审查这段指令", "notereview": "下面把指令拆成 7 个方面，请逐项判断；选「需要修改」时请写明您的建议。", "potherttl": "对这段指令的其他意见（选填）", "pothernote": "以上 7 个方面之外，您觉得这段指令还有什么应增、应删、应改的地方？（如措辞、缺失的注意事项等）", "optionalph": "选填", "h2boundary": "请重点判断的 5 个边界问题", "sbt": "🛡 背景：除上面的指令外，还有一道程序化安全筛查", "sbp": "AI 写完建议后，另有一个<b>计算机程序</b>逐条检查输出文本，命中以下任一情形即自动标记、转人工复核：", "sbli1": "建议每日热量 <b>&lt;1000 kcal</b>（或建议吃到 1000 以下）", "sbli2": "建议运动 <b>≥180 分钟/天</b> 或 <b>≥3 小时/天</b>，或跑步 <b>≥10 km/天</b>", "sbli3": "出现<b>断食 / 催吐 / 泻药 / 利尿剂 / 减肥药</b>等词（且不是在否定语境中）", "sbnote": "即指令要求 AI 不越界，程序再兜底检查一遍。下面 5 个问题请您判断的，正是这两道防线的边界是否合理。", "botherttl": "对安全边界的其他意见（选填）", "bothernote": "以上 5 个边界问题之外，您觉得安全规则还有什么需要补充或调整的？", "h2sample": "试用样例（依从性中等用户）", "notesample": "这是 AI 按上面那段指令、针对一位真实用户（依从性中等）写出的建议。左侧为 AI 收到的输入数据，右侧为它写出的建议。请看看写得怎么样：内容是否专业、合理、可执行；如有越界或不当之处请勾选标记。您在样例中发现的共性问题，往往对应上面指令需要修改的地方。", "h2conclusion": "总体结论", "freezelbl": "<span class=\"req\">*</span> 总体结论：这套基础指令（Prompt）可以定稿、用于正式实验了吗？", "fzyes": "可以定稿", "fzno": "需修改后再审", "overallph": "必须修改的内容 / 其他意见（自由填写）", "submitnote": "全部填写完成后点击提交；提交后仍可修改并再次提交。", "thanks": "🙏 再次感谢您的时间与专业意见！", "langbtn": "EN", "okPrompt": "目前写法可以", "okRule": "目前规则可以", "needfix": "需要修改", "qph": "意见/建议（选填，勾「需要修改」时请务必填写）", "sample": "样例", "adh": "依从性", "adhlow": "低", "adhmid": "中", "adhhigh": "高", "flagged": "⚠ 已标记问题", "inhdr": "输入（模型收到的数据）", "outhdr": "输出（模型生成的建议）", "fullinput": "完整输入 = 上方基础指令（Prompt）＋ 以下用户数据", "flagcb": "该样例存在临床问题（越界/不当/缺失必要提示）", "caseph": "对这份建议的评价：写得怎么样？有何不专业、不合理或可改进之处？（选填）", "needName": "请先在右上角填写审查人姓名", "submitting": "提交中…", "submitOk": "提交成功，感谢您的反馈！"}, "en": {"title": "BodyPilot · Clinical Review of the Base Instruction (Prompt)", "h1": "BodyPilot · Clinical Review of the Base Instruction (Prompt)", "tv": "Prompt version v3-2026-06-12 · pre-finalization review", "raterlbl": "Reviewer", "raterph": "Name", "submit": "Submit (click when done)", "export": "Export feedback", "json": "Back up JSON", "figcap": "Research framework illustration", "intro": "<b>Thank you for taking part in this review!</b><br>The review usually takes 8–10 minutes. Below we briefly explain how the AI works and where we’d like your input. In this project, the AI acts as a health-management assistant that generates personalized diet and exercise advice based on each user’s situation, to help users manage their weight better.<br><br>In this questionnaire, we invite you to evaluate the <b style=\"color:#2563eb\">base instruction (Prompt)</b> we give the AI model. The base instruction tells the AI its role, what it should do, and its safety boundaries. You will assess whether the <b style=\"color:#2563eb\">base instruction (Prompt)</b> meets the standard for the experiment.", "h2project": "What this project does", "pproject1": "The hospital weight-management platform has accumulated users' InBody body-composition measurements and diet/exercise check-in records. We have an AI large language model draft each cycle's body-composition advice from this data. The flow is as follows:", "notellm": "A large language model (LLM) is an AI that can read text and automatically generate text. By itself it does not know what to do; we write a fixed set of instructions in advance — the \"base instruction (Prompt)\" — telling it what role to play, what information to use, what format to answer in, and what it must not say. To generate advice, the system sends this fixed instruction together with that user’s body-composition and check-in data to the model, which then automatically writes a piece of diet/exercise advice. What we ask you to review here is this base instruction (Prompt), which is shared across all users.", "h2prompt": "The Base Instruction (Prompt), verbatim", "promptwhat": "<b>What this is:</b> the text below is the \"working instruction\" we send the AI before it writes any advice. Each time the AI writes a piece of advice, it first reads this text, then reads that user’s data, then writes strictly according to the role, output format, and safety red lines set here — like a job description for a newly hired dietitian. <b>It defines the behavioral boundaries of all advice: how well this instruction is written and how correctly the boundaries are drawn directly affects every output.</b> The sample you see later is real advice the AI wrote under this instruction.", "promptbelow": "<b>Below is the verbatim text of this instruction:</b>", "sfxsep": "↓ One more sentence is appended at the end — one of three by the user’s check-in density — and sent to the AI together with the text above ↓", "sfxklow": "Few check-ins: ", "sfxkmid": "Moderate check-ins: ", "sfxkhigh": "Many check-ins: ", "h2review": "Please review this instruction item by item", "notereview": "The instruction is broken into 7 aspects below; let lang = (localStorage.getItem('bp_lang')==='en') ? 'en' : 'zh';
const T = () => L[lang];
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function skey(){ return 'bp_review_' + (document.getElementById('rater').value.trim()||'_anon'); }
function load(){ try{ return JSON.parse(localStorage.getItem(skey())||'{}'); }catch(e){ return {}; } }
function save(s){ localStorage.setItem(skey(), JSON.stringify(s)); }
function saveField(k,v){ const s=load(); s[k]=v; save(s); }

function applyLang(){
  const t = T();
  document.documentElement.lang = (lang==='en') ? 'en' : 'zh-CN';
  document.title = t.title;
  document.querySelectorAll('[data-k]').forEach(el=>{ const k=el.getAttribute('data-k'); if(t[k]!==undefined) el.innerHTML = t[k]; });
  document.querySelectorAll('[data-kph]').forEach(el=>{ const k=el.getAttribute('data-kph'); if(t[k]!==undefined) el.placeholder = t[k]; });
  document.getElementById('bp').textContent = (lang==='en') ? D.base_prompt_en : D.base_prompt;
  const sfx = (lang==='en') ? D.suffixes_en : D.suffixes;
  for(const k of ['low','mid','high']) document.getElementById('sfx-'+k).textContent = sfx[k];
  document.getElementById('langbtn').textContent = t.langbtn;
  const ig = document.getElementById('illus-img');
  if(ig) ig.src = (lang==='en') ? ILLUS.en : ILLUS.zh;
  render();
}
function setLang(){ lang = (lang==='en') ? 'zh' : 'en'; localStorage.setItem('bp_lang', lang); applyLang(); }

function txt(o, field){ return (lang==='en' && o[field+'_en']!==undefined) ? o[field+'_en'] : o[field]; }

function render(){
  const s = load();
  const t = T();
  // questions
  const qhtml = (list, okLabel) => list.map(q=>{
    const v = s[q.id]||{};
    return `<div class="qitem"><div class="qn"><span class="req">*</span> ${esc(txt(q,'name'))}</div>
      <div class="qr">${esc(txt(q,'rule'))}</div><div class="qa">${esc(txt(q,'ask'))}</div>
      <div class="okng">
        <button class="${v.verdict==='ok'?'sel-ok':''}" onclick="setQ('${q.id}','ok')">${okLabel}</button>
        <button class="${v.verdict==='ng'?'sel-ng':''}" onclick="setQ('${q.id}','ng')">${t.needfix}</button>
      </div>
      <textarea placeholder="${esc(t.qph)}" oninput="setQNote('${q.id}',this.value)">${esc(v.note||'')}</textarea></div>`;
  }).join('');
  document.getElementById('pquestions').innerHTML = qhtml(D.pquestions, t.okPrompt);
  document.getElementById('questions').innerHTML = qhtml(D.questions, t.okRule);
  // cases
  const adhmap = {low:t.adhlow, mid:t.adhmid, high:t.adhhigh};
  document.getElementById('cases').innerHTML = D.cases.map((c,i)=>{
    const v = (s.cases||{})[c.cycle_id]||{};
    return `<div class="case ${i===0?'open':''}" id="case-${i}">
      <div class="case-h" onclick="this.parentNode.classList.toggle('open')">
        <span class="cc">${t.sample} ${i+1}</span>
        <span class="badge adh-${c.adherence}">${t.adh}: ${adhmap[c.adherence]}</span>
        ${v.flag?`<span class="badge" style="background:#fee2e2;color:#991b1b">${t.flagged}</span>`:''}
        <span class="chev">▶</span></div>
      <div class="case-b">
        <div class="half"><h4>${t.inhdr}</h4><div class="note" style="margin:-4px 0 6px">${t.fullinput}</div><div class="io">${esc(txt(c,'context'))}</div></div>
        <div class="half"><h4>${t.outhdr}</h4><div class="io">${esc(txt(c,'advice'))}</div></div>
      </div>
      <div class="case-fb">
        <span class="flag"><label><input type="checkbox" ${v.flag?'checked':''} onchange="setCase('${c.cycle_id}','flag',this.checked)">${t.flagcb}</label></span>
        <textarea placeholder="${esc(t.caseph)}" oninput="setCase('${c.cycle_id}','note',this.value)">${esc(v.note||'')}</textarea>
      </div></div>`;
  }).join('');

  // freeze + overall + prompt suggestion
  document.getElementById('fz-yes').className = s.freeze===true?'sel-yes':'';
  document.getElementById('fz-no').className = s.freeze===false?'sel-no':'';
  document.getElementById('overall').value = s.overall||'';
  document.getElementById('promptsuggest').value = s.prompt_suggestion||'';
  document.getElementById('boundarysuggest').value = s.boundary_suggestion||'';
}
function setQ(id,v){ const s=load(); s[id]=s[id]||{}; s[id].verdict=v; save(s); render(); }
function setQNote(id,v){ const s=load(); s[id]=s[id]||{}; s[id].note=v; save(s); }
function setCase(cid,k,v){ const s=load(); s.cases=s.cases||{}; s.cases[cid]=s.cases[cid]||{}; s.cases[cid][k]=v; save(s); if(k==='flag')render(); }
function setFreeze(v){ const s=load(); s.freeze=v; save(s); render(); }
let curKey = skey();
document.getElementById('rater').addEventListener('input', ()=>{
  const nk = skey();
  if(nk!==curKey){
    const old = localStorage.getItem(curKey);
    if(old && old!=='{}' && !localStorage.getItem(nk)) localStorage.setItem(nk, old);
    curKey = nk;
  }
  render();
});

function exportMD(){
  const s = load(); const r = document.getElementById('rater').value.trim()||'(N/A)';
  const en = lang==='en';
  const vd = v => v==='ok'?(en?'OK':'可以'):(v==='ng'?(en?'Needs revision':'需修改'):(en?'(blank)':'（未填）'));
  const nm = q => txt(q,'name');
  let md = (en?`# Base Instruction (Prompt) Review Feedback\n\n- Reviewer: ${r}\n- Template version: ${D.template_version}\n- Date: ${new Date().toISOString().slice(0,10)}\n\n`
              :`# 基础指令（Prompt）审查反馈\n\n- 审查人: ${r}\n- 模板版本: ${D.template_version}\n- 日期: ${new Date().toISOString().slice(0,10)}\n\n`);
  md += en?`## Item-by-item review\n\n`:`## 指令逐项审查\n\n`;
  for(const q of D.pquestions){ const v=s[q.id]||{}; md += `### ${nm(q)} — ${vd(v.verdict)}\n${v.note?v.note+'\n':''}\n`; }
  md += en?`## Boundary questions\n\n`:`## 边界问题\n\n`;
  for(const q of D.questions){ const v=s[q.id]||{}; md += `### ${nm(q)} — ${vd(v.verdict)}\n${v.note?v.note+'\n':''}\n`; }
  md += en?`## Other comments on the instruction\n\n${s.prompt_suggestion||'(none)'}\n\n`:`## 对指令的其他意见\n\n${s.prompt_suggestion||'（无）'}\n\n`;
  md += en?`## Other comments on the safety boundaries\n\n${s.boundary_suggestion||'(none)'}\n\n`:`## 对安全边界的其他意见\n\n${s.boundary_suggestion||'（无）'}\n\n`;
  md += en?`## Sample assessment\n\n`:`## 样例评价\n\n`;
  let anyCase=false;
  D.cases.forEach((c,i)=>{ const v=(s.cases||{})[c.cycle_id]||{};
    if(v.flag||v.note){ anyCase=true;
      md += `- ${en?'Sample':'样例'}${i+1}（${en?'adherence ':'依从性'}${c.adherence}）${v.flag?(en?'[clinical problem]':'【⚠ 临床问题】'):''}: ${v.note||(en?'has a problem':'存在问题')}\n`; }});
  if(!anyCase) md += en?'- No sample flagged or commented\n':'- 无样例被标记问题或评价\n';
  md += en?`\n## Conclusion\n\n- Ready to finalize: ${s.freeze===true?'Yes':(s.freeze===false?'No, needs revision':'(blank)')}\n${s.overall?'- Overall comments: '+s.overall+'\n':''}`
          :`\n## 结论\n\n- 可定稿: ${s.freeze===true?'是':(s.freeze===false?'否，需修改后再审':'（未填）')}\n${s.overall?'- 总体意见: '+s.overall+'\n':''}`;
  download(`base_prompt_review_${r}.md`, md, 'text/markdown');
}
function exportJSON(){
  const r = document.getElementById('rater').value.trim()||'anon';
  download(`base_prompt_review_${r}.json`, JSON.stringify({rater:r, ts:new Date().toISOString(), data:orderFeedback(load())}, null, 1), 'application/json');
}
function download(name, content, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name; a.click();
}
// rebuild the feedback object in page order, independent of click order
function orderFeedback(s){
  const o = {};
  for(const q of D.pquestions){ if(s[q.id]) o[q.id] = s[q.id]; }
  o.prompt_other_comments = s.prompt_suggestion || '';
  for(const q of D.questions){ if(s[q.id]) o[q.id] = s[q.id]; }
  o.boundary_other_comments = s.boundary_suggestion || '';
  const cases = {};
  D.cases.forEach((c,i)=>{ const v=(s.cases||{})[c.cycle_id];
    if(v && (v.flag||v.note)) cases['sample'+(i+1)+'_'+c.cycle_id] = v; });
  if(Object.keys(cases).length) o.cases = cases;
  o.freeze = s.freeze;
  o.overall = s.overall || '';
  return o;
}
const SUPA = {url:'https://wmacfrwnkaobqebzdnze.supabase.co', key:'sb_publishable_0d2Fr-V87t1HLqgq9PN-xA_WFRZHtvT'};
if(SUPA.url){
  document.getElementById('submitbtn').style.display='';
  document.getElementById('bottomsubmit').style.display='';
  document.getElementById('exportbtn').style.display='none';
  document.getElementById('jsonbtn').style.display='none';
}
async function submitToServer(){
  const r = document.getElementById('rater').value.trim();
  if(!r){ alert(T().needName); return; }
  const s = load();
  s.prompt_suggestion = document.getElementById('promptsuggest').value.trim() || s.prompt_suggestion;
  s.boundary_suggestion = document.getElementById('boundarysuggest').value.trim() || s.boundary_suggestion;
  s.overall = document.getElementById('overall').value.trim() || s.overall;
  save(s);
  const missing = D.pquestions.filter(q=>!(s[q.id]||{}).verdict).length
    + D.questions.filter(q=>!(s[q.id]||{}).verdict).length
    + (s.freeze===undefined?1:0);
  const msg = (lang==='en') ? `${missing} required (*) item(s) are still empty. Submit now?`
                            : `还有 ${missing} 个带 * 的项目未填写，确定现在提交吗？`;
  if(missing>0 && !confirm(msg)) return;
  const btn=document.getElementById('submitbtn'); btn.disabled=true; btn.textContent=T().submitting;
  try{
    const res = await fetch(SUPA.url+'/rest/v1/prompt_review', {
      method:'POST',
      headers:{apikey:SUPA.key, Authorization:'Bearer '+SUPA.key,
               'Content-Type':'application/json', Prefer:'return=minimal'},
      body: JSON.stringify([{rater:r, template_version:D.template_version, feedback:orderFeedback(s)}])
    });
    if(!res.ok) throw new Error(await res.text());
    alert(T().submitOk);
  }catch(e){
    const fail = (lang==='en') ? 'Submission failed ('+e.message+'). Please click "Export feedback" to save the file and send it back to the research team.'
                               : '提交失败（'+e.message+'）。请点「导出反馈」保存文件并发回给研究组。';
    alert(fail);
  }finally{ btn.disabled=false; btn.textContent=T().submit; }
}

}, {passive:true});
